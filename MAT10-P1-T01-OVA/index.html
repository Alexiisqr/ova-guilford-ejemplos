<script id="ova-niveles" type="application/json">{"aprendiz":"<!DOCTYPE html>\n<html lang=\"es\"><head><meta charset=\"UTF-8\"><meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Ángulos en posición normal y sistema sexagesimal</title>\n<style>\n/* =========================================================================\n   Identidad visual — Gimnasio Campestre de Guilford (fuente única del kit)\n   Colores tomados por muestreo del sitio web y del logotipo institucional.\n   Los motores y plantillas usan SOLO estas variables. No copie los valores\n   a otros archivos: si cambia un color, se cambia aquí.\n   ========================================================================= */\n@import url('https://fonts.googleapis.com/css2?family=Bitter:wght@600;700&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap');\n\n:root {\n  --g-verde: #35993a;        /* árbol del logotipo */\n  --g-verde-osc: #005d31;    /* titulares del sitio */\n  --g-verde-tinte: #eaf5eb;\n  --g-verde-borde: #cfe6d1;\n  --g-azul: #394e65;         /* navegación principal */\n  --g-azul-osc: #1f3247;\n  --g-azul-tinte: #eef1f5;\n  --g-dorado: #d3a85f;       /* sello 26 años */\n  --g-dorado-osc: #ba934f;\n  --g-dorado-tinte: #fbf4e7;\n\n  --g-tinta: #23282d;\n  --g-texto: #3d4650;\n  --g-suave: #5f6b76;        /* contraste 5,3:1 sobre blanco */\n  --g-linea: #e2e6ea;\n  --g-fondo: #f4f6f7;\n  --g-papel: #ffffff;\n  --g-ok: #2e7d32;\n  --g-alerta: #8a5300;\n  --g-error: #b3261e;\n\n  /* Acento por nivel: <body data-nivel=\"aprendiz|novato\"> */\n  --nivel: var(--g-verde);\n  --nivel-osc: var(--g-verde-osc);\n  --nivel-tinte: var(--g-verde-tinte);\n\n  --serif: 'Bitter', Georgia, 'Times New Roman', serif;\n  --sans: 'Atkinson Hyperlegible', Verdana, 'Segoe UI', system-ui, sans-serif;\n  --r: 10px;\n  --r-l: 16px;\n  --sombra: 0 1px 2px rgba(35,40,45,.06), 0 4px 14px rgba(35,40,45,.06);\n}\nbody[data-nivel=\"novato\"] { --nivel: var(--g-azul); --nivel-osc: var(--g-azul-osc); --nivel-tinte: var(--g-azul-tinte); }\n\n</style><style>\n/* Componentes de los OVA de una pantalla (simulador, juego). Requiere guilford.css antes. */\n*, *::before, *::after { box-sizing: border-box; }\nhtml { -webkit-text-size-adjust: 100%; }\nbody {\n  margin: 0; background: var(--g-fondo); color: var(--g-texto);\n  font-family: var(--sans); font-size: 17px; line-height: 1.6;\n  overflow-x: hidden;\n}\nh1, h2, h3 { font-family: var(--serif); color: var(--g-tinta); line-height: 1.25; margin: 0 0 .5em; }\nh1 { font-size: clamp(1.4rem, 4vw, 2rem); }\nh2 { font-size: clamp(1.15rem, 3vw, 1.45rem); }\nh3 { font-size: 1.08rem; }\np { margin: 0 0 1em; }\nimg, svg, canvas { max-width: 100%; height: auto; }\n:focus-visible { outline: 3px solid var(--g-dorado); outline-offset: 2px; border-radius: 4px; }\n.oculto-visual { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }\n\n.ova-franja { padding: 10px 16px; font-size: .92rem; font-weight: 700; text-align: center; }\n.ova-franja-docente { background: var(--g-dorado-tinte); color: #6b4e17; border-bottom: 2px solid var(--g-dorado); }\n.ova-franja-repaso { background: var(--g-azul-tinte); color: var(--g-azul-osc); border-bottom: 2px solid var(--g-azul); }\n\n.ova-cabecera {\n  display: flex; align-items: center; gap: 14px; flex-wrap: wrap;\n  padding: 12px 20px; background: var(--g-papel); border-bottom: 4px solid var(--nivel);\n}\n.ova-cabecera img { height: 44px; width: auto; }\n.ova-cabecera .titulo { flex: 1 1 240px; min-width: 0; }\n.ova-cabecera .titulo h1 { margin: 0; font-size: clamp(1.1rem, 3.2vw, 1.5rem); }\n.ova-cabecera .titulo small { color: var(--g-suave); }\n.ova-nivel {\n  display: inline-block; padding: 3px 12px; border-radius: 999px; font-size: .82rem; font-weight: 700;\n  background: var(--nivel-tinte); color: var(--nivel-osc); border: 1px solid var(--nivel);\n}\n\n.ova-contenedor { max-width: 980px; margin: 0 auto; padding: 20px 16px 48px; }\n.ova-tarjeta { background: var(--g-papel); border-radius: var(--r-l); box-shadow: var(--sombra); padding: 20px; margin-bottom: 18px; }\n.ova-fase { font-size: .78rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--nivel-osc); margin-bottom: 4px; }\n\n.ova-btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px;\n  padding: 10px 20px; border: 0; border-radius: 999px; cursor: pointer;\n  font: 700 1rem var(--sans); background: var(--nivel); color: #fff;\n}\n.ova-btn:hover { background: var(--nivel-osc); }\n.ova-btn[disabled] { opacity: .5; cursor: not-allowed; }\n.ova-btn.secundario { background: var(--g-papel); color: var(--nivel-osc); border: 2px solid var(--nivel); }\n\n.ova-retro { margin-top: 12px; padding: 12px 14px; border-radius: var(--r); border-left: 5px solid; }\n.ova-retro.ok { background: #e8f5e9; border-color: var(--g-ok); color: #1b4d1f; }\n.ova-retro.mal { background: #fdecea; border-color: var(--g-error); color: #7a1a14; }\n.ova-retro.pista { background: var(--g-dorado-tinte); border-color: var(--g-dorado-osc); color: #5c4313; }\n\n.ova-control { display: grid; gap: 4px; margin: 10px 0; }\n.ova-control label { font-weight: 700; color: var(--g-tinta); }\n.ova-control input[type=range] { width: 100%; accent-color: var(--nivel); min-height: 32px; }\n.ova-control input[type=number], .ova-control input[type=text] {\n  font: 1rem var(--sans); padding: 10px 12px; border: 2px solid var(--g-linea); border-radius: var(--r); min-height: 44px; max-width: 220px;\n}\n.ova-dato { font-size: 1.25rem; font-weight: 700; color: var(--g-tinta); }\n.ova-formula { font-family: var(--serif); font-size: 1.15rem; background: var(--g-fondo); padding: 8px 14px; border-radius: var(--r); display: inline-block; }\n\n.ova-rejilla { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 18px; }\n.ova-progreso { height: 10px; background: var(--g-linea); border-radius: 999px; overflow: hidden; }\n.ova-progreso > span { display: block; height: 100%; background: var(--nivel); transition: width .3s; }\n\n.ova-transcripcion summary { cursor: pointer; font-weight: 700; color: var(--nivel-osc); }\n\n</style>\n<style>\n/* =========================================================================\n   Marco común de los OVA del kit Guilford v3 (todos los tipos, SCORM).\n   Diseño estándar tomado del crucigrama de Laura Alarcón (MAT10-P2-T03, 28-oct-2026):\n   tarjeta 16:9 en escritorio, barra superior con puntos, racha, tiempo y desafíos,\n   ventana de resultado, avisos flotantes y confeti. Requiere guilford.css y ova.css antes.\n   Lo dibuja js/marco.js; el tipo solo pone su actividad dentro de #ova-area.\n   No editar dentro de un OVA: se corrige en _kit/motores/pantalla/ y se vuelve a copiar.\n   ========================================================================= */\n\n:root {\n  /* Aprendiz: verde Guilford */\n  --c-primario: var(--g-verde-osc);\n  --c-primario-luz: var(--g-verde);\n  --c-primario-tinte: var(--g-verde-tinte);\n  --c-primario-borde: #bfe3cc;\n  --c-fondo-general: #f4f7f5;\n  --c-tarjeta-fondo: #ffffff;\n  --c-texto-base: #2d3748;\n  --c-texto-suave: var(--g-suave);\n  --c-linea: #e2e8f0;\n  --c-radio: 12px;\n  --c-sombra: 0 4px 14px rgba(0, 93, 49, 0.08);\n  --c-acierto-fondo: #e8f5e9;\n  --c-acierto-texto: #1b5e20;\n  --c-acierto-borde: #81c784;\n  --c-error-fondo: #ffebee;\n  --c-error-texto: #b71c1c;\n  --c-error-borde: #e57373;\n  /* Acento de logros: el dorado institucional (sello de los 26 años) */\n  --c-oro: #f59e0b;\n  --c-oro-fondo: #fffbeb;\n  --c-oro-borde: #fcd34d;\n  --c-oro-texto: #92400e;\n  --c-fuego: #ef4444;\n  --c-fuego-fondo: #fef2f2;\n  --ui: system-ui, -apple-system, BlinkMacSystemFont, \"Segoe UI\", Roboto, sans-serif;\n}\n/* Novato: azul Guilford */\nbody[data-nivel=\"novato\"] {\n  --c-primario: var(--g-azul-osc);\n  --c-primario-luz: var(--g-azul);\n  --c-primario-tinte: var(--g-azul-tinte);\n  --c-primario-borde: #c7d6e5;\n  --c-fondo-general: #f0f3f6;\n  --c-acierto-fondo: #e3f2fd;\n  --c-acierto-texto: #0d47a1;\n  --c-acierto-borde: #90caf9;\n  --c-sombra: 0 4px 14px rgba(31, 50, 71, 0.08);\n}\n\nbody { background: var(--c-fondo-general); color: var(--c-texto-base); font-family: var(--ui); overflow-x: hidden; }\n\n/* ── Tarjeta principal ─────────────────────────────────────────────── */\n.ova-marco { width: 100%; max-width: 1140px; margin: 0 auto; }\n.ova-tarjeta-marco {\n  position: relative; background: var(--c-tarjeta-fondo); border-radius: var(--c-radio);\n  box-shadow: var(--c-sombra); border: 1px solid var(--c-linea); padding: 10px 14px; max-width: 100%; overflow-x: hidden;\n}\n#ova-area { min-width: 0; }\n\n/* ── Barra superior (HUD + acciones) ───────────────────────────────── */\n.ova-topbar {\n  display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap;\n  background: var(--c-primario-tinte); border: 1px solid var(--c-primario-borde); border-radius: 8px;\n  padding: 4px 10px; margin-bottom: 5px; min-height: 44px; max-width: 100%;\n}\n.topbar-stats { display: flex; align-items: center; flex-wrap: wrap; gap: 7px; font-size: .82rem; font-weight: 700; color: var(--c-primario); }\n.stat-valor { font-size: .95rem; font-weight: 800; }\n.hud-caja {\n  display: inline-flex; align-items: center; gap: 3px; background: #fff; border: 1px solid var(--c-linea);\n  padding: 2px 7px; border-radius: 12px; font-size: .78rem; color: var(--c-texto-suave);\n}\n.hud-etiqueta { font-weight: 700; }\n.hud-puntos { border-color: var(--c-oro-borde); color: var(--c-oro-texto); font-weight: 800; box-shadow: 0 1px 2px rgba(245,158,11,.15); }\n.hud-puntos .num { font-size: .88rem; color: #b45309; }\n.hud-racha { background: var(--c-fuego-fondo); border-color: #fecaca; color: var(--c-fuego); font-weight: 800; animation: racha-pulso 1s infinite alternate; }\n.hud-racha[hidden] { display: none; }\n@keyframes racha-pulso { from { transform: scale(1); } to { transform: scale(1.06); } }\n.hud-desafios { border-color: var(--c-primario-borde); gap: 5px; }\n.desafios-items { display: flex; gap: 4px; }\n\n.medalla-chip {\n  width: 22px; height: 22px; border-radius: 50%; background: #f1f5f9; border: 1px solid #cbd5e1;\n  display: flex; align-items: center; justify-content: center; font-size: .72rem; font-weight: 800; color: #475569;\n  cursor: pointer; padding: 0; font-family: var(--ui); filter: grayscale(1); opacity: .55; transition: all .25s;\n}\nbutton.medalla-chip:hover { opacity: .85; filter: none; }\n.medalla-chip.desbloqueada {\n  filter: none; opacity: 1; background: var(--c-oro-fondo); border-color: var(--c-oro); color: var(--c-oro-texto);\n  box-shadow: 0 0 6px rgba(245,158,11,.5); animation: medalla-pop .4s cubic-bezier(.175,.885,.32,1.275);\n}\n@keyframes medalla-pop { 0% { transform: scale(.6); } 60% { transform: scale(1.35); } 100% { transform: scale(1); } }\n\n.topbar-acciones { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }\n.btn-accion {\n  display: inline-flex; align-items: center; justify-content: center; gap: 3px; min-height: 32px; padding: 4px 10px;\n  border-radius: 16px; font: 700 .78rem var(--ui); border: 1px solid var(--c-primario-borde);\n  background: var(--c-tarjeta-fondo); color: var(--c-primario); cursor: pointer; box-shadow: 0 1px 2px rgba(0,0,0,.05);\n  transition: all .12s; white-space: nowrap;\n}\n.btn-accion:hover { background: var(--c-primario-tinte); }\n.btn-accion.primario { background: var(--c-primario); color: #fff; border-color: var(--c-primario); }\n.btn-accion.primario:hover { background: var(--c-primario-luz); }\n.btn-accion[disabled] { opacity: .5; cursor: not-allowed; }\n.btn-accion[aria-pressed=\"false\"] { color: var(--c-texto-suave); }\n\n.ova-tarjeta-marco .ova-progreso { height: 4px; background: var(--c-primario-tinte); border-radius: 2px; overflow: hidden; margin-bottom: 8px; }\n.ova-tarjeta-marco .ova-progreso > span { display: block; height: 100%; width: 0; background: var(--c-primario-luz); transition: width .3s; }\n\n/* ── Piezas que comparten los tipos ────────────────────────────────── */\n.ova-panel { background: var(--c-primario-tinte); border: 1px solid var(--c-primario-borde); border-radius: 10px; padding: 10px 12px; }\n.ova-panel h3, .ova-seccion-titulo {\n  font: 800 .82rem var(--ui); text-transform: uppercase; letter-spacing: .4px; color: var(--c-primario);\n  margin: 0 0 8px; padding-bottom: 4px; border-bottom: 2px solid var(--c-primario-borde);\n}\n.ova-item {\n  background: #fff; border: 1px solid var(--c-linea); border-radius: 8px; padding: 8px 10px; margin-bottom: 6px;\n  transition: border-color .15s, box-shadow .15s;\n}\n.ova-item.activa { border-color: var(--c-primario-luz); box-shadow: 0 0 0 2px var(--c-primario-borde); background: var(--c-primario-tinte); }\n.ova-item.resuelta { background: var(--c-acierto-fondo); border-color: var(--c-acierto-borde); }\n.ova-etiqueta-chip { display: inline-block; font-size: .72rem; color: var(--c-texto-suave); background: #f1f5f9; border-radius: 6px; padding: 1px 6px; }\n.btn-ayuda {\n  display: inline-block; margin-top: 4px; padding: 1px 8px; border-radius: 999px; font: 700 .72rem var(--ui); cursor: pointer;\n  background: var(--c-oro-fondo); border: 1px solid var(--c-oro-borde); color: var(--c-oro-texto);\n}\n.btn-ayuda:hover { background: #fef3c7; }\n\n/* Opciones de respuesta (presentación, video, juego accesible, simulador) */\n.ova-opciones { display: grid; gap: 8px; margin: 10px 0; }\n.ova-opcion {\n  display: flex; align-items: center; gap: 10px; width: 100%; min-height: 44px; padding: 10px 12px; text-align: left;\n  background: #fff; border: 2px solid var(--c-linea); border-radius: 10px; font: 600 .95rem var(--ui); color: var(--c-texto-base); cursor: pointer;\n}\n.ova-opcion:hover { border-color: var(--c-primario-borde); background: var(--c-primario-tinte); }\n.ova-opcion .letra {\n  flex: 0 0 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center;\n  background: var(--c-primario-tinte); color: var(--c-primario); font-weight: 800;\n}\n.ova-opcion.correcta { border-color: var(--c-acierto-borde); background: var(--c-acierto-fondo); color: var(--c-acierto-texto); }\n.ova-opcion.incorrecta { border-color: var(--c-error-borde); background: var(--c-error-fondo); color: var(--c-error-texto); }\n.ova-opcion[disabled] { cursor: default; }\n\n/* ── Aviso flotante ────────────────────────────────────────────────── */\n.ova-toast {\n  position: absolute; top: 58px; left: 50%;   /* debajo de la barra superior: no tapa puntos ni tiempo */ transform: translateX(-50%); max-width: calc(100% - 24px);\n  background: #1f2937; color: #fff; padding: 8px 16px; border-radius: 24px; font-size: .82rem; font-weight: 700;\n  box-shadow: 0 8px 24px rgba(0,0,0,.25); border: 1px solid #374151; z-index: 100; pointer-events: none;\n  transition: all .3s cubic-bezier(.175,.885,.32,1.275); text-align: center;\n}\n.ova-toast.dorado { background: linear-gradient(135deg, #78350f, #b45309); border-color: var(--c-oro); }\n.ova-toast.oculto { opacity: 0; transform: translateX(-50%) translateY(-15px); }\n\n.ova-confeti { position: fixed; inset: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 9998; }\n\n/* ── Ventanas (resultado, ayuda, respuestas del docente) ───────────── */\n.ova-modal {\n  position: fixed; inset: 0; background: rgba(0,0,0,.65); backdrop-filter: blur(4px); z-index: 10000;\n  display: flex; align-items: center; justify-content: center; padding: 16px;\n}\n.ova-modal[hidden] { display: none; }\n.ova-modal-caja {\n  background: var(--c-tarjeta-fondo); border-radius: 16px; box-shadow: 0 14px 40px rgba(0,0,0,.3); padding: 24px 22px;\n  max-width: 440px; width: 100%; max-height: calc(100vh - 32px); overflow-y: auto; text-align: center;\n  animation: modal-entra .35s cubic-bezier(.175,.885,.32,1.275);\n}\n.ova-modal-caja.ancha { max-width: 760px; text-align: left; }\n@keyframes modal-entra { from { transform: scale(.85); opacity: 0; } to { transform: scale(1); opacity: 1; } }\n.modal-titulo { font: 700 1.3rem var(--serif); color: var(--c-primario); margin: 0 0 6px; }\n.modal-puntaje { margin: 4px 0 12px; color: var(--c-primario); }\n.modal-puntaje .numero { font-size: 2.6rem; font-weight: 800; }\n.modal-puntaje .maximo { font-size: 1.1rem; color: var(--c-texto-suave); font-weight: 700; }\n.modal-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 14px; }\n.modal-stat { background: var(--c-fondo-general); border: 1px solid var(--c-linea); border-radius: 8px; padding: 8px 6px; }\n.modal-stat small { display: block; font-size: .68rem; color: var(--c-texto-suave); text-transform: uppercase; font-weight: 700; }\n.modal-stat span { font-size: 1.15rem; font-weight: 800; color: var(--c-primario); }\n.modal-record { font-size: .8rem; color: #b45309; font-weight: 700; margin-bottom: 10px; }\n.modal-mensaje { margin: 0 0 10px; }\n.modal-sello {\n  display: inline-block; background: #e8f5e9; color: #2e7d32; font-size: .76rem; font-weight: 700;\n  padding: 3px 10px; border-radius: 999px; margin-bottom: 14px; border: 1px solid #a5d6a7;\n}\n.modal-sello.neutro { background: #f1f5f9; color: #475569; border-color: #cbd5e1; }\n.modal-acciones { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }\n.modal-ayuda-caja { background: var(--c-oro-fondo); border-left: 4px solid var(--c-oro); border-radius: 6px; padding: 10px 12px; margin-bottom: 14px; text-align: left; }\n.modal-ayuda-caja p { margin: 0; font-size: .9rem; color: #78350f; line-height: 1.45; }\n.tabla-respuestas { width: 100%; border-collapse: collapse; font-size: .85rem; margin-bottom: 14px; }\n.tabla-respuestas th { background: var(--c-primario); color: #fff; text-align: left; padding: 6px 8px; }\n.tabla-respuestas td { border-bottom: 1px solid var(--c-linea); padding: 6px 8px; vertical-align: top; }\n.tabla-respuestas code { font-size: .75rem; color: var(--c-texto-suave); }\n\n/* Retroalimentación al frente (M.retro): nunca dentro de la actividad */\n.ova-modal-caja.retro { border-top: 6px solid var(--c-linea); }\n.ova-modal-caja.retro.ok { border-top-color: var(--c-acierto-borde); }\n.ova-modal-caja.retro.mal { border-top-color: var(--c-error-borde); }\n.retro-icono { width: 48px; height: 48px; margin: 0 auto 6px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font: 800 1.5rem var(--ui); background: #f1f5f9; color: #475569; }\n.retro.ok .retro-icono { background: var(--c-acierto-fondo); color: var(--c-acierto-texto); }\n.retro.mal .retro-icono { background: var(--c-error-fondo); color: var(--c-error-texto); }\n.retro.ok .modal-titulo { color: var(--c-acierto-texto); }\n.retro.mal .modal-titulo { color: var(--c-error-texto); }\n.modal-retro-texto { text-align: left; font-size: .95rem; line-height: 1.5; margin: 0 0 14px; }\n.modal-retro-texto p { margin: 0 0 .6em; }\n.modal-retro-texto em { color: var(--c-oro-texto); }\n\n/* Panel de desafíos (se abre tocando las medallas) */\n.lista-desafios { list-style: none; margin: 0 0 14px; padding: 0; display: grid; gap: 8px; }\n.desafio-fila { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border: 1px solid var(--c-linea); border-radius: 10px; }\n.desafio-fila.logrado { background: var(--c-oro-fondo); border-color: var(--c-oro-borde); }\n.desafio-fila .medalla-chip { flex: 0 0 30px; width: 30px; height: 30px; cursor: default; }\n.desafio-texto { flex: 1; display: grid; gap: 2px; font-size: .88rem; }\n.desafio-premio { font-weight: 800; color: var(--c-oro-texto); white-space: nowrap; font-size: .85rem; }\n.modal-desafios-logrados { font-size: .85rem; font-weight: 700; color: var(--c-oro-texto); margin-bottom: 6px; }\n\n/* ── Escritorio: tarjeta panorámica 16:9 sin desplazamiento ────────── */\n@media (min-width: 820px) {\n  .ova-cabecera { padding: 6px 18px; margin-bottom: 6px; }\n  .ova-cabecera img { height: 30px; }\n  .ova-cabecera .titulo h1 { font-size: 1.05rem; margin: 0; }\n  .ova-cabecera .titulo small { font-size: .72rem; }\n  .ova-cabecera .ova-nivel { padding: 3px 10px; font-size: .76rem; }\n  .ova-contenedor { padding: 4px 14px 10px; max-width: 1080px; }\n  .ova-tarjeta-marco.panoramica { aspect-ratio: 16 / 9; height: 590px; max-height: 590px; display: flex; flex-direction: column; overflow: hidden; }\n  .ova-tarjeta-marco.panoramica #ova-area { flex: 1; min-height: 0; overflow: hidden; }\n  .ova-topbar { flex-wrap: nowrap; }\n}\n\n/* ── Celular: todo en una columna, cero desbordamiento a 360 px ────── */\n@media (max-width: 819px) {\n  .ova-contenedor { padding: 6px 4px 24px; max-width: 100%; }\n  .ova-tarjeta-marco { padding: 8px 6px; }\n  /* Rejilla de una columna + botones en flex: con grid auto-fit dentro de un flex en columna, Chromium\n     calculaba la fila de botones como si fueran apilados (172 px de hueco; lo midieron 4 motores). */\n  .ova-topbar { display: grid; grid-template-columns: minmax(0, 1fr); gap: 6px; padding: 6px 8px; }\n  .topbar-stats { justify-content: space-between; gap: 4px; font-size: .74rem; }\n  .topbar-acciones { display: flex; flex-wrap: wrap; gap: 4px; width: 100%; }\n  .btn-accion { flex: 1 1 72px; min-height: 40px; padding: 6px 2px; font-size: .74rem; border-radius: 6px; white-space: normal; }\n  .modal-stats { gap: 6px; }\n  .hud-desafios .medalla-chip { width: 28px; height: 28px; }\n  .ova-toast { position: fixed; top: 12px; }   /* visible aunque la página esté desplazada */\n}\n\n</style><style>\n/* =========================================================================\n   Arcade Guilford (JUE) · kit v3. Requiere guilford.css, ova.css y marco.css antes.\n   Escritorio: tarjeta 16:9 del marco, el lienzo del juego a la izquierda y la pregunta a la derecha.\n   Celular: pregunta, juego, flechas y respuestas en una columna.\n   No editar dentro de un OVA: se corrige en _kit/juegos/ y se vuelve a copiar.\n   ========================================================================= */\n.jg { min-width: 0; }\n.jg [hidden], .jg > section[hidden] { display: none !important; }\n\n/* Inicio (conexión) */\n.jg-intro { display: grid; gap: 12px; align-items: center; }\n.jg-intro-arte { display: flex; justify-content: center; }\n.jg-intro-arte img { width: 150px; max-width: 40vw; height: auto; filter: drop-shadow(0 6px 10px rgba(0,0,0,.12)); }\n.jg-intro .ova-panel h2 { font: 700 1.3rem var(--serif); color: var(--c-primario); margin: 2px 0 6px; }\n.jg-intro p { margin: 0 0 8px; font-size: .93rem; line-height: 1.45; }\n.etiqueta-mecanica { display: inline-block; padding: 1px 9px; border-radius: 999px; background: #fff; border: 1px solid var(--c-primario-borde); color: var(--c-primario); font-size: .74rem; text-transform: none; letter-spacing: 0; }\n.jg-opciones { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 10px; }\n.jg-interruptor {\n  display: inline-flex; align-items: center; gap: 8px; min-height: 40px; padding: 6px 12px; border-radius: 999px; cursor: pointer;\n  border: 1px solid var(--c-primario-borde); background: #fff; color: var(--c-texto-base); font: 700 .84rem var(--ui);\n}\n.jg-interruptor::before { content: ''; width: 30px; height: 18px; border-radius: 999px; background: #cbd5e1; box-shadow: inset -12px 0 0 2px #fff; transition: all .15s; flex: none; }\n.jg-interruptor[aria-pressed=\"true\"] { border-color: var(--c-primario-luz); color: var(--c-primario); }\n.jg-interruptor[aria-pressed=\"true\"]::before { background: var(--c-primario-luz); box-shadow: inset 12px 0 0 2px #fff; }\n.jg-cuenta { background: var(--c-oro-fondo); border-left: 4px solid var(--c-oro); border-radius: 6px; padding: 7px 10px; color: var(--c-oro-texto); font-size: .86rem !important; font-weight: 700; }\n.jg-botones { display: flex; flex-wrap: wrap; gap: 8px; }\n\n/* Partida */\n/* Celular: la pregunta y sus respuestas arriba (se leen sin bajar), luego el juego y las flechas. */\n.jg-juego { display: grid; gap: 8px; grid-template-areas: \"pregunta\" \"respuestas\" \"escena\" \"dpad\"; min-width: 0; }\n@media (max-width: 819px) {\n  .leyenda { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; }\n  .leyenda li { min-height: 38px; padding: 4px 8px; font-size: .88rem; gap: 6px; }\n  .leyenda .letra { width: 26px; height: 26px; border-width: 2px; }\n}\n.jg-juego.accesible { grid-template-areas: \"pregunta\" \"respuestas\"; }\n.jg-pregunta { grid-area: pregunta; }\n.jg-escena { grid-area: escena; max-width: 420px; width: 100%; margin: 0 auto; position: relative; }\n.jg-respuestas { grid-area: respuestas; min-width: 0; }\n#lienzo { display: block; width: 100%; height: auto; aspect-ratio: 3 / 4; border-radius: 12px; border: 3px solid var(--c-primario); background: var(--c-primario-tinte); touch-action: none; user-select: none; -webkit-user-select: none; }\n.jg-hud { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; justify-content: space-between; font-weight: 800; color: var(--c-primario); font-size: .82rem; }\n.jg-hud .vidas { color: var(--g-error); letter-spacing: 1px; }\n.jg-etiqueta { background: #fff; border: 1px solid var(--c-primario-borde); border-radius: 999px; padding: 1px 8px; font-size: .72rem; }\n.enunciado { font-size: 1.05rem; font-weight: 700; color: var(--g-tinta); margin: 6px 0 0; line-height: 1.4; }\n.leyenda { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }\n.leyenda li { display: flex; gap: 10px; align-items: center; background: #fff; border: 1px solid var(--c-linea); border-radius: 10px; padding: 6px 10px; min-height: 42px; font-size: .95rem; }\n.leyenda .letra { display: inline-flex; align-items: center; justify-content: center; flex: none; width: 30px; height: 30px; border-radius: 50%; background: #fff; border: 3px solid var(--c-primario); color: var(--c-primario); }\n.leyenda li:has(.op-btn) { padding: 0; border: 0; background: none; }\n.op-btn { width: 100%; text-align: left; min-height: 46px; padding: 8px 12px; border: 2px solid var(--c-linea); border-radius: 10px; background: #fff; font: 600 .95rem var(--ui); color: var(--g-tinta); cursor: pointer; }\n.op-btn:hover { border-color: var(--c-primario-luz); background: var(--c-primario-tinte); }\n.op-btn b { color: var(--c-primario); margin-right: 6px; }\n.op-btn.elegida { border-color: var(--c-primario-luz); box-shadow: 0 0 0 2px var(--c-primario-borde); background: var(--c-primario-tinte); }\n.op-btn.correcta { background: var(--c-acierto-fondo); border-color: var(--c-acierto-borde); color: var(--c-acierto-texto); }\n.op-btn.incorrecta { background: var(--c-error-fondo); border-color: var(--c-error-borde); color: var(--c-error-texto); }\n.op-btn.hecha, #parejas-acc .op-btn[disabled] { background: var(--c-acierto-fondo); border-color: var(--c-acierto-borde); color: var(--c-acierto-texto); cursor: default; }\n#parejas-acc { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }\n.jg-columna { display: grid; gap: 6px; align-content: start; }\n.jg-col-titulo { margin: 0; font: 800 .74rem var(--ui); text-transform: uppercase; letter-spacing: .4px; color: var(--c-primario); }\n#retro-caja .ova-retro { margin-top: 8px; font-size: .9rem; line-height: 1.4; }\n#retro-caja .ova-retro.ok { background: var(--c-acierto-fondo); border-color: var(--c-acierto-borde); color: var(--c-acierto-texto); }\n#retro-caja .ova-retro.mal { background: var(--c-error-fondo); border-color: var(--c-error-borde); color: var(--c-error-texto); }\n#btn-seguir { margin-top: 8px; min-height: 42px; background: var(--c-primario); }\n.dpad { grid-area: dpad; display: grid; grid-template-columns: repeat(3, 56px); grid-template-rows: repeat(2, 46px); gap: 6px; justify-content: center; margin: 0 auto; }\n.dpad[hidden] { display: none; }\n.dpad button { min-height: 44px; border-radius: 10px; border: 2px solid var(--c-primario); background: #fff; color: var(--c-primario); font: 700 1.2rem var(--ui); cursor: pointer; }\n.dpad button:active { background: var(--c-primario-tinte); }\n.dpad [data-dir=\"arriba\"] { grid-column: 2; grid-row: 1; } .dpad [data-dir=\"izq\"] { grid-column: 1; grid-row: 2; }\n.dpad [data-dir=\"abajo\"] { grid-column: 2; grid-row: 2; } .dpad [data-dir=\"der\"] { grid-column: 3; grid-row: 2; }\n\n/* Final (reflexión y transferencia) */\n.jg-final h2 { font: 700 1.25rem var(--serif); color: var(--c-primario); margin: 0 0 6px; }\n.jg-final p { margin: 0 0 8px; font-size: .93rem; }\n.jg-final h3 { margin-top: 10px; }\n.jg-final .ova-retro { margin: 6px 0; font-size: .88rem; }\n.jg-final .ova-retro.mal { background: var(--c-error-fondo); border-color: var(--c-error-borde); color: var(--c-error-texto); }\n.jg-transfer { background: #fff; border: 1px solid var(--c-primario-borde); border-radius: 8px; padding: 8px 10px; }\n\n/* Escritorio: tarjeta 16:9; el lienzo usa todo el alto */\n@media (min-width: 820px) {\n  .jg, .jg > section { height: 100%; min-height: 0; }\n  .jg-intro { grid-template-columns: 220px minmax(0, 1fr); }\n  .jg-intro-arte img { width: 190px; max-width: none; }\n  .jg-intro .ova-panel { max-height: 100%; overflow-y: auto; }\n  .jg-juego { grid-template-columns: auto minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr) auto; grid-template-areas: \"escena pregunta\" \"escena respuestas\" \"escena dpad\"; gap: 10px 14px; }\n  .jg-juego.accesible { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); grid-template-areas: \"pregunta\" \"respuestas\"; max-width: 760px; margin: 0 auto; width: 100%; }\n  .jg-escena { height: 100%; width: auto; max-width: none; margin: 0; }\n  #lienzo { height: 100%; width: auto; }\n  .jg-respuestas { overflow-y: auto; }\n  .jg-final .ova-panel { max-height: 100%; overflow-y: auto; }\n}\n@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }\n\n</style>\n</head><body data-nivel=\"aprendiz\">\n<\u0021-- Juego del kit v3 (Arcade Guilford). El marco (cabecera, puntos, ti n      <p class=\"jg-cuenta\" id=\"estado-envio\" role=\"status\"></p>\n      <div class=\"jg-botones\">\n        <button class=\"ova-btn\" id=\"btn-jugar\" type=\"button\">Jugar la partida que cuenta</button>\n        <button class=\"ova-btn secundario\" id=\"btn-calentar\" type=\"button\">Probar los controles (1 ronda, no cuenta)</button>\n        <button class=\"ova-btn\" id=\"btn-enviar\" type=\"button\" hidden>Enviar mi resultado</button>\n      </div>\n    </div>\n  </section>\n\n  <section id=\"juego\" class=\"jg-juego\" hidden aria-label=\"Partida\">\n    <div class=\"ova-panel jg-pregunta\">\n      <div class=\"jg-hud\"><span id=\"hud-ronda\"></span><span class=\"vidas\" id=\"hud-vidas\"></span><span class=\"jg-etiqueta\" id=\"hud-modo\"></span></div>\n      <p class=\"enunciado\" id=\"enunciado\" aria-live=\"polite\"></p>\n    </div>\n    <div class=\"jg-escena\" id=\"escena\">\n      <canvas id=\"lienzo\" width=\"360\" height=\"480\" role=\"img\" aria-label=\"Zona de juego: mueve a Guili con el dedo, las flechas en pantalla o las del teclado.\"></canvas>\n    </div>\n    <div class=\"dpad\" id=\"dpad\" hidden aria-label=\"Controles de dirección\">\n      <button type=\"button\" data-dir=\"arriba\" aria-label=\"Arriba\">▲</button>\n      <button type=\"button\" data-dir=\"izq\" aria-label=\"Izquierda\">◀</button>\n      <button type=\"button\" data-dir=\"abajo\" aria-label=\"Abajo\">▼</button>\n      <button type=\"button\" data-dir=\"der\" aria-label=\"Derecha\">▶</button>\n    </div>\n    <div class=\"jg-respuestas\">\n      <ol class=\"leyenda\" id=\"leyenda\" aria-label=\"Respuestas\"></ol>\n      <div id=\"parejas-acc\" hidden></div>\n    </div>\n  </section>\n\n  <section id=\"final\" class=\"jg-final\" hidden aria-labelledby=\"final-titulo\">\n    <div class=\"ova-panel\">\n      <h3>Reflexión y transferencia</h3>\n      <h2 id=\"final-titulo\"></h2>\n      <p id=\"final-texto\"></p>\n      <p class=\"jg-transfer\"><strong id=\"transferencia\"></strong></p>\n      <div id=\"final-repaso\"></div>\n      <div class=\"jg-botones\">\n        <button class=\"ova-btn secundario\" id=\"btn-otra\" type=\"button\">Jugar otra vez (práctica)</button>\n        <button class=\"ova-btn secundario\" id=\"btn-inicio\" type=\"button\">Volver al inicio</button>\n      </div>\n    </div>\n  </section>\n</main>\n<script>window.OVA_DEMO = true;<\/script>\n<script>\n/*\n * ova-scorm.js — Envoltorio SCORM 1.2 de los OVA del kit Guilford (v3: todos los tipos son SCORM).\n * Herramienta preexistente del contratista (Anexo E, literal a). No editar dentro de un OVA:\n * se corrige en _kit/motores/pantalla/ y se vuelve a copiar.\n *\n * Lo que el autor usa (nada más):\n *\n *   const sesion = OVA.iniciar('id-del-ova', { sigla: 'CRU' });   // { modo, estado }\n *      modo: 'normal'  → estudiante, escribe en Moodle\n *            'repaso'  → estudiante que reabre un intento cerrado: ve lo suyo, no escribe\n *            'docente' → vista previa del docente: TODO abierto, no escribe\n *            'local'   → sin Moodle (vista local o página pública): no escribe\n *      estado: lo último que se guardó con OVA.guardar(), o null\n *   OVA.guardar(estado)          // objeto pequeño (cabe en 4000 caracteres con margen)\n *   OVA.registrar({ clave, tipo, respuesta, esperada, correcta, descripcion })\n *   OVA.finalizar(puntaje, resumen)   // 0 a 100; ÚNICO momento en que se envía la nota (una vez por intento)\n *   OVA.soloLectura              // true en repaso, docente y local\n *   OVA.finalizado               // true cuando la nota de este intento ya quedó enviada\n *\n * MAPEO PARA EL DOCENTE (lo que se ve en Moodle → Informes del SCORM):\n *  - Interacciones: el id es  SIGLA_clave  (por ejemplo CRU_periodo, SOP_amplitud, ARR_03_clasificar).\n *    La «clave» la da el motor del tipo y es ESTABLE: no cambia de un estudiante a otro aunque el\n *    orden o la posición sean aleatorios. Así la columna del informe siempre es la misma pregunta.\n *    El enunciado va una sola vez en cmi.comments como «[SIGLA_clave] enunciado».\n *  - Resumen como interacciones (Informes → Interacciones y su CSV), solo al finalizar:\n *      RES_nota_0a100 · RES_aciertos_sin_ayuda · RES_aciertos_con_ayuda · RES_preguntas_total · RES_ayudas_usadas · RES_desafios_logrados · RES_minutos\n *  - Lo mismo como objetivos (Informes → Objetivos; en Moodle 4.5.14 ese informe no pinta las celdas,\n *    pero se ven en el seguimiento del intento), con nombre propio:\n *      Nota_0a100 · Aciertos_sin_ayuda · Aciertos_con_ayuda · Preguntas_total · Ayudas_usadas · Minutos\n *    (los que el motor no informe no se escriben).\n *  - cmi.comments termina con una línea  [RESUMEN] Nota 75/100 · 6 de 8 sin ayuda · 2 ayudas · 4 min 12 s\n *  - Tiempo: cmi.core.session_time en cada guardado y al salir (Moodle lo suma en «Tiempo total»).\n *\n * Reglas de Moodle que este archivo cumple (verificadas en Moodle 4.5 real, 8-sep-2026 y 13-oct-2026):\n *  1. cmi.core.score.raw solo se escribe en finalizar(). Con la nota escrita y el intento\n *     incompleto, Moodle da el intento por terminado y el estudiante ya no puede reanudar.\n *  2. El docente se detecta SOLO con lesson_mode == \"browse\". «credit» no sirve: Moodle manda\n *     no-credit también al estudiante que reabre su intento.\n *  3. En «review» Moodle acepta escrituras; la guarda de solo lectura está aquí, no en Moodle.\n *  4. La numeración de interacciones parte del mayor entre _count y lo guardado, para que un\n *     intento reanudado no escriba encima de las respuestas anteriores.\n *  5. cmi.comments se AÑADE (Moodle concatena): se escribe solo la línea nueva, nunca el texto completo.\n *  6. Las puntuaciones de objetivos van de 0 a 100 (Moodle rechaza otro rango).\n */\n(function () {\n  'use strict';\n\n  var api = null, modo = 'local', iniciado = false, terminado = false;\n  var inicio = Date.now(), nInteraccion = 0, estadoActual = null, ultimaRespuesta = Date.now();\n  var LIMITE_SUSPEND = 4000;\n  var comentados = {};\n\n  function buscarAPI(w) {\n    var saltos = 0;\n    while (w && saltos < 12) {\n      try { if (w.API) return w.API; } catch (e) { return null; }\n      if (w.parent === w) break;\n      w = w.parent; saltos++;\n    }\n    return null;\n  }\n  function encontrarAPI() {\n    var a = buscarAPI(window);\n    if (!a && window.opener) a = buscarAPI(window.opener);\n    return a;\n  }\n  function leer(k) { try { return api ? String(api.LMSGetValue(k)) : ''; } catch (e) { return ''; } }\n  function escribir(k, v) {\n    if (!api || OVA.soloLectura) return false;\n    try { return String(api.LMSSetValue(k, String(v))) === 'true'; } catch (e) { return false; }\n  }\n  function confirmar() { if (api && !OVA.soloLectura) try { api.LMSCommit(''); } catch (e) {} }\n\n  function tiempoScorm(ms) {\n    var s = Math.max(0, Math.round(ms / 1000));\n    var h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), x = s % 60;\n    function d(n) { return (n < 10 ? '0' : '') + n; }\n    return (h < 1000 ? d(h) : '9999') + ':' + d(m) + ':' + d(x);\n  }\n  function limpiar(v, max) { return String(v == null ? '' : v).replace(/[\\r\\n]+/g, ' ').slice(0, max || 255); }\n  /* Clave legible y estable: sin tildes, minúsculas, solo letras, números y guion bajo. */\n  function slug(t, max) {\n    return String(t == null ? '' : t).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase()\n      .replace(/ñ/g, 'n').replace(/[^a-z0-9]+/g, '_').replace(/^_+|_+$/g, '').slice(0, max || 40) || 'x';\n  }\n  function idLegible(clave) {\n    var s = OVA.sigla ? OVA.sigla + '_' : '';\n    return (s + slug(clave, 60)).slice(0, 255);\n  }\n  function comentar(etiqueta, texto) {\n    if (comentados[etiqueta]) return;\n    var previo = leer('cmi.comments');\n    if (previo.indexOf('[' + etiqueta + ']') >= 0) { comentados[etiqueta] = true; return; }\n    var linea = '[' + etiqueta + '] ' + limpiar(texto, 200);\n    if ((previo + linea).length >= 4000) return;\n    if (escribir('cmi.comments', previo ? ' | ' + linea : linea)) comentados[etiqueta] = true;\n  }\n  function minSeg(s) { s = Math.round(s); return Math.floor(s / 60) + ' min ' + (s % 60) + ' s'; }\n\n  function franja(texto, clase) {\n    var pintar = function () {\n      if (document.getElementById('ova-franja')) return;\n      var d = document.createElement('div');\n      d.id = 'ova-franja'; d.className = 'ova-franja ' + clase; d.setAttribute('role', 'status');\n      d.textContent = texto;\n      document.body.insertBefore(d, document.body.firstChild);\n    };\n    if (document.body) pintar(); else document.addEventListener('DOMContentLoaded', pintar);\n  }\n\n  var OVA = {\n    modo: 'local',\n    soloLectura: true,\n    finalizado: false,\n    sigla: '',\n    alumno: '',\n    slug: slug,\n    idLegible: idLegible,\n\n    iniciar: function (id, opciones) {\n      if (iniciado) return { modo: modo, estado: estadoActual };\n      iniciado = true;\n      opciones = opciones || {};\n      OVA.id = id || 'ova';\n      OVA.sigla = String(opciones.sigla || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 6);\n      api = encontrarAPI();\n      if (api) {\n        try { api.LMSInitialize(''); } catch (e) {}\n        var lm = leer('cmi.core.lesson_mode');\n        modo = lm === 'browse' ? 'docente' : lm === 'review' ? 'repaso' : 'normal';\n        OVA.alumno = leer('cmi.core.student_id');\n      } else {\n        modo = 'local';\n      }\n      OVA.modo = modo;\n      OVA.soloLectura = modo !== 'normal';\n      OVA.estadoInicial = null;\n\n      // Estado guardado: se lee en normal y en repaso (el estudiante ve lo suyo). El docente parte limpio.\n      if (api && modo !== 'docente') {\n        var bruto = leer('cmi.suspend_data');\n        if (bruto) {\n          try {\n            var paquete = JSON.parse(bruto);\n            estadoActual = paquete.e || null;\n            nInteraccion = paquete.n || 0;\n            OVA.finalizado = !!paquete.f;\n          } catch (e) { e a barra espaciadora para que Guili aletee. Cruza la puerta de la respuesta correcta.',\n  formato: 'preguntas', maxOpciones: 3,\n  crear: function (ctx) {\n    var W = ctx.W, H = ctx.H, SUELO = H - 36, X = 96, R = 15, ANCHO = 64, TOPE = 20, G = 1000, IMP = -330;\n    var y, vy, muro, retraso, ops;\n    function banda(n) { return (SUELO - 8 - TOPE) / n; }\n    function hueco(n) { return n === 2 ? 118 : 112; }\n    function centro(i) { return TOPE + banda(ops.length) * (i + 0.5); }\n    function aletear() { vy = IMP; ctx.sonido('salto'); }\n    return {\n      nuevaRonda: function (r) { ops = r.opciones; y = H / 2; vy = 0; muro = null; retraso = 1.6; },\n      entrada: function (tipo) { if (tipo === 'tap' || (tipo === 'dir')) aletear(); if (tipo === 'puntero') { /* un toque basta */ } },\n      paso: function (dt) {\n        vy += G * dt; y += vy * dt;\n        if (y < R) { y = R; vy = 0; }\n        if (y + R >= SUELO) return ctx.tropiezo('¡Al suelo!');\n        if (retraso > 0) { retraso -= dt; if (retraso <= 0) muro = { x: W + 20, pasa: -1 }; return; }\n        if (!muro) return;\n        muro.x -= 112 * ctx.v * dt;\n        if (X + R > muro.x && X - R < muro.x + ANCHO) {\n          var n = ops.length, h = hueco(n), dentro = -1;\n          for (var i = 0; i < n; i++) { var c = centro(i); if (y - R >= c - h / 2 && y + R <= c + h / 2) dentro = i; }\n          if (dentro < 0) return ctx.tropiezo('¡Choque!');\n          muro.pasa = dentro;\n        } else if (muro.x + ANCHO < X - R) { var i2 = muro.pasa; muro = null; if (i2 >= 0) ctx.responder(i2); }\n      },\n      bot: function () {\n        var k = ops.findIndex(function (o) { return o.correcta; }), objetivo = centro(k);\n        if (y > objetivo + 20 && vy > -40) aletear();\n      },\n      dibujar: function (g) {\n        ctx.fondo(ctx.t);\n        g.fillStyle = ctx.col.osc; g.fillRect(0, SUELO, W, H - SUELO);\n        g.fillStyle = ctx.col.nivel; g.fillRect(0, SUELO, W, 6);\n        if (muro && ops) {\n
