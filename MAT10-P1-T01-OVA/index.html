- xC) < 6) disparar();\n      },\n      dibujar: function (g) {\n        ctx.fondo(ctx.t);\n        bloques.forEach(function (b) {\n          var bx = b.x + Math.sin(ctx.t * 1.2 + b.ph) * 10;\n          g.beginPath(); g.ellipse(bx, b.y, 31, 34, 0, 0, 7); g.fillStyle = '#fff'; g.fill(); g.lineWidth = 3; g.strokeStyle = ctx.col.osc; g.stroke();\n          ctx.texto(ops[b.i].letra, bx, b.y, { tam: 28, color: ctx.col.osc });\n        });\n        balas.forEach(function (b) { ctx.rr(b.x - 4, b.y - 12, 8, 24, 4, ctx.col.nivel, ctx.col.osc); });\n        g.fillStyle = ctx.col.osc; g.fillRect(0, YC + 24, W, H - YC - 24);\n        ctx.rr(xC - 14, YC - 24, 28, 36, 8, ctx.col.nivel, ctx.col.osc);\n        ctx.sprite(xC, YC + 6, 44);\n      }\n    };\n  }\n});\n\n<\/script><script>\n/* Laberinto de respuestas: Guili sale del CENTRO y cada lado tiene una puerta con una respuesta\n   (A arriba, B derecha, C abajo, D izquierda). Los caminos son cortos y de largo parecido, para que\n   el reto sea pensar la respuesta, no recorrer el laberinto ni adivinar por la puerta más cercana. */\nArcade.mecanica('laberinto', {\n  nombre: 'Laberinto de respuestas',\n  descripcion: 'En cada ronda aparece un laberinto nuevo. Guili empieza en el centro y en cada lado hay una puerta con una respuesta: hay que salir por la correcta.',\n  ideal: 'preguntas para pensar con calma: piensa la respuesta y planea un camino corto',\n  controles: 'Desliza el dedo sobre el laberinto, usa los botones de flechas o las flechas del teclado para mover a Guili desde el centro hasta la puerta de tu respuesta.',\n  formato: 'preguntas', maxOpciones: 4, dpad: true, alto: 360,   // lienzo cuadrado: el tablero usa todo el espacio\n  crear: function (ctx) {\n    var N = 9, T = 32, MEDIO = Math.floor(N / 2), ops, mur, px, py, ax, ay, puertas;\n    var X0 = (ctx.W - N * T) / 2, Y0 = (ctx.H - N * T) / 2;\n    /* Puerta de cada lado: celda junto al borde y dirección para salir por ella. */\n    var LADOS = { n: { x: MEDIO, y: 0, dir: 'arriba' }, e: { x: N - 1, y: MEDIO, dir: 'der' }, s: { x: MEDIO, y: N - 1, dir: 'abajo' }, o: { x: 0, y: MEDIO, dir: 'izq' } };\n    function ladosPara(n) { return { 2: ['n', 's'], 3: ['n', 'e', 's'], 4: ['n', 'e', 's', 'o'] }[n]; }\n    var D = { arriba: [0, -1, 'n', 's'], abajo: [0, 1, 's', 'n'], der: [1, 0, 'e', 'o'], izq: [-1, 0, 'o', 'e'] };\n\n    function vacio() { mur = []; for (var y = 0; y < N; y++) { mur.push([]); for (var x = 0; x < N; x++) mur[y].push({ n: 1, s: 1, e: 1, o: 1, v: 0 }); } }\n    function abrir(x, y, d) { var k = D[d]; mur[y][x][k[2]] = 0; mur[y + k[1]][x + k[0]][k[3]] = 0; }\n    /* Prim aleatorio desde el centro (ramas cortas) y luego algunos atajos (lazos) para acortar caminos. */\n    function generar() {\n      vacio();\n      mur[MEDIO][MEDIO].v = 1;\n      var frontera = [];\n      function agregar(x, y) { Object.keys(D).forEach(function (d) { var nx = x + D[d][0], ny = y + D[d][1]; if (nx >= 0 && ny >= 0 && nx < N && ny < N && !mur[ny][nx].v) frontera.push([x, y, d]); }); }\n      agregar(MEDIO, MEDIO);\n      while (frontera.length) {\n        var i = Math.floor(ctx.rnd() * frontera.length), f = frontera.splice(i, 1)[0], nx = f[0] + D[f[2]][0], ny = f[1] + D[f[2]][1];\n        if (mur[ny][nx].v) continue;\n        abrir(f[0], f[1], f[2]); mur[ny][nx].v = 1; agregar(nx, ny);\n      }\n      for (var k = 0; k < 10; k++) {\n        var x = 1 + Math.floor(ctx.rnd() * (N - 2)), y = 1 + Math.floor(ctx.rnd() * (N - 2)), d = ctx.barajar(['arriba', 'abajo', 'der', 'izq'])[0];\n        abrir(x, y, d);\n      }\n    }\n    function vecinos(x, y) {\n      var r = [], m = mur[y][x];\n      if (!m.n && y > 0) r.push([x, y - 1, 'arriba']); if (!m.s && y < N - 1) r.push([x, y + 1, 'abajo']);\n      if (!m.e && x < N - 1) r.push([x + 1, y, 'der']); if (!m.o && x > 0) r.push([x - 1, y, 'izq']);\n      return r;\n    }\n    function distancias() {\n      var dist = {}, cola = [[MEDIO, MEDIO]]; dist[MEDIO + ',' + MEDIO] = 0;\n      while (cola.length) { var c = cola.shift(); vecinos(c[0], c[1]).forEach(function (v) { var k = v[0] + ',' + v[1]; if (dist[k] == null) { dist[k] = dist[c[0] + ',' + c[1]] + 1; cola.push(v); } }); }\n      return dist;\n    }\n    /* Se prueban varios laberintos y se queda el que tenga las puertas a distancias cortas y parecidas. */\n    function elegirLaberinto() {\n      var mejor = null, mejorPunt = Infinity;\n      for (var intento = 0; intento < 60; intento++) {\n        generar();\n        var dist = distancias(), ds = puertas.map(function (l) { return dist[LADOS[l].x + ',' + LADOS[l].y]; });\n        var max = Math.max.apply(null, ds), min = Math.min.apply(null, ds);\n        var punt = (max - min) * 3 + Math.max(0, max - 10) * 2 + Math.max(0, 6 - min) * 2;\n        if (punt < mejorPunt) { mejorPunt = punt; mejor = JSON.stringify(mur); }\n        if (punt === 0) break;\n      }\n      mur = JSON.parse(mejor);\n    }\n    function mover(d) {\n      var m = mur[py][px];\n      for (var i = 0; i < puertas.length; i++) {   // salir por una puerta = responder\n        var L = LADOS[puertas[i]];\n        if (px === L.x && py === L.y && d === L.dir) return ctx.responder(i);\n      }\n      var k = D[d], nx = px + k[0], ny = py + k[1];\n      if (m[k[2]] || nx < 0 || ny < 0 || nx >= N || ny >= N) return;\n      px = nx; py = ny; ctx.sonido('salto');\n    }\n    function camino(i) {   // primera dirección del camino más corto hasta la puerta i\n      var L = LADOS[puertas[i]], vis = {}, cola = [[px, py, null]]; vis[px + ',' + py] = 1;\n      while (cola.length) {\n        var c = cola.shift();\n        if (c[0] === L.x && c[1] === L.y) return c[2] || L.dir;\n        vecinos(c[0], c[1]).forEach(function (v) { var key = v[0] + ',' + v[1]; if (!vis[key]) { vis[key] = 1; cola.push([v[0], v[1], c[2] || v[2]]); } });\n      }\n      return null;\n    }\n    function centro(x, y) { return [X0 + x * T + T / 2, Y0 + y * T + T / 2]; }\n    function posInsignia(l) {\n      var L = LADOS[l], c = centro(L.x, L.y), r = 15;\n      return { n: [c[0], Y0 - r - 3], s: [c[0], Y0 + N * T + r + 3], e: [X0 + N * T + r + 3, c[1]], o: [X0 - r - 3, c[1]] }[l];   // cada letra justo al frente de su salida\n    }\n    var espera = 0;\n    return {\n      nuevaRonda: function (r) { ops = r.opciones; puertas = ladosPara(ops.length); elegirLaberinto(); px = py = ax = ay = MEDIO; espera = 0; },\n      entrada: function (tipo, d) { if (tipo === 'dir') mover(d); },\n      paso: function (dt) { ax += (px - ax) * Math.min(1, dt * 14); ay += (py - ay) * Math.min(1, dt * 14); espera -= dt; },\n      bot: function () {\n        if (espera > 0) return; espera = 0.11;\n        var i = ops.findIndex(function (o) { return o.correcta; }), d = camino(i);\n        if (d) mover(d);\n      },\n      dibujar: function (g) {\n        ctx.fondo(ctx.t, ctx.col.tinte);\n        // casilla de salida\n        var c0 = centro(MEDIO, MEDIO);\n        g.fillStyle = 'rgba(211,168,95,.25)'; g.beginPath(); g.arc(c0[0], c0[1], T * 0.42, 0, 7); g.fill();\n        g.lineCap = 'round'; g.strokeStyle = ctx.col.osc; g.lineWidth = 5;\n        function esPuerta(x, y, lado) { return puertas.some(function (l) { return l === lado && LADOS[l].x === x && LADOS[l].y === y; }); }\n        for (var y = 0; y < N; y++) for (var x = 0; x < N; x++) {\n          var m = mur[y][x], x1 = X0 + x * T, y1 = Y0 + y * T;\n          g.beginPath();\n          if (m.n && !esPuerta(x, y, 'n')) { g.moveTo(x1, y1); g.lineTo(x1 + T, y1); }\n          if (m.s && !esPuerta(x, y, 's')) { g.moveTo(x1, y1 + T); g.lineTo(x1 + T, y1 + T); }\n          if (m.o && !esPuerta(x, y, 'o')) { g.moveTo(x1, y1); g.lineTo(x1, y1 + T); }\n          if (m.e && !esPuerta(x, y, 'e')) { g.moveTo(x1 + T, y1); g.lineTo(x1 + T, y1 + T); }\n          g.stroke();\n        }\n        for (var i = 0; i < puertas.length; i++) { var p = posInsignia(puertas[i]); ctx.insignia(ops[i].letra, p[0], p[1], 14, '#fff'); }\n        var s = centro(ax, ay); ctx.sprite(s[0], s[1] + 1, 30);\n      }\n    };\n  }\n});\n\n<\/script>\n<script>\n/* Serpiente de respuestas: la serpiente come la respuesta correcta sin chocar con el borde ni con su cola. */\nArcade.mecanica('serpiente', {\n  nombre: 'Serpiente de respuestas',\n  descripcion: 'Una serpiente recorre el tablero. Cada manzana es una respuesta: hay que comer la correcta sin chocar.',\n  ideal: 'preguntas de elegir una respuesta, con un poco de estrategia',\n  controles: 'Desliza el dedo, usa los botones de flechas o las flechas del teclado para girar.',\n  formato: 'preguntas', maxOpciones: 4, dpad: true,\n  crear: function (ctx) {\n    var C = 12, F = 16, T = 30, ops, cuerpo, dir, sig, comida, acum, objetivoCola;\n    var V = { izq: [-1, 0], der: [1, 0], arriba: [0, -1], abajo: [0, 1] };\n    function libre(x, y) { return !cuerpo.some(function (c) { return c[0] === x && c[1] === y; }) && !comida.some(function (f) { return f.x === x && f.y === y; }); }\n    function colocar() {\n      comida = [];\n      ops.forEach(function (o, i) {\n        for (var n = 0; n < 200; n++) {\n          var x = 1 + Math.floor(ctx.rnd() * (C - 2)), y = 1 + Math.floor(ctx.rnd() * (F - 2));\n          if (libre(x, y) && Math.abs(x - 6) + Math.abs(y - 10) > 3 && comida.every(function (f) { return Math.abs(f.x - x) + Math.abs(f.y - y) > 3; })) { comida.push({ x: x, y: y, i: i }); return; }\n        }\n        comida.push({ x: 1 + i * 2, y: 2, i: i });\n      });\n    }\n    function orientar(d) { if (V[d][0] + V[dir][0] === 0 && V[d][1] + V[dir][1] === 0) return; sig = d; }\n    return {\n      nuevaRonda: function (r) { ops = r.opciones; cuerpo = [[6, 10], [5, 10], [4, 10]]; dir = 'der'; sig = 'der'; acum = 0; colocar(); },\n      entrada: function (tipo, d) { if (tipo === 'dir') orientar(d); },\n      paso: function (dt) {\n        acum += dt; var cada = 0.23 / ctx.v;\n        while (acum >= cada) {\n          acum -= cada; dir = sig;\n          var h = cuerpo[0], nx = h[0] + V[dir][0], ny = h[1] + V[dir][1];\n          if (nx < 0 || ny < 0 || nx >= C || ny >= F) return ctx.tropiezo('¡Choque con el borde!');\n          if (cuerpo.slice(0, -1).some(function (c) { return c[0] === nx && c[1] === ny; })) return ctx.tropiezo('¡Te mordiste la cola!');\n          cuerpo.unshift([nx, ny]); cuerpo.pop();\n          var f = comida.filter(function (q) { return q.x === nx && q.y === ny; })[0];\n          if (f) return ctx.responder(f.i);\n        }\n      },\n      bot: function () {   // anchura hacia la manzana correcta, evitando el cuerpo\n        var k = comida.filter(function (f) { return ops[f.i].correcta; })[0], h = cuerpo[0], vis = {}, cola = [[h[0], h[1], null]];\n        vis[h[0] + ',' + h[1]] = 1;\n        var ocupado = {}; cuerpo.slice(0, -1).forEach(function (c) { ocupado[c[0] + ',' + c[1]] = 1; });\n        while (cola.length) {\n          var c = cola.shift();\n          if (c[0] === k.x && c[1] === k.y) { if (c[2]) orientar(c[2]); return; }\n          Object.keys(V).forEach(function (d) {\n            var x = c[0] + V[d][0], y = c[1] + V[d][1], key = x + ',' + y;\n            if (x < 0 || y < 0 || x >= C || y >= F || vis[key] || ocupado[key]) return;\n            if (comida.some(function (f) { return f.x === x && f.y === y && f !== k; })) return;\n            vis[key] = 1; cola.push([x, y, c[2] || d]);\n          });\n        }\n      },\n      dibujar: function (g) {\n        ctx.fondo(ctx.t, ctx.col.tinte);\n        for (var y = 0; y < F; y++) for (var x = 0; x < C; x++) if ((x + y) % 2) { g.fillStyle = 'rgba(0,0,0,.035)'; g.fillRect(x * T, y * T, T, T); }\n        comida.forEach(function (f) { ctx.rr(f.x * T + 2, f.y * T + 2, T - 4, T - 4, 9, '#fff', ctx.col.osc); ctx.texto(ops[f.i].letra, f.x * T + T / 2, f.y * T + T / 2 + 1, { tam: 17, color: ctx.col.osc }); });\n        for (var i = cuerpo.length - 1; i > 0; i--) ctx.rr(cuerpo[i][0] * T + 3, cuerpo[i][1] * T + 3, T - 6, T - 6, 8, i % 2 ? ctx.col.nivel : ctx.col.osc);\n        ctx.sprite(cuerpo[0][0] * T + T / 2, cuerpo[0][1] * T + T / 2, T + 6);\n      }\n    };\n  }\n});\n\n<\/script><script>\n/* Memoria de parejas: se voltean cartas para unir cada término con su pareja. */\nArcade.mecanica('memoria', {\n  nombre: 'Memoria de parejas',\n  descripcion: 'Cartas boca abajo. Se voltean de dos en dos para encontrar cada término con su pareja.',\n  ideal: 'vocabulario, términos y definiciones, fórmula y nombre; es el más tranquilo',\n  controles: 'Toca o haz clic en una carta para voltearla. Encuentra las dos que forman pareja.',\n  formato: 'parejas',\n  crear: function (ctx) {\n    var W = ctx.W, H = ctx.H, cartas, abiertas, espera, COL = 3, T0 = 6, CW, CH;\n    function disp(n) { COL = n <= 6 ? 3 : 4; var filas = Math.ceil(n * 2 / COL); CW = (W - 20 - (COL - 1) * 8) / COL; CH = Math.min(96, (H - 20 - (filas - 1) * 8) / filas); return filas; }\n    function xy(i) { return { x: 10 + (i % COL) * (CW + 8), y: 10 + Math.floor(i / COL) * (CH + 8) }; }\n    function voltear(i) {\n      var c = cartas[i]; if (!c || c.hecha || c.abierta || abiertas.length >= 2) return;\n      c.abierta = true; abiertas.push(i); ctx.sonido('salto');\n      if (abiertas.length === 2) espera = 0.75;\n    }\n    return {\n      nuevaRonda: function (r) {\n        var ps = r.parejas; disp(ps.length); cartas = [];\n        ps.forEach(function (p, i) { cartas.push({ par: i, txt: p.a }); cartas.push({ par: i, txt: p.b }); });\n        cartas = ctx.barajar(cartas); abiertas = []; espera = 0;\n      },\n      entrada: function (tipo, d) {\n        if (tipo !== 'tap' || !d) return;\n        for (var i = 0; i < cartas.length; i++) { var p = xy(i); if (d.x >= p.x && d.x <= p.x + CW && d.y >= p.y && d.y <= p.y + CH) { voltear(i); return; } }\n      },\n      paso: function (dt) {\n        if (abiertas.length === 2) {\n          espera -= dt; if (espera > 0) return;\n          var a = cartas[abiertas[0]], b = cartas[abiertas[1]], ok = a.par === b.par;\n          if (ok) { a.hecha = b.hecha = true; } a.abierta = b.abierta = false; abiertas = [];\n          ctx.intento(ok, a.par + 1);\n        }\n      },\n      bot: function () {\n        if (abiertas.length >= 2) return;\n        var libres = cartas.map(function (c, i) { return i; }).filter(function (i) { return !cartas[i].hecha && !cartas[i].abierta; });\n        if (abiertas.length === 1) { var o = cartas[abiertas[0]]; voltear(libres.filter(function (i) { return cartas[i].par === o.par; })[0]); }\n        else voltear(libres[0]);\n      },\n      dibujar: function (g) {\n        ctx.fondo(ctx.t, ctx.col.tinte);\n        cartas.forEach(function (c, i) {\n          var p = xy(i);\n          if (c.hecha) { ctx.rr(p.x, p.y, CW, CH, 12, ctx.col.tinte, ctx.col.nivel); ctx.parrafo(c.txt, p.x + CW / 2, p.y + CH / 2, CW - 10, CH - 8, { tam: 13, color: ctx.col.osc }); }\n          else if (c.abierta) { ctx.rr(p.x, p.y, CW, CH, 12, '#fff', ctx.col.osc); ctx.parrafo(c.txt, p.x + CW / 2, p.y + CH / 2, CW - 10, CH - 8, { tam: 13 }); }\n          else { ctx.rr(p.x, p.y, CW, CH, 12, ctx.col.nivel, ctx.col.osc); ctx.sprite(p.x + CW / 2, p.y + CH / 2, Math.min(CW, CH) * 0.6); }\n        });\n      }\n    };\n  }\n});\n\n<\/script>\n<script>\n// Juego «El laberinto de los giros» (Novato) · MAT10-P1-T01 Ángulos en posición normal y sistema sexagesimal.\n// Esquema y reglas: ver _kit/plantillas/juego/js/datos.js. La PRIMERA opción de cada pregunta es la correcta.\nwindow.DATOS = {\n  meta: { codigo: \"MAT10-P1-T01-OVA-N\", titulo: \"Ángulos en posición normal y sistema sexagesimal\", asignatura: \"Matemáticas\", grado: \"10.º\", periodo: \"1\", nivel: \"novato\" },\n  mecanica: \"laberinto\",\n  titulo: \"El laberinto de los giros\",\n  historia: \"Cada puerta tiene una respuesta. Solo se abre la correcta. Ayuda a Guili a salir: piensa primero y luego camina sin prisa.\",\n  transferencia: \"Mira una puerta de tu casa. Cuando se abre, ¿gira como el reloj o al revés? ¿Sería un giro positivo o negativo?\",\n  vidas: 3,\n  rondas: 8,\n  barajar: true,\n  preguntas: [\n    { clave: \"que_es_angulo\", enunciado: \"Un ángulo es…\",\n      opciones: [\"Cuánto gira algo\", \"Una línea recta\", \"Un punto\", \"Un número del reloj\"],\n      retro: \"Un ángulo mide cuánto gira algo, como la manecilla de un reloj.\",\n      pista: \"Piensa en la manecilla de un reloj cuando se mueve.\" },\n    { clave: \"giro_positivo\", enunciado: \"¿Hacia dónde gira un ángulo positivo?\",\n      opciones: [\"Contra las manecillas del reloj\", \"Como las manecillas del reloj\", \"Hacia abajo\", \"No gira\"],\n      retro: \"Positivo: contra las manecillas. Negativo: como las manecillas.\",\n      pista: \"Mira la flecha curva con el signo más.\" },\n    { clave: \"cuadrante_40\", enunciado: \"¿En qué cuadrante termina un giro de 40°?\",\n      opciones: [\"Cuadrante I\", \"Cuadrante II\", \"Cuadrante III\", \"Cuadrante IV\"],\n      retro: \"40° es menos que un cuarto de vuelta (90°): cuadrante I.\",\n      pista: \"Un cuarto de vuelta son 90°. ¿40° es más o menos?\" },\n    { clave: \"cuadrante_menos_50_n\", enunciado: \"¿En qué cuadrante termina un giro de −50°?\",\n      opciones: [\"Cuadrante IV\", \"Cuadrante I\", \"Cuadrante II\", \"Cuadrante III\"],\n      retro: \"Signo menos: gira como el reloj. Baja 50° desde el eje x: cuadrante IV.\",\n      pista: \"¿El signo es más o menos? Eso te dice hacia dónde giras.\" },\n    { clave: \"cuadrante_215_n\", enunciado: \"¿En qué cuadrante termina un giro de 215°?\",\n      opciones: [\"Cuadrante III\", \"Cuadrante II\", \"Cuadrante IV\", \"Cuadrante I\"],\n      retro: \"215° pasa de 180° (media vuelta) pero no llega a 270°: cuadrante III.\",\n      pista: \"Un cuarto de vuelta son 90°. ¿Cuántos cuartos de vuelta giraste?\" },\n    { clave: \"vuelta_completa\", enunciado: \"¿Cuántos grados tiene una vuelta completa?\",\n      opciones: [\"360°\", \"180°\", \"90°\", \"100°\"],\n      retro: \"Una vuelta completa mide 360°.\",\n      pista: \"Media vuelta mide 180°.\" },\n    { clave: \"donde_empieza\", enunciado: \"¿Dónde empieza el giro (lado inicial)?\",\n      opciones: [\"En el eje x, hacia la derecha\", \"En el eje y, hacia arriba\", \"En el eje x, hacia la izquierda\", \"Donde termina el giro\"],\n      retro: \"El lado donde empieza (lado inicial) va sobre el eje x, hacia la derecha.\",\n      pista: \"Recuerda el paso 2: dónde pones el lado donde empieza.\" },\n    { clave: \"conv_0_75\", enunciado: \"Pasa 0,75° a minutos.\",\n      opciones: [\"45′\", \"75′\", \"7,5′\", \"60′\"],\n      retro: \"0,75 × 60 = 45′.\",\n      pista: \"Para pasar 0,75° a minutos multiplica por 60.\" },\n    { clave: \"minutos_en_grado\", enunciado: \"¿Cuántos minutos tiene un grado?\",\n      opciones: [\"60\", \"100\", \"360\", \"30\"],\n      retro: \"1° = 60′. Por eso se multiplica por 60.\",\n      pista: \"Recuerda la regla para pasar grados a minutos: se multiplica por un número. ¿Cuál?\" },\n    { clave: \"que_es_cuadrante\", enunciado: \"Un cuadrante es…\",\n      opciones: [\"Una de las cuatro partes del plano\", \"Un giro de 90°\", \"El centro del plano\", \"Un eje\"],\n      retro: \"Los ejes cortan el plano en cuatro partes: los cuadrantes I, II, III y IV.\",\n      pista: \"Los dos ejes cortan el plano. ¿En cuántas partes?\" },\n    { clave: \"cuadrante_120_n\", enunciado: \"¿En qué cuadrante termina un giro de 120°?\",\n      opciones: [\"Cuadrante II\", \"Cuadrante I\", \"Cuadrante III\", \"Cuadrante IV\"],\n      retro: \"120° está entre 90° y 180°: el giro termina en el cuadrante II.\",\n      pista: \"Mira entre cuáles de 0°, 90°, 180° y 270° queda 120°.\" },\n    { clave: \"media_vuelta\", enunciado: \"¿Cuántos grados tiene media vuelta?\",\n      opciones: [\"180°\", \"90°\", \"360°\", \"100°\"],\n      retro: \"Una vuelta completa son 360°; la mitad es 180°.\",\n      pista: \"Piensa en la mitad de una vuelta completa de 360°.\" }\n  ]\n};\n\n<\/script>\n</body></html>\n"}</script>
<script>
(function () {
  var docs = JSON.parse(document.getElementById('ova-niveles').textContent);
  var marco = document.getElementById('ova'), botones = document.querySelectorAll('.selector button');
  function abrir(n) {
    botones.forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.nivel === n)); });
    marco.srcdoc = docs[n];
    try { history.replaceState(null, '', '#' + n); } catch (e) {}
  }
  botones.forEach(function (b) { b.addEventListener('click', function () { abrir(b.dataset.nivel); }); });
  abrir(docs[location.hash.slice(1)] ? location.hash.slice(1) : Object.keys(docs)[0]);
})();
</script>
</body></html>
