<script id="ova-niveles" type="application/json">{"aprendiz":"<!DOCTYPE html>\n<html lang=\"es\"><head><meta charset=\"UTF-8\"><meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Razones trigonométricas en el triángulo rectángulo</title>\n<style>\n/* =========================================================================\n   Identidad visual — Gimnasio Campestre de Guilford (fuente única del kit)\n   Colores tomados por muestreo del sitio web y del logotipo institucional.\n   Los motores y plantillas usan SOLO estas variables. No copie los valores\n   a otros archivos: si cambia un color, se cambia aquí.\n   ========================================================================= */\n@import url('https://fonts.googleapis.com/css2?family=Bitter:wght@600;700&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap');\n\n:root {\n  --g-verde: #35993a;        /* árbol del logotipo */\n  --g-verde-osc: #005d31;    /* titulares del sitio */\n  --g-verde-tinte: #eaf5eb;\n  --g-verde-borde: #cfe6d1;\n  --g-azul: #394e65;         /* navegación principal */\n  --g-azul-osc: #1f3247;\n  --g-azul-tinte: #eef1f5;\n  --g-dorado: #d3a85f;       /* sello 26 años */\n  --g-dorado-osc: #ba934f;\n  --g-dorado-tinte: #fbf4e7;\n\n  --g-tinta: #23282d;\n  --g-texto: #3d4650;\n  --g-suave: #5f6b76;        /* contraste 5,3:1 sobre blanco */\n  --g-linea: #e2e6ea;\n  --g-fondo: #f4f6f7;\n  --g-papel: #ffffff;\n  --g-ok: #2e7d32;\n  --g-alerta: #8a5300;\n  --g-error: #b3261e;\n\n  /* Acento por nivel: <body data-nivel=\"aprendiz|novato\"> */\n  --nivel: var(--g-verde);\n  --nivel-osc: var(--g-verde-osc);\n  --nivel-tinte: var(--g-verde-tinte);\n\n  --serif: 'Bitter', Georgia, 'Times New Roman', serif;\n  --sans: 'Atkinson Hyperlegible', Verdana, 'Segoe UI', system-ui, sans-serif;\n  --r: 10px;\n  --r-l: 16px;\n  --sombra: 0 1px 2px rgba(35,40,45,.06), 0 4px 14px rgba(35,40,45,.06);\n}\nbody[data-nivel=\"novato\"] { --nivel: var(--g-azul); --nivel-osc: var(--g-azul-osc); --nivel-tinte: var(--g-azul-tinte); }\n\n</style><style>\n/* Componentes de los OVA de una pantalla (simulador, juego). Requiere guilford.css antes. */\n*, *::before, *::after { box-sizing: border-box; }\nhtml { -webkit-text-size-adjust: 100%; }\nbody {\n  margin: 0; background: var(--g-fondo); color: var(--g-texto);\n  font-family: var(--sans); font-size: 17px; line-height: 1.6;\n  overflow-x: hidden;\n}\nh1, h2, h3 { font-family: var(--serif); color: var(--g-tinta); line-height: 1.25; margin: 0 0 .5em; }\nh1 { font-size: clamp(1.4rem, 4vw, 2rem); }\nh2 { font-size: clamp(1.15rem, 3vw, 1.45rem); }\nh3 { font-size: 1.08rem; }\np { margin: 0 0 1em; }\nimg, svg, canvas { max-width: 100%; height: auto; }\n:focus-visible { outline: 3px solid var(--g-dorado); outline-offset: 2px; border-radius: 4px; }\n.oculto-visual { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }\n\n.ova-franja { padding: 10px 16px; font-size: .92rem; font-weight: 700; text-align: center; }\n.ova-franja-docente { background: var(--g-dorado-tinte); color: #6b4e17; border-bottom: 2px solid var(--g-dorado); }\n.ova-franja-repaso { background: var(--g-azul-tinte); color: var(--g-azul-osc); border-bottom: 2px solid var(--g-azul); }\n\n.ova-cabecera {\n  display: flex; align-items: center; gap: 14px; flex-wrap: wrap;\n  padding: 12px 20px; background: var(--g-papel); border-bottom: 4px solid var(--nivel);\n}\n.ova-cabecera img { height: 44px; width: auto; }\n.ova-cabecera .titulo { flex: 1 1 240px; min-width: 0; }\n.ova-cabecera .titulo h1 { margin: 0; font-size: clamp(1.1rem, 3.2vw, 1.5rem); }\n.ova-cabecera .titulo small { color: var(--g-suave); }\n.ova-nivel {\n  display: inline-block; padding: 3px 12px; border-radius: 999px; font-size: .82rem; font-weight: 700;\n  background: var(--nivel-tinte); color: var(--nivel-osc); border: 1px solid var(--nivel);\n}\n\n.ova-contenedor { max-width: 980px; margin: 0 auto; padding: 20px 16px 48px; }\n.ova-tarjeta { background: var(--g-papel); border-radius: var(--r-l); box-shadow: var(--sombra); padding: 20px; margin-bottom: 18px; }\n.ova-fase { font-size: .78rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--nivel-osc); margin-bottom: 4px; }\n\n.ova-btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px;\n  padding: 10px 20px; border: 0; border-radius: 999px; cursor: pointer;\n  font: 700 1rem var(--sans); background: var(--nivel); color: #fff;\n}\n.ova-btn:hover { background: var(--nivel-osc); }\n.ova-btn[disabled] { opacity: .5; cursor: not-allowed; }\n.ova-btn.secundario { background: var(--g-papel); color: var(--nivel-osc); border: 2px solid var(--nivel); }\n\n.ova-retro { margin-top: 12px; padding: 12px 14px; border-radius: var(--r); border-left: 5px solid; }\n.ova-retro.ok { background: #e8f5e9; border-color: var(--g-ok); color: #1b4d1f; }\n.ova-retro.mal { background: #fdecea; border-color: var(--g-error); color: #7a1a14; }\n.ova-retro.pista { background: var(--g-dorado-tinte); border-color: var(--g-dorado-osc); color: #5c4313; }\n\n.ova-control { display: grid; gap: 4px; margin: 10px 0; }\n.ova-control label { font-weight: 700; color: var(--g-tinta); }\n.ova-control input[type=range] { width: 100%; accent-color: var(--nivel); min-height: 32px; }\n.ova-control input[type=number], .ova-control input[type=text] {\n  font: 1rem var(--sans); padding: 10px 12px; border: 2px solid var(--g-linea); border-radius: var(--r); min-height: 44px; max-width: 220px;\n}\n.ova-dato { font-size: 1.25rem; font-weight: 700; color: var(--g-tinta); }\n.ova-formula { font-family: var(--serif); font-size: 1.15rem; background: var(--g-fondo); padding: 8px 14px; border-radius: var(--r); display: inline-block; }\n\n.ova-rejilla { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 18px; }\n.ova-progreso { height: 10px; background: var(--g-linea); border-radius: 999px; overflow: hidden; }\n.ova-progreso > span { display: block; height: 100%; background: var(--nivel); transition: width .3s; }\n\n.ova-transcripcion summary { cursor: pointer; font-weight: 700; color: var(--nivel-osc); }\n\n</style>\n<style>\n/* =========================================================================\n   Marco común de los OVA del kit Guilford v3 (todos los tipos, SCORM).\n   Diseño estándar tomado del crucigrama de Laura Alarcón (MAT10-P2-T03, 28-oct-2026):\n   tarjeta 16:9 en escritorio, barra superior con puntos, racha, tiempo y desafíos,\n   ventana de resultado, avisos flotantes y confeti. Requiere guilford.css y ova.css antes.\n   Lo dibuja js/marco.js; el tipo solo pone su actividad dentro de #ova-area.\n   No editar dentro de un OVA: se corrige en _kit/motores/pantalla/ y se vuelve a copiar.\n   ========================================================================= */\n\n:root {\n  /* Aprendiz: verde Guilford */\n  --c-primario: var(--g-verde-osc);\n  --c-primario-luz: var(--g-verde);\n  --c-primario-tinte: var(--g-verde-tinte);\n  --c-primario-borde: #bfe3cc;\n  --c-fondo-general: #f4f7f5;\n  --c-tarjeta-fondo: #ffffff;\n  --c-texto-base: #2d3748;\n  --c-texto-suave: var(--g-suave);\n  --c-linea: #e2e8f0;\n  --c-radio: 12px;\n  --c-sombra: 0 4px 14px rgba(0, 93, 49, 0.08);\n  --c-acierto-fondo: #e8f5e9;\n  --c-acierto-texto: #1b5e20;\n  --c-acierto-borde: #81c784;\n  --c-error-fondo: #ffebee;\n  --c-error-texto: #b71c1c;\n  --c-error-borde: #e57373;\n  /* Acento de logros: el dorado institucional (sello de los 26 años) */\n  --c-oro: #f59e0b;\n  --c-oro-fondo: #fffbeb;\n  --c-oro-borde: #fcd34d;\n  --c-oro-texto: #92400e;\n  --c-fuego: #ef4444;\n  --c-fuego-fondo: #fef2f2;\n  --ui: system-ui, -apple-system, BlinkMacSystemFont, \"Segoe UI\", Roboto, sans-serif;\n}\n/* Novato: azul Guilford */\nbody[data-nivel=\"novato\"] {\n  --c-primario: var(--g-azul-osc);\n  --c-primario-luz: var(--g-azul);\n  --c-primario-tinte: var(--g-azul-tinte);\n  --c-primario-borde: #c7d6e5;\n  --c-fondo-general: #f0f3f6;\n  --c-acierto-fondo: #e3f2fd;\n  --c-acierto-texto: #0d47a1;\n  --c-acierto-borde: #90caf9;\n  --c-sombra: 0 4px 14px rgba(31, 50, 71, 0.08);\n}\n\nbody { background: var(--c-fondo-general); color: var(--c-texto-base); font-family: var(--ui); overflow-x: hidden; }\n\n/* ── Tarjeta principal ─────────────────────────────────────────────── */\n.ova-marco { width: 100%; max-width: 1140px; margin: 0 auto; }\n.ova-tarjeta-marco {\n  position: relative; background: var(--c-tarjeta-fondo); border-radius: var(--c-radio);\n  box-shadow: var(--c-sombra); border: 1px solid var(--c-linea); padding: 10px 14px; max-width: 100%; overflow-x: hidden;\n}\n#ova-area { min-width: 0; }\n\n/* ── Barra superior (HUD + acciones) ───────────────────────────────── */\n.ova-topbar {\n  display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap;\n  background: var(--c-primario-tinte); border: 1px solid var(--c-primario-borde); border-radius: 8px;\n  padding: 4px 10px; margin-bottom: 5px; min-height: 44px; max-width: 100%;\n}\n.topbar-stats { display: flex; align-items: center; flex-wrap: wrap; gap: 7px; font-size: .82rem; font-weight: 700; color: var(--c-primario); }\n.stat-valor { font-size: .95rem; font-weight: 800; }\n.hud-caja {\n  display: inline-flex; align-items: center; gap: 3px; background: #fff; border: 1px solid var(--c-linea);\n  padding: 2px 7px; border-radius: 12px; font-size: .78rem; color: var(--c-texto-suave);\n}\n.hud-etiqueta { font-weight: 700; }\n.hud-puntos { border-color: var(--c-oro-borde); color: var(--c-oro-texto); font-weight: 800; box-shadow: 0 1px 2px rgba(245,158,11,.15); }\n.hud-puntos .num { font-size: .88rem; color: #b45309; }\n.hud-racha { background: var(--c-fuego-fondo); border-color: #fecaca; color: var(--c-fuego); font-weight: 800; animation: racha-pulso 1s infinite alternate; }\n.hud-racha[hidden] { display: none; }\n@keyframes racha-pulso { from { transform: scale(1); } to { transform: scale(1.06); } }\n.hud-desafios { border-color: var(--c-primario-borde); gap: 5px; }\n.desafios-items { display: flex; gap: 4px; }\n\n.medalla-chip {\n  width: 22px; height: 22px; border-radius: 50%; background: #f1f5f9; border: 1px solid #cbd5e1;\n  display: flex; align-items: center; justify-content: center; font-size: .72rem; font-weight: 800; color: #475569;\n  cursor: pointer; padding: 0; font-family: var(--ui); filter: grayscale(1); opacity: .55; transition: all .25s;\n}\nbutton.medalla-chip:hover { opacity: .85; filter: none; }\n.medalla-chip.desbloqueada {\n  filter: none; opacity: 1; background: var(--c-oro-fondo); border-color: var(--c-oro); color: var(--c-oro-texto);\n  box-shadow: 0 0 6px rgba(245,158,11,.5); animation: medalla-pop .4s cubic-bezier(.175,.885,.32,1.275);\n}\n@keyframes medalla-pop { 0% { transform: scale(.6); } 60% { transform: scale(1.35); } 100% { transform: scale(1); } }\n\n.topbar-acciones { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }\n.btn-accion {\n  display: inline-flex; align-items: center; justify-content: center; gap: 3px; min-height: 32px; padding: 4px 10px;\n  border-radius: 16px; font: 700 .78rem var(--ui); border: 1px solid var(--c-primario-borde);\n  background: var(--c-tarjeta-fondo); color: var(--c-primario); cursor: pointer; box-shadow: 0 1px 2px rgba(0,0,0,.05);\n  transition: all .12s; white-space: nowrap;\n}\n.btn-accion:hover { background: var(--c-primario-tinte); }\n.btn-accion.primario { background: var(--c-primario); color: #fff; border-color: var(--c-primario); }\n.btn-accion.primario:hover { background: var(--c-primario-luz); }\n.btn-accion[disabled] { opacity: .5; cursor: not-allowed; }\n.btn-accion[aria-pressed=\"false\"] { color: var(--c-texto-suave); }\n\n.ova-tarjeta-marco .ova-progreso { height: 4px; background: var(--c-primario-tinte); border-radius: 2px; overflow: hidden; margin-bottom: 8px; }\n.ova-tarjeta-marco .ova-progreso > span { display: block; height: 100%; width: 0; background: var(--c-primario-luz); transition: width .3s; }\n\n/* ── Piezas que comparten los tipos ────────────────────────────────── */\n.ova-panel { background: var(--c-primario-tinte); border: 1px solid var(--c-primario-borde); border-radius: 10px; padding: 10px 12px; }\n.ova-panel h3, .ova-seccion-titulo {\n  font: 800 .82rem var(--ui); text-transform: uppercase; letter-spacing: .4px; color: var(--c-primario);\n  margin: 0 0 8px; padding-bottom: 4px; border-bottom: 2px solid var(--c-primario-borde);\n}\n.ova-item {\n  background: #fff; border: 1px solid var(--c-linea); border-radius: 8px; padding: 8px 10px; margin-bottom: 6px;\n  transition: border-color .15s, box-shadow .15s;\n}\n.ova-item.activa { border-color: var(--c-primario-luz); box-shadow: 0 0 0 2px var(--c-primario-borde); background: var(--c-primario-tinte); }\n.ova-item.resuelta { background: var(--c-acierto-fondo); border-color: var(--c-acierto-borde); }\n.ova-etiqueta-chip { display: inline-block; font-size: .72rem; color: var(--c-texto-suave); background: #f1f5f9; border-radius: 6px; padding: 1px 6px; }\n.btn-ayuda {\n  display: inline-block; margin-top: 4px; padding: 1px 8px; border-radius: 999px; font: 700 .72rem var(--ui); cursor: pointer;\n  background: var(--c-oro-fondo); border: 1px solid var(--c-oro-borde); color: var(--c-oro-texto);\n}\n.btn-ayuda:hover { background: #fef3c7; }\n\n/* Opciones de respuesta (presentación, video, juego accesible, simulador) */\n.ova-opciones { display: grid; gap: 8px; margin: 10px 0; }\n.ova-opcion {\n  display: flex; align-items: center; gap: 10px; width: 100%; min-height: 44px; padding: 10px 12px; text-align: left;\n  background: #fff; border: 2px solid var(--c-linea); border-radius: 10px; font: 600 .95rem var(--ui); color: var(--c-texto-base); cursor: pointer;\n}\n.ova-opcion:hover { border-color: var(--c-primario-borde); background: var(--c-primario-tinte); }\n.ova-opcion .letra {\n  flex: 0 0 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center;\n  background: var(--c-primario-tinte); color: var(--c-primario); font-weight: 800;\n}\n.ova-opcion.correcta { border-color: var(--c-acierto-borde); background: var(--c-acierto-fondo); color: var(--c-acierto-texto); }\n.ova-opcion.incorrecta { border-color: var(--c-error-borde); background: var(--c-error-fondo); color: var(--c-error-texto); }\n.ova-opcion[disabled] { cursor: default; }\n\n/* ── Aviso flotante ────────────────────────────────────────────────── */\n.ova-toast {\n  position: absolute; top: 58px; left: 50%;   /* debajo de la barra superior: no tapa puntos ni tiempo */ transform: translateX(-50%); max-width: calc(100% - 24px);\n  background: #1f2937; color: #fff; padding: 8px 16px; border-radius: 24px; font-size: .82rem; font-weight: 700;\n  box-shadow: 0 8px 24px rgba(0,0,0,.25); border: 1px solid #374151; z-index: 100; pointer-events: none;\n  transition: all .3s cubic-bezier(.175,.885,.32,1.275); text-align: center;\n}\n.ova-toast.dorado { background: linear-gradient(135deg, #78350f, #b45309); border-color: var(--c-oro); }\n.ova-toast.oculto { opacity: 0; transform: translateX(-50%) translateY(-15px); }\n\n.ova-confeti { position: fixed; inset: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 9998; }\n\n/* ── Ventanas (resultado, ayuda, respuestas del docente) ───────────── */\n.ova-modal {\n  position: fixed; inset: 0; background: rgba(0,0,0,.65); backdrop-filter: blur(4px); z-index: 10000;\n  display: flex; align-items: center; justify-content: center; padding: 16px;\n}\n.ova-modal[hidden] { display: none; }\n.ova-modal-caja {\n  background: var(--c-tarjeta-fondo); border-radius: 16px; box-shadow: 0 14px 40px rgba(0,0,0,.3); padding: 24px 22px;\n  max-width: 440px; width: 100%; max-height: calc(100vh - 32px); overflow-y: auto; text-align: center;\n  animation: modal-entra .35s cubic-bezier(.175,.885,.32,1.275);\n}\n.ova-modal-caja.ancha { max-width: 760px; text-align: left; }\n@keyframes modal-entra { from { transform: scale(.85); opacity: 0; } to { transform: scale(1); opacity: 1; } }\n.modal-titulo { font: 700 1.3rem var(--serif); color: var(--c-primario); margin: 0 0 6px; }\n.modal-puntaje { margin: 4px 0 12px; color: var(--c-primario); }\n.modal-puntaje .numero { font-size: 2.6rem; font-weight: 800; }\n.modal-puntaje .maximo { font-size: 1.1rem; color: var(--c-texto-suave); font-weight: 700; }\n.modal-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 14px; }\n.modal-stat { background: var(--c-fondo-general); border: 1px solid var(--c-linea); border-radius: 8px; padding: 8px 6px; }\n.modal-stat small { display: block; font-size: .68rem; color: var(--c-texto-suave); text-transform: uppercase; font-weight: 700; }\n.modal-stat span { font-size: 1.15rem; font-weight: 800; color: var(--c-primario); }\n.modal-record { font-size: .8rem; color: #b45309; font-weight: 700; margin-bottom: 10px; }\n.modal-mensaje { margin: 0 0 10px; }\n.modal-sello {\n  display: inline-block; background: #e8f5e9; color: #2e7d32; font-size: .76rem; font-weight: 700;\n  padding: 3px 10px; border-radius: 999px; margin-bottom: 14px; border: 1px solid #a5d6a7;\n}\n.modal-sello.neutro { background: #f1f5f9; color: #475569; border-color: #cbd5e1; }\n.modal-acciones { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }\n.modal-ayuda-caja { background: var(--c-oro-fondo); border-left: 4px solid var(--c-oro); border-radius: 6px; padding: 10px 12px; margin-bottom: 14px; text-align: left; }\n.modal-ayuda-caja p { margin: 0; font-size: .9rem; color: #78350f; line-height: 1.45; }\n.tabla-respuestas { width: 100%; border-collapse: collapse; font-size: .85rem; margin-bottom: 14px; }\n.tabla-respuestas th { background: var(--c-primario); color: #fff; text-align: left; padding: 6px 8px; }\n.tabla-respuestas td { border-bottom: 1px solid var(--c-linea); padding: 6px 8px; vertical-align: top; }\n.tabla-respuestas code { font-size: .75rem; color: var(--c-texto-suave); }\n\n/* Retroalimentación al frente (M.retro): nunca dentro de la actividad */\n.ova-modal-caja.retro { border-top: 6px solid var(--c-linea); }\n.ova-modal-caja.retro.ok { border-top-color: var(--c-acierto-borde); }\n.ova-modal-caja.retro.mal { border-top-color: var(--c-error-borde); }\n.retro-icono { width: 48px; height: 48px; margin: 0 auto 6px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font: 800 1.5rem var(--ui); background: #f1f5f9; color: #475569; }\n.retro.ok .retro-icono { background: var(--c-acierto-fondo); color: var(--c-acierto-texto); }\n.retro.mal .retro-icono { background: var(--c-error-fondo); color: var(--c-error-texto); }\n.retro.ok .modal-titulo { color: var(--c-acierto-texto); }\n.retro.mal .modal-titulo { color: var(--c-error-texto); }\n.modal-retro-texto { text-align: left; font-size: .95rem; line-height: 1.5; margin: 0 0 14px; }\n.modal-retro-texto p { margin: 0 0 .6em; }\n.modal-retro-texto em { color: var(--c-oro-texto); }\n\n/* Panel de desafíos (se abre tocando las medallas) */\n.lista-desafios { list-style: none; margin: 0 0 14px; padding: 0; display: grid; gap: 8px; }\n.desafio-fila { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border: 1px solid var(--c-linea); border-radius: 10px; }\n.desafio-fila.logrado { background: var(--c-oro-fondo); border-color: var(--c-oro-borde); }\n.desafio-fila .medalla-chip { flex: 0 0 30px; width: 30px; height: 30px; cursor: default; }\n.desafio-texto { flex: 1; display: grid; gap: 2px; font-size: .88rem; }\n.desafio-premio { font-weight: 800; color: var(--c-oro-texto); white-space: nowrap; font-size: .85rem; }\n.modal-desafios-logrados { font-size: .85rem; font-weight: 700; color: var(--c-oro-texto); margin-bottom: 6px; }\n\n/* ── Escritorio: tarjeta panorámica 16:9 sin desplazamiento ────────── */\n@media (min-width: 820px) {\n  .ova-cabecera { padding: 6px 18px; margin-bottom: 6px; }\n  .ova-cabecera img { height: 30px; }\n  .ova-cabecera .titulo h1 { font-size: 1.05rem; margin: 0; }\n  .ova-cabecera .titulo small { font-size: .72rem; }\n  .ova-cabecera .ova-nivel { padding: 3px 10px; font-size: .76rem; }\n  .ova-contenedor { padding: 4px 14px 10px; max-width: 1080px; }\n  .ova-tarjeta-marco.panoramica { aspect-ratio: 16 / 9; height: 590px; max-height: 590px; display: flex; flex-direction: column; overflow: hidden; }\n  .ova-tarjeta-marco.panoramica #ova-area { flex: 1; min-height: 0; overflow: hidden; }\n  .ova-topbar { flex-wrap: nowrap; }\n}\n\n/* ── Celular: todo en una columna, cero desbordamiento a 360 px ────── */\n@media (max-width: 819px) {\n  .ova-contenedor { padding: 6px 4px 24px; max-width: 100%; }\n  .ova-tarjeta-marco { padding: 8px 6px; }\n  /* Rejilla de una columna + botones en flex: con grid auto-fit dentro de un flex en columna, Chromium\n     calculaba la fila de botones como si fueran apilados (172 px de hueco; lo midieron 4 motores). */\n  .ova-topbar { display: grid; grid-template-columns: minmax(0, 1fr); gap: 6px; padding: 6px 8px; }\n  .topbar-stats { justify-content: space-between; gap: 4px; font-size: .74rem; }\n  .topbar-acciones { display: flex; flex-wrap: wrap; gap: 4px; width: 100%; }\n  .btn-accion { flex: 1 1 72px; min-height: 40px; padding: 6px 2px; font-size: .74rem; border-radius: 6px; white-space: normal; }\n  .modal-stats { gap: 6px; }\n  .hud-desafios .medalla-chip { width: 28px; height: 28px; }\n  .ova-toast { position: fixed; top: 12px; }   /* visible aunque la página esté desplazada */\n}\n\n</style><style>\n/* =========================================================================\n   Simulador (SIM) · kit Guilford v3. Requiere guilford.css, ova.css y marco.css antes.\n   Escena SVG a la izquierda; controles y retos a la derecha (16:9 en escritorio).\n   En celular todo va en una columna: escena, controles, reto.\n   La retroalimentación de los retos sale en la ventana del marco (M.retro): aquí no hay estilos para\n   pintarla dentro del panel, a propósito (no debe mover controles ni abrir barras de desplazamiento).\n   No editar dentro de un OVA: se corrige en _kit/motores/simulador/ y se vuelve a copiar.\n   ========================================================================= */\n\n.sim { display: grid; gap: 10px; min-width: 0; }\n.sim [hidden] { display: none !important; }\n.sim-escena { display: flex; flex-direction: column; gap: 6px; min-width: 0; }\n.sim-conexion { margin: 0; font-size: .9rem; line-height: 1.4; color: var(--c-texto-base); }\n.sim-conexion strong { color: var(--c-primario); }\n.sim-lienzo {\n  background: #fff; border: 1px solid var(--c-linea); border-radius: 10px; padding: 6px;\n  display: flex; align-items: center; justify-content: center; min-height: 0;\n}\n.sim-lienzo svg { display: block; width: 100%; max-height: 320px; height: auto; }\n.sim-lienzo text { font-family: var(--ui); }\n.sim-lecturas { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 6px; margin: 0; padding: 0; list-style: none; }\n.sim-lecturas li {\n  background: var(--c-primario-tinte); border: 1px solid var(--c-primario-borde); border-radius: 8px;\n  padding: 3px 9px; font-size: .8rem; color: var(--c-texto-suave); min-width: 0;\n}\n.sim-lecturas li b { display: block; font-size: .98rem; color: var(--c-primario); font-weight: 800; }\n.sim-lecturas.oculta li b { filter: blur(5px); user-select: none; }\n.sim-aviso-oculto { font-size: .76rem; color: var(--c-oro-texto); background: var(--c-oro-fondo) !important; border-color: var(--c-oro-borde) !important; grid-column: 1 / -1; }\n\n.sim-lado { display: flex; flex-direction: column; gap: 8px; min-width: 0; }\n.sim-controles-titulo { display: flex; align-items: center; justify-content: space-between; gap: 6px; }\n.sim-restablecer {\n  min-height: 34px; padding: 4px 12px; border-radius: 999px; border: 1px solid var(--c-primario-borde); background: #fff;\n  color: var(--c-primario); font: 700 .78rem var(--ui); cursor: pointer; text-transform: none; letter-spacing: 0;\n}\n.sim-restablecer:hover { background: var(--c-primario-tinte); }\n.sim-restablecer[disabled] { opacity: .45; cursor: not-allowed; }\n.sim-control { margin-bottom: 6px; }\n.sim-control:last-child { margin-bottom: 0; }\n.sim-control-fila { display: flex; align-items: center; justify-content: space-between; gap: 6px; }\n.sim-control label { font-weight: 700; font-size: .86rem; color: var(--c-texto-base); }\n.sim-valor {\n  font-weight: 800; color: var(--c-primario); background: #fff; border: 1px solid var(--c-primario-borde);\n  border-radius: 999px; padding: 1px 10px; font-size: .88rem; white-space: nowrap;\n}\n.sim-deslizador { display: grid; grid-template-columns: 40px minmax(0, 1fr) 40px; gap: 6px; align-items: center; }\n.sim-deslizador input[type=range] { width: 100%; min-height: 40px; accent-color: var(--c-primario-luz); margin: 0; }\n.sim-paso {\n  width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--c-primario-borde); background: #fff;\n  color: var(--c-primario); font: 800 1.1rem var(--ui); cursor: pointer; padding: 0; line-height: 1;\n}\n.sim-paso:hover { background: var(--c-primario-tinte); }\n.sim-paso[disabled], .sim-deslizador input[disabled] { opacity: .45; cursor: not-allowed; }\n\n.sim-retos { display: flex; flex-direction: column; min-height: 0; }\n.sim-retos h3 { display: flex; align-items: center; justify-content: space-between; gap: 6px; flex-wrap: wrap; }\n.sim-chips { display: flex; gap: 4px; flex-wrap: wrap; }\n.sim-chip {\n  width: 34px; height: 34px; border-radius: 50%; border: 1px solid #cbd5e1; background: #f1f5f9; color: #475569;\n  font: 800 .8rem var(--ui); cursor: pointer; padding: 0; text-transform: none; letter-spacing: 0;\n}\n.sim-chip.activo { border-color: var(--c-primario-luz); background: #fff; color: var(--c-primario); box-shadow: 0 0 0 2px var(--c-primario-borde); }\n.sim-chip.hecho { background: var(--c-acierto-fondo); border-color: var(--c-acierto-borde); color: var(--c-acierto-texto); }\n.sim-chip.ayuda { background: var(--c-oro-fondo); border-color: var(--c-oro-borde); color: var(--c-oro-texto); }\n.sim-chip.sinresolver { background: var(--c-error-fondo); border-color: var(--c-error-borde); color: var(--c-error-texto); }\n.sim-chip[disabled] { cursor: not-allowed; opacity: .55; }\n.sim-reto { margin-bottom: 0; }\n.sim-reto-cab { display: flex; justify-content: space-between; align-items: center; gap: 6px; margin-bottom: 4px; }\n.sim-reto-cab strong { color: var(--c-primario); font-size: .86rem; }\n.sim-enunciado { margin: 0 0 6px; font-size: .95rem; line-height: 1.45; color: var(--c-texto-base); }\n.sim-reto .ova-opciones { margin: 6px 0; gap: 6px; }\n.sim-reto .ova-opcion { min-height: 40px; padding: 5px 10px; font-size: .9rem; }\n.sim-reto .ova-opcion .letra { flex-basis: 26px; height: 26px; }\n.sim-numero { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin: 6px 0; }\n.sim-numero input {\n  font: 700 1rem var(--ui); padding: 8px 10px; border: 2px solid var(--c-primario-borde); border-radius: 8px;\n  min-height: 44px; width: 150px; max-width: 100%; color: var(--c-texto-base);\n}\n.sim-numero input:focus { outline: none; border-color: var(--c-primario-luz); }\n.sim-indicacion { font-size: .78rem; color: var(--c-texto-suave); margin: 4px 0 0; }\n.sim-explicacion { margin-top: 6px; min-height: 40px; padding: 6px 16px; font-size: .88rem; }\n.sim-final .ova-btn { min-height: 40px; padding: 6px 16px; font-size: .9rem; }\n.sim-final h4 { font: 700 1rem var(--serif); color: var(--c-primario); margin: 0 0 4px; }\n.sim-final p { margin: 0 0 8px; font-size: .92rem; }\n.sim-errores { margin: 10px; }\n\n/* Escritorio: la tarjeta 16:9 del marco; la escena ocupa el alto disponible */\n@media (min-width: 820px) {\n  .sim { grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); height: 100%; min-height: 0; }\n  .sim-escena, .sim-lado { min-height: 0; }\n  .sim-lienzo { flex: 1; }\n  .sim-lienzo svg { height: 100%; max-height: none; }\n  .sim-retos { flex: 1; overflow-y: auto; }\n  .sim-reto .ova-opciones { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }\n}\n/* Celular: una columna, la escena arriba y no más alta que la mitad de la pantalla */\n@media (max-width: 819px) {\n  .sim-lienzo svg { max-height: 46vh; }\n  .sim-numero input { width: 100%; }\n}\n\n</style>\n</head><body data-nivel=\"aprendiz\">\n<\u0021-- Simulador del kit v3. El marco (cabecera, puntos, tiempo, desafíos, resultado) lo pone js/marco.js.\n     Los textos están en js/datos.js; el dibujo y los cálculos del tema, en la parte 1 de js/app.js. -->\n<main id=\"ova-area\" class=\"sim\">\n  <section class=\"sim-escena\" aria-label=\"Escena del simulador\">\n    <p class=\"sim-conexion\" id=\"sim-conexion\"></p>\n    <div class=\"sim-lienzo\">\n      <svg id=\"sim-svg\" role=\"img\" aria-labelledby=\"sim-svg-desc\" preserveAspectRatio=\"xMidYMid meet\"><desc id=\"sim-svg-desc\"></desc><g id=\"sim-dibujo\"></g></svg>\n    </div>\n    <ul class=\"sim-lecturas\" id=\"sim-lecturas\" aria-live=\"polite\"></ul>\n  </section>\n  <section class=\"sim-lado\">\n    <div class=\"ova-panel\">\n      <h3>Controles</h3>\n      <div id=\"sim-controles\"></div>\n    </div>\n    <div class=\"ova-panel sim-retos\">\n      <h3><span>Retos</span><span class=\"sim-chips\" id=\"sim-chips\"></span></h3>\n      <div id=\"sim-reto\" aria-live=\"polite\"></div>\n    </div>\n  </section>\n</main>\n<script>window.OVA_DEMO = true;<\/script>\n<script>\n/*\n * ova-scorm.js — Envoltorio SCORM 1.2 de los OVA del kit Guilford (v3: todos los tipos son SCORM).\n * Herramienta preexistente del contratista (Anexo E, literal a). No editar dentro de un OVA:\n * se corrige en _kit/motores/pantalla/ y se vuelve a copiar.\n *\n * Lo que el autor usa (nada más):\n *\n *   const sesion = OVA.iniciar('id-del-ova', { sigla: 'CRU' });   // { modo, estado }\n *      modo: 'normal'  → estudiante, escribe en Moodle\n *            'repaso'  → estudiante que reabre un intento cerrado: ve lo suyo, no escribe\n *            'docente' → vista previa del docente: TODO abierto, no escribe\n *            'local'   → sin Moodle (vista local o página pública): no escribe\n *      estado: lo último que se guardó con OVA.guardar(), o null\n *   OVA.guardar(estado)          // objeto pequeño (cabe en 4000 caracteres con margen)\n *   OVA.registrar({ clave, tipo, respuesta, esperada, correcta, descripcion })\n *   OVA.finalizar(puntaje, resumen)   // 0 a 100; ÚNICO momento en que se envía la nota (una vez por intento)\n *   OVA.soloLectura              // true en repaso, docente y local\n *   OVA.finalizado               // true cuando la nota de este intento ya quedó enviada\n *\n * MAPEO PARA EL DOCENTE (lo que se ve en Moodle → Informes del SCORM):\n *  - Interacciones: el id es  SIGLA_clave  (por ejemplo CRU_periodo, SOP_amplitud, ARR_03_clasificar).\n *    La «clave» la da el motor del tipo y es ESTABLE: no cambia de un estudiante a otro aunque el\n *    orden o la posición sean aleatorios. Así la columna del informe siempre es la misma pregunta.\n *    El enunciado va una sola vez en cmi.comments como «[SIGLA_clave] enunciado».\n *  - Resumen como interacciones (Informes → Interacciones y su CSV), solo al finalizar:\n *      RES_nota_0a100 · RES_aciertos_sin_ayuda · RES_aciertos_con_ayuda · RES_preguntas_total · RES_ayudas_usadas · RES_desafios_logrados · RES_minutos\n *  - Lo mismo como objetivos (Informes → Objetivos; en Moodle 4.5.14 ese informe no pinta las celdas,\n *    pero se ven en el seguimiento del intento), con nombre propio:\n *      Nota_0a100 · Aciertos_sin_ayuda · Aciertos_con_ayuda · Preguntas_total · Ayudas_usadas · Minutos\n *    (los que el motor no informe no se escriben).\n *  - cmi.comments termina con una línea  [RESUMEN] Nota 75/100 · 6 de 8 sin ayuda · 2 ayudas · 4 min 12 s\n *  - Tiempo: cmi.core.session_time en cada guardado y al salir (Moodle lo suma en «Tiempo total»).\n *\n * Reglas de Moodle que este archivo cumple (verificadas en Moodle 4.5 real, 8-sep-2026 y 13-oct-2026):\n *  1. cmi.core.score.raw solo se escribe en finalizar(). Con la nota escrita y el intento\n *     incompleto, Moodle da el intento por terminado y el estudiante ya no puede reanudar.\n *  2. El docente se detecta SOLO con lesson_mode == \"browse\". «credit» no sirve: Moodle manda\n *     no-credit también al estudiante que reabre su intento.\n *  3. En «review» Moodle acepta escrituras; la guarda de solo lectura está aquí, no en Moodle.\n *  4. La numeración de interacciones parte del mayor entre _count y lo guardado, para que un\n *     intento reanudado no escriba encima de las respuestas anteriores.\n *  5. cmi.comments se AÑADE (Moodle concatena): se escribe solo la línea nueva, nunca el texto completo.\n *  6. Las puntuaciones de objetivos van de 0 a 100 (Moodle rechaza otro rango).\n */\n(function () {\n  'use strict';\n\n  var api = null, modo = 'local', iniciado = false, terminado = false;\n  var inicio = Date.now(), nInteraccion = 0, estadoActual = null, ultimaRespuesta = Date.now();\n  var LIMITE_SUSPEND = 4000;\n  var comentados = {};\n\n  function buscarAPI(w) {\n    var saltos = 0;\n    while (w && saltos < 12) {\n      try { if (w.API) return w.API; } catch (e) { return null; }\n      if (w.parent === w) break;\n      w = w.parent; saltos++;\n    }\n    return null;\n  }\n  function encontrarAPI() {\n    var a = buscarAPI(window);\n    if (!a && window.opener) a = buscarAPI(window.opener);\n    return a;\n  }\n  function leer(k) { try { return api ? String(api.LMSGetValue(k)) : ''; } catch (e) { return ''; } }\n  function escribir(k, v) {\n    if (!api || OVA.soloLectura) return false;\n    try { return String(api.LMSSetValue(k, String(v))) === 'true'; } catch (e) { return false; }\n  }\n  function confirmar() { if (api && !OVA.soloLectura) try { api.LMSCommit(''); } catch (e) {} }\n\n  function tiempoScorm(ms) {\n    var s = Mat xperiencia (28-oct-2026), lo cumple la parte 2:\n *   · La retroalimentación de cada reto (correcto / todavía no / solución) sale en la ventana del marco\n *     (M.retro), nunca dentro del panel. En el panel solo quedan las lecturas en vivo de la escena.\n *   · Un solo modo: Aprendiz y Novato usan este mismo motor; sus apoyos (intentos, pistaAlFallar,\n *     revelar) están en su datos.js.\n *   · Los desafíos solo premian (puntos extra y medalla). Equivocarse nunca corta la actividad: si se\n *     acaban los intentos de un reto, se muestra la solución, el reto queda sin puntaje y se sigue.\n *   · OVA_MAPA da la hoja de respuestas: esperada, opciones, explicación y pistas de cada reto.\n */\n(function () {\n  'use strict';\n  var D = window.DATOS;\n\n  function fmt(n, dec) { return Number(n).toLocaleString('es-CO', { maximumFractionDigits: dec == null ? 2 : dec, minimumFractionDigits: 0 }); }\n  var RAD = Math.PI / 180;\n\n  /* ═════════════════ 1. TEMA: razones trigonométricas en el triángulo rectángulo ═════════════════\n     Controles (datos.js): angulo = θ en grados (agudo), hipotenusa = h en metros.\n     Código de colores fijo (apoyo visual del redactor): opuesto azul, adyacente verde, hipotenusa\n     naranja, siempre con rótulo de texto (no solo color). */\n  var AZUL = '#1d4ed8', VERDE = '#15803d', NARANJA = '#c2410c';\n  var HMAX = ((D && D.controles) || []).filter(function (k) { return k.id === 'hipotenusa'; }).map(function (k) { return k.max; })[0] || 20;\n  var TEMA = {\n    viewBox: '0 0 350 250',\n\n    /* opuesto = h · sen θ ; adyacente = h · cos θ ; las tres razones salen de dividir lados. */\n    calcular: function (v) {\n      var t = v.angulo * RAD, h = v.hipotenusa;\n      var op = h * Math.sin(t), ad = h * Math.cos(t);\n      return { t: t, op: op, ad: ad, sen: op / h, cos: ad / h, tan: op / ad };\n    },\n\n    /* El triángulo se dibuja a escala: el lado más largo posible (HMAX) ocupa 210 unidades del dibujo. */\n    dibujar: function (v, E.r de cada reto: 0 abierto · 1 acierto (primer intento, sin ayuda) · 2 con ayuda · 3 sin resolver (se acabaron los intentos) */\n  var ABIERTO = 0, ACIERTO = 1, CON_AYUDA = 2, SIN_RESOLVER = 3;\n\n  /* ── Validación de datos.js (textos que entienda una docente) ── */\n  var errores = [];\n  function enteroValido(x) { return x == null || (Number.isInteger(x) && x >= 0); }\n  (function validar() {\n    if (!D || typeof D !== 'object') { errores.push('El archivo js/datos.js no define DATOS.'); return; }\n    if (!D.meta || !D.meta.codigo) errores.push('Falta «meta» con el código del OVA.');\n    ['conexion', 'transferencia'].forEach(function (k) { if (!D[k] || !String(D[k]).trim()) errores.push('Falta el texto «' + k + '».'); });\n    if (!enteroValido(D.intentos)) errores.push('«intentos» debe ser un número entero: 0 = sin límite, 2 o más = intentos por reto.');\n    if (D.intentos === 1) errores.push('«intentos: 1» no deja corregir ningún error: use 2 o más, o 0 para no poner límite.');\n    if (!enteroValido(D.revelar)) errores.push('«revelar» debe ser un número entero (cuántas veces se puede pedir la solución).');\n    if (!controles.length) errores.push('Hace falta al menos un control (deslizador) en «controles».');\n    controles.forEach(function (k, i) {\n      var n = 'El control ' + (i + 1);\n      if (!k.id || !/^[a-z][a-z0-9_]*$/.test(k.id)) errores.push(n + ' necesita un «id» corto en minúsculas, sin espacios ni tildes.');\n      if (!k.etiqueta) errores.push(n + ' no tiene «etiqueta».');\n      if (!(typeof k.min === 'number' && typeof k.max === 'number' && k.min < k.max)) errores.push(n + ' necesita «min» menor que «max».');\n      if (!(k.paso > 0)) errores.push(n + ' necesita un «paso» mayor que 0.');\n      if (!(k.valor >= k.min && k.valor <= k.max)) errores.push(n + ': el «valor» inicial está fuera de min y max.');\n    });\n    if (retos.length < 3) errores.push('Hacen falta al menos 3 retos (hay ' + retos.length + ').');\n    var claves = {};\n
