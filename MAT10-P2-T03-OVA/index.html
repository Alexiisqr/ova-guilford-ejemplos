(function (rc) { return rc[0] + ',' + rc[1]; }).filter(function (x) { return letras[x] !== letraEsperada(x); })[0]\n      : cursor;\n    if (!k) return;\n    nRevelar++;\n    conAyudaDe[activa.clave] = true;\n    M.sumar(-30); M.fallo();\n    M.aviso('Letra revelada (' + nRevelar + '/' + MAX_REVELAR + '): esta palabra contará la mitad.');\n    cursor = k;\n    escribir(letraEsperada(k), true);\n  }\n  function limpiar() {\n    if (bloqueado()) return;\n    celdasDe(activa).forEach(function (rc) {\n      var k = rc[0] + ',' + rc[1];\n      if (!palabrasEn(k).some(function (w) { return resueltas[w.clave]; })) { delete letras[k]; if (celdas[k]) celdas[k].classList.remove('incorrecta'); }\n    });\n    confirmarEntrega = false;\n    seleccionar(activa); guardar();\n  }\n\n  /* «Comprobar»: el resultado (qué palabras están bien, cuáles tienen letras que no van y cuáles faltan)\n     sale en la ventana del marco, agrupado (bien, con letras que no van, incompletas). No dice las respuestas. */\n  function comprobar() {\n    if (soloVer || terminado) { if (terminado) M.aviso('El crucigrama ya se entregó. Pulsa «Reiniciar» para practicar con otro tablero.'); return; }\n    var faltan = palabras.filter(function (w) { return !resueltas[w.clave]; }).length;\n    if (!faltan) { completo(); return; }\n    if (confirmarEntrega) { entregar(); return; }\n    var bien = [], malas = [], incompletas = [];\n    palabras.forEach(function (w) {\n      if (resueltas[w.clave]) { bien.push(w); return; }\n      var hueco = completa(w).split('').filter(function (x) { return x === ' '; }).length;\n      if (hueco) { incompletas.push({ w: w, n: hueco }); return; }\n      malas.push(w);\n      conAyudaDe[w.clave] = true;     // se resolverá en un intento posterior: cuenta la mitad\n      celdasDe(w).forEach(function (rc, i) { var k = rc[0] + ',' + rc[1]; if (letras[k] !== w.palabra[i] && celdas[k]) celdas[k].classList.add('incorrecta'); });\n    });\n    if (malas.length) M.fallo();\n    confirmarEntrega = true;\n    guardar();\n    var fila = function (clase, texto) { return '<li class=\"cru-retro-' + clase + '\">' + texto + '</li>'; };\n    var html = '<ul class=\"cru-retro-lista\">'\n      + bien.map(function (w) { return fila('bien', '<strong>' + esc(nombreDe(w)) + '</strong>: bien resuelta.'); }).join('')\n      + malas.map(function (w) { return fila('mal', '<strong>' + esc(nombreDe(w)) + '</strong>: tiene letras que no van (las verás en rojo). Contará la mitad.'); }).join('')\n      + incompletas.map(function (x) { return fila('falta', '<strong>' + esc(nombreDe(x.w)) + '</strong>: incompleta (' + (x.n === 1 ? 'falta 1 letra' : 'faltan ' + x.n + ' letras') + ').'); }).join('')\n      + '</ul><p class=\"cru-retro-pie\">Corrige y sigue. Si prefieres entregar así, pulsa «Comprobar» otra vez.</p>';\n    M.retro({\n      ok: !malas.length,\n      titulo: malas.length ? (malas.length === 1 ? 'Una palabra tiene letras que no van' : malas.length + ' palabras tienen letras que no van') : 'Lo que llevas está bien',\n      html: html, boton: 'Seguir resolviendo'\n    });\n  }\n\n  /* Todas las palabras resueltas: repaso de cada término con su explicación y, al continuar, el cierre. */\n  function completo() {\n    if (terminado || M.retroAbierta()) return;\n    var conAy = palabras.filter(function (w) { return conAyudaDe[w.clave]; }).length;\n    var html = '<p>' + (conAy ? 'Resolviste las ' + palabras.length + ' palabras; ' + (conAy === 1 ? '1 con ayuda cuenta' : conAy + ' con ayuda cuentan') + ' la mitad.' : 'Resolviste las ' + palabras.length + ' palabras sin ninguna ayuda.') + ' Repasa lo que significa cada una:</p>'\n      + '<ul class=\"cru-retro-lista\">' + palabras.map(function (w) {\n        return '<li class=\"cru-retro-' + (conAyudaDe[w.clave] ? 'ayuda' : 'bien') + '\"><strong>' + esc(w.palabra) + '</strong>: ' + esc(w.explicacion) + '</li>';\n      }).join('') + '</ul>';\n    M.retro({ ok: true, titulo: '¡Crucigrama completo!', html: html, boton: 'Ver mi resultado', alContinuar: entregar });\n  }\n\n  function entregar() {\n    if (terminado) return;\n    /* Una interacción por palabra del BANCO, todas juntas y en el orden del banco (el de OVA_MAPA):\n       Moodle numera las columnas del informe por orden de llegada, y cada estudiante ve otras palabras.\n       Las que no salieron en su tablero quedan como «neutral». En la práctica no se registra nada. */\n    if (!(window.OVA && OVA.finalizado)) banco.forEach(function (b) {\n      var w = palabras.filter(function (x) { return x.clave === b.clave; })[0];\n      if (!w) { OVA.registrar({ clave: b.clave, tipo: 'fill-in', respuesta: '(no salió en su tablero)', esperada: b.palabra, descripcion: b.pista }); return; }\n      var resp = resueltas[w.clave] ? w.palabra : completa(w).replace(/ /g, '_').replace(/_+$/, '');\n      OVA.registrar({ clave: w.clave, tipo: 'fill-in', respuesta: resp || '(sin responder)', esperada: w.palabra, correcta: !!resueltas[w.clave], descripcion: w.pista });\n    });\n    var total = palabras.length, aciertos = 0, conAyuda = 0;\n    palabras.forEach(function (w) { if (resueltas[w.clave]) { if (conAyudaDe[w.clave]) conAyuda++; else aciertos++; } });\n    var ayudas = Object.keys(vistasAyuda).length + nRevelar;\n    var nota = Math.round(100 * (aciertos + 0.5 * conAyuda) / total);\n    if (aciertos === total) M.medalla('sinayudas');\n    terminado = true;\n    cursor = null; refrescar(); guardar();\n    var mensaje = aciertos === total ? '¡Resolviste todo el crucigrama sin ayudas! Dominas el vocabulario del tema.'\n      : (aciertos + conAyuda === total ? 'Completaste todas las palabras; ' + conAyuda + ' con ayuda o en un segundo intento cuentan la mitad.'\n      : 'Resolviste ' + (aciertos + conAyuda) + ' de ' + total + ' palabras. Repasa las pistas de las que faltaron.');\n    window.__cruNota = nota;\n    M.terminar({ nota: nota, aciertos: aciertos, conAyuda: conAyuda, total: total, ayudas: ayudas, mensaje: mensaje,\n      textoReintentar: 'Practicar otro tablero', alReintentar: function () { nuevoIntento(true); } });\n  }\n\n  function nuevoIntento(esPractica) {\n    palabras = tableroNuevo(); letras = {}; resueltas = {}; reveladas = {}; doradasHalladas = {};\n    if (esPractica) { conAyudaDe = {}; vistasAyuda = {}; premiadas = {}; nRevelar = 0; practica = true; M.restaurar({ p: 0, t: 0, r: 0, m: [] }); M.reanudar(); }\n    terminado = false; confirmarEntrega = false;\n    elegirDoradas(); pintarTablero(); pintarPistas();\n    if (palabras.length) seleccionar(palabras[0]);\n    guardar();\n  }\n  function reiniciar() {\n    if (soloVer) return;\n    if (terminado) { nuevoIntento(true); M.aviso('Tablero nuevo para practicar: tu nota ya quedó registrada.'); return; }\n    nuevoIntento(false);\n    M.aviso('¡Tablero nuevo! Las ayudas que ya usaste siguen contando.');\n  }\n\n  /* ───────────── teclado físico y táctil ───────────── */\n  function hayVentana() { return !!document.querySelector('.ova-modal:not([hidden])'); }\n  document.addEventListener('keydown', function (e) {\n    if (hayVentana() || e.ctrlKey || e.metaKey || e.altKey) return;\n    var t = e.target, tag = t && t.tagName;\n    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;\n    var enTablero = t === gridEl || t === document.body || !t;\n    if (/^[a-zñáéíóúü]$/i.test(e.key)) { e.preventDefault(); escribir(sinTildes(e.key.replace(/ñ/i, '#')).replace('#', 'Ñ')); }\n    else if (e.key === 'Backspace') { e.preventDefault(); borrar(true); }\n    else if (e.key === 'Delete') { e.preventDefault(); borrar(false); }\n    else if (enTablero && /^Arrow/.test(e.key)) {\n      e.preventDefault();\n      if (!cursor) return;\n      var a = cursor.split(',').map(Number), r = a[0], c = a[1];\n      for (var paso = 1; paso <= N; paso++) {\n        var rr = r + (e.key === 'ArrowDown' ? paso : e.key === 'ArrowUp' ? -paso : 0), cc = c + (e.key === 'ArrowRight' ? paso : e.key === 'ArrowLeft' ? -paso : 0);\n        if (rr < 0 || cc < 0 || rr >= N || cc >= N) break;\n        if (celdas[rr + ',' + cc]) {\n          var ws = palabrasEn(rr + ',' + cc), dir = /Left|Right/.test(e.key) ? 'H' : 'V';\n          seleccionar(ws.filter(function (w) { return w.dir === dir; })[0] || ws[0], rr + ',' + cc); break;\n        }\n      }\n    }\n    else if (enTablero && e.key === ' ') { e.preventDefault(); if (cursor) { var b = cursor.split(',').map(Number); tocarCelda(b[0], b[1]); } }\n    else if (t === gridEl && e.key === 'Enter') { e.preventDefault(); siguientePalabra(e.shiftKey ? -1 : 1); }\n  });\n  function siguientePalabra(paso) { if (!palabras.length) return; var i = palabras.indexOf(activa); seleccionar(palabras[(i + paso + palabras.length) % palabras.length]); }\n\n  if (teclado) {\n    [['Q', 'W', 'E', 'R', 'T', 'Y', 'U', 'I', 'O', 'P'], ['A', 'S', 'D', 'F', 'G', 'H', 'J', 'K', 'L', 'Ñ'], ['↹', 'Z', 'X', 'C', 'V', 'B', 'N', 'M', '⌫']].forEach(function (fila) {\n      var f = el('div', 'fila-teclado');\n      fila.forEach(function (k) {\n        var b = el('button', 'tecla' + (k === '↹' || k === '⌫' ? ' accion' : ''), k); b.type = 'button';\n        b.setAttribute('aria-label', k === '↹' ? 'Siguiente palabra' : k === '⌫' ? 'Borrar' : 'Letra ' + k);\n        b.addEventListener('click', function (e) { e.preventDefault(); if (k === '⌫') borrar(true); else if (k === '↹') siguientePalabra(1); else escribir(k); });\n        f.appendChild(b);\n      });\n      teclado.appendChild(f);\n    });\n  }\n  var bMovAyuda = $('btn-movil-ayuda');\n  if (bMovAyuda) bMovAyuda.addEventListener('click', function () { if (activa) verAyuda(activa); });\n\n  /* ───────────── arranque ───────────── */\n  if (!restaurar(M.sesion.estado)) palabras = tableroNuevo();\n  elegirDoradas(); pintarTablero(); pintarPistas();\n  if (soloVer || modo === 'repaso') {\n    ['btn-comprobar', 'btn-revelar', 'btn-limpiar', 'btn-reiniciar'].forEach(function (id) { if ($(id)) $(id).disabled = true; });\n    if (teclado) teclado.hidden = true;\n  }\n  if (palabras.length) seleccionar(palabras.filter(function (w) { return !resueltas[w.clave]; })[0] || palabras[0]);\n  if (terminado) { cursor = null; refrescar(); }\n  else if (modo === 'normal' && palabras.length && palabras.every(function (w) { return resueltas[w.clave]; }) && !OVA.finalizado)\n    M.aviso('Ya resolviste todas las palabras: pulsa «Comprobar» para entregar.');\n  if (!M.sesion.estado && modo === 'normal') guardar();\n  setTimeout(ajustarTamano, 50);\n\n  /* Autoprueba del verificador: escribe cada palabra letra por letra con la misma función que el\n     teclado (sin ayudas), pulsa «Ver mi resultado» en la ventana de cierre como lo haría el\n     estudiante y espera el cierre normal (M.terminar). Devuelve la nota. */\n  window.OVA_AUTOPRUEBA = function () {\n    if (terminado) nuevoIntento(true);\n    palabras.slice().forEach(function (w) {\n      seleccionar(w, w.fila + ',' + w.col);\n      for (var i = 0; i < w.palabra.length; i++) { cursor = celdasDe(w)[i].join(','); escribir(w.palabra[i]); }\n    });\n    return new Promise(function (ok) {\n      var t0 = Date.now();\n      (function esperar() {\n        if (terminado || Date.now() - t0 > 5000) { ok(window.__cruNota); return; }\n        var b = M.retroAbierta() && $('btn-retro-continuar'); if (b) b.click();\n        setTimeout(esperar, 50);\n      })();\n    });\n  };\n})();\n\n<\/script>\n</body></html>\n","novato":"<!DOCTYPE html>\n<html lang=\"es\"><head><meta charset=\"UTF-8\"><meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Crucigrama Guiado: Gráficas de seno y coseno: dominio, rango y periodo</title>\n<style>\n/* =========================================================================\n   Identidad visual — Gimnasio Campestre de Guilford (fuente única del kit)\n   Colores tomados por muestreo del sitio web y del logotipo institucional.\n   Los motores y plantillas usan SOLO estas variables. No copie los valores\n   a otros archivos: si cambia un color, se cambia aquí.\n   ========================================================================= */\n@import url('https://fonts.googleapis.com/css2?family=Bitter:wght@600;700&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap');\n\n:root {\n  --g-verde: #35993a;        /* árbol del logotipo */\n  --g-verde-osc: #005d31;    /* titulares del sitio */\n  --g-verde-tinte: #eaf5eb;\n  --g-verde-borde: #cfe6d1;\n  --g-azul: #394e65;         /* navegación principal */\n  --g-azul-osc: #1f3247;\n  --g-azul-tinte: #eef1f5;\n  --g-dorado: #d3a85f;       /* sello 26 años */\n  --g-dorado-osc: #ba934f;\n  --g-dorado-tinte: #fbf4e7;\n\n  --g-tinta: #23282d;\n  --g-texto: #3d4650;\n  --g-suave: #5f6b76;        /* contraste 5,3:1 sobre blanco */\n  --g-linea: #e2e6ea;\n  --g-fondo: #f4f6f7;\n  --g-papel: #ffffff;\n  --g-ok: #2e7d32;\n  --g-alerta: #8a5300;\n  --g-error: #b3261e;\n\n  /* Acento por nivel: <body data-nivel=\"aprendiz|novato\"> */\n  --nivel: var(--g-verde);\n  --nivel-osc: var(--g-verde-osc);\n  --nivel-tinte: var(--g-verde-tinte);\n\n  --serif: 'Bitter', Georgia, 'Times New Roman', serif;\n  --sans: 'Atkinson Hyperlegible', Verdana, 'Segoe UI', system-ui, sans-serif;\n  --r: 10px;\n  --r-l: 16px;\n  --sombra: 0 1px 2px rgba(35,40,45,.06), 0 4px 14px rgba(35,40,45,.06);\n}\nbody[data-nivel=\"novato\"] { --nivel: var(--g-azul); --nivel-osc: var(--g-azul-osc); --nivel-tinte: var(--g-azul-tinte); }\n\n</style><style>\n/* Componentes de los OVA de una pantalla (simulador, juego). Requiere guilford.css antes. */\n*, *::before, *::after { box-sizing: border-box; }\nhtml { -webkit-text-size-adjust: 100%; }\nbody {\n  margin: 0; background: var(--g-fondo); color: var(--g-texto);\n  font-family: var(--sans); font-size: 17px; line-height: 1.6;\n  overflow-x: hidden;\n}\nh1, h2, h3 { font-family: var(--serif); color: var(--g-tinta); line-height: 1.25; margin: 0 0 .5em; }\nh1 { font-size: clamp(1.4rem, 4vw, 2rem); }\nh2 { font-size: clamp(1.15rem, 3vw, 1.45rem); }\nh3 { font-size: 1.08rem; }\np { margin: 0 0 1em; }\nimg, svg, canvas { max-width: 100%; height: auto; }\n:focus-visible { outline: 3px solid var(--g-dorado); outline-offset: 2px; border-radius: 4px; }\n.oculto-visual { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }\n\n.ova-franja { padding: 10px 16px; font-size: .92rem; font-weight: 700; text-align: center; }\n.ova-franja-docente { background: var(--g-dorado-tinte); color: #6b4e17; border-bottom: 2px solid var(--g-dorado); }\n.ova-franja-repaso { background: var(--g-azul-tinte); color: var(--g-azul-osc); border-bottom: 2px solid var(--g-azul); }\n\n.ova-cabecera {\n  display: flex; align-items: center; gap: 14px; flex-wrap: wrap;\n  padding: 12px 20px; background: var(--g-papel); border-bottom: 4px solid var(--nivel);\n}\n.ova-cabecera img { height: 44px; width: auto; }\n.ova-cabecera .titulo { flex: 1 1 240px; min-width: 0; }\n.ova-cabecera .titulo h1 { margin: 0; font-size: clamp(1.1rem, 3.2vw, 1.5rem); }\n.ova-cabecera .titulo small { color: var(--g-suave); }\n.ova-nivel {\n  display: inline-block; padding: 3px 12px; border-radius: 999px; font-size: .82rem; font-weight: 700;\n  background: var(--nivel-tinte); color: var(--nivel-osc); border: 1px solid var(--nivel);\n}\n\n.ova-contenedor { max-width: 980px; margin: 0 auto; padding: 20px 16px 48px; }\n.ova-tarjeta { background: var(--g-papel); border-radius: var(--r-l); box-shadow: var(--sombra); padding: 20px; margin-bottom: 18px; }\n.ova-fase { font-size: .78rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--nivel-osc); margin-bottom: 4px; }\n\n.ova-btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px;\n  padding: 10px 20px; border: 0; border-radius: 999px; cursor: pointer;\n  font: 700 1rem var(--sans); background: var(--nivel); color: #fff;\n}\n.ova-btn:hover { background: var(--nivel-osc); }\n.ova-btn[disabled] { opacity: .5; cursor: not-allowed; }\n.ova-btn.secundario { background: var(--g-papel); color: var(--nivel-osc); border: 2px solid var(--nivel); }\n\n.ova-retro { margin-top: 12px; padding: 12px 14px; border-radius: var(--r); border-left: 5px solid; }\n.ova-retro.ok { background: #e8f5e9; border-color: var(--g-ok); color: #1b4d1f; }\n.ova-retro.mal { background: #fdecea; border-color: var(--g-error); color: #7a1a14; }\n.ova-retro.pista { background: var(--g-dorado-tinte); border-color: var(--g-dorado-osc); color: #5c4313; }\n\n.ova-control { display: grid; gap: 4px; margin: 10px 0; }\n.ova-control label { font-weight: 700; color: var(--g-tinta); }\n.ova-control input[type=range] { width: 100%; accent-color: var(--nivel); min-height: 32px; }\n.ova-control input[type=number], .ova-control input[type=text] {\n  font: 1rem var(--sans); padding: 10px 12px; border: 2px solid var(--g-linea); border-radius: var(--r); min-height: 44px; max-width: 220px;\n}\n.ova-dato { font-size: 1.25rem; font-weight: 700; color: var(--g-tinta); }\n.ova-formula { font-family: var(--serif); font-size: 1.15rem; background: var(--g-fondo); padding: 8px 14px; border-radius: var(--r); display: inline-block; }\n\n.ova-rejilla { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 18px; }\n.ova-progreso { height: 10px; background: var(--g-linea); border-radius: 999px; overflow: hidden; }\n.ova-progreso > span { display: block; height: 100%; background: var(--nivel); transition: width .3s; }\n\n.ova-transcripcion summary { cursor: pointer; font-weight: 700; color: var(--nivel-osc); }\n\n</style>\n<style>\n/* =========================================================================\n   Marco común de los OVA del kit Guilford v3 (todos los tipos, SCORM).\n   Diseño estándar tomado del crucigrama de Laura Alarcón (MAT10-P2-T03, 28-oct-2026):\n   tarjeta 16:9 en escritorio, barra superior con puntos, racha, tiempo y desafíos,\n   ventana de resultado, avisos flotantes y confeti. Requiere guilford.css y ova.css antes.\n   Lo dibuja js/marco.js; el tipo solo pone su actividad dentro de #ova-area.\n   No editar dentro de un OVA: se corrige en _kit/motores/pantalla/ y se vuelve a copiar.\n   ========================================================================= */\n\n:root {\n  /* Aprendiz: verde Guilford */\n  --c-primario: var(--g-verde-osc);\n  --c-primario-luz: var(--g-verde);\n  --c-primario-tinte: var(--g-verde-tinte);\n  --c-primario-borde: #bfe3cc;\n  --c-fondo-general: #f4f7f5;\n  --c-tarjeta-fondo: #ffffff;\n  --c-texto-base: #2d3748;\n  --c-texto-suave: var(--g-suave);\n  --c-linea: #e2e8f0;\n  --c-radio: 12px;\n  --c-sombra: 0 4px 14px rgba(0, 93, 49, 0.08);\n  --c-acierto-fondo: #e8f5e9;\n  --c-acierto-texto: #1b5e20;\n  --c-acierto-borde: #81c784;\n  --c-error-fondo: #ffebee;\n  --c-error-texto: #b71c1c;\n  --c-error-borde: #e57373;\n  /* Acento de logros: el dorado institucional (sello de los 26 años) */\n  --c-oro: #f59e0b;\n  --c-oro-fondo: #fffbeb;\n  --c-oro-borde: #fcd34d;\n  --c-oro-texto: #92400e;\n  --c-fuego: #ef4444;\n  --c-fuego-fondo: #fef2f2;\n  --ui: system-ui, -apple-system, BlinkMacSystemFont, \"Segoe UI\", Roboto, sans-serif;\n}\n/* Novato: azul Guilford */\nbody[data-nivel=\"novato\"] {\n  --c-primario: var(--g-azul-osc);\n  --c-primario-luz: var(--g-azul);\n  --c-primario-tinte: var(--g-azul-tinte);\n  --c-primario-borde: #c7d6e5;\n  --c-fondo-general: #f0f3f6;\n  --c-acierto-fondo: #e3f2fd;\n  --c-acierto-texto: #0d47a1;\n  --c-acierto-borde: #90caf9;\n  --c-sombra: 0 4px 14px rgba(31, 50, 71, 0.08);\n}\n\nbody { background: var(--c-fondo-general); color: var(--c-texto-base); font-family: var(--ui); overflow-x: hidden; }\n\n/* ── Tarjeta principal ─────────────────────────────────────────────── */\n.ova-marco { width: 100%; max-width: 1140px; margin: 0 auto; }\n.ova-tarjeta-marco {\n  position: relative; background: var(--c-tarjeta-fondo); border-radius: var(--c-radio);\n  box-shadow: var(--c-sombra); border: 1px solid var(--c-linea); padding: 10px 14px; max-width: 100%; overflow-x: hidden;\n}\n#ova-area { min-width: 0; }\n\n/* ── Barra superior (HUD + acciones) ───────────────────────────────── */\n.ova-topbar {\n  display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap;\n  background: var(--c-primario-tinte); border: 1px solid var(--c-primario-borde); border-radius: 8px;\n  padding: 4px 10px; margin-bottom: 5px; min-height: 44px; max-width: 100%;\n}\n.topbar-stats { display: flex; align-items: center; flex-wrap: wrap; gap: 7px; font-size: .82rem; font-weight: 700; color: var(--c-primario); }\n.stat-valor { font-size: .95rem; font-weight: 800; }\n.hud-caja {\n  display: inline-flex; align-items: center; gap: 3px; background: #fff; border: 1px solid var(--c-linea);\n  padding: 2px 7px; border-radius: 12px; font-size: .78rem; color: var(--c-texto-suave);\n}\n.hud-etiqueta { font-weight: 700; }\n.hud-puntos { border-color: var(--c-oro-borde); color: var(--c-oro-texto); font-weight: 800; box-shadow: 0 1px 2px rgba(245,158,11,.15); }\n.hud-puntos .num { font-size: .88rem; color: #b45309; }\n.hud-racha { background: var(--c-fuego-fondo); border-color: #fecaca; color: var(--c-fuego); font-weight: 800; animation: racha-pulso 1s infinite alternate; }\n.hud-racha[hidden] { display: none; }\n@keyframes racha-pulso { from { transform: scale(1); } to { transform: scale(1.06); } }\n.hud-desafios { border-color: var(--c-primario-borde); gap: 5px; }\n.desafios-items { display: flex; gap: 4px; }\n/* Invitación a los desafíos hasta que se abren por primera vez */\n.hud-desafios.invita { border-color: var(--c-oro); background: var(--c-oro-fondo); animation: invita-pulso 1.6s ease-in-out infinite; }\n@keyframes invita-pulso { 0%, 100% { box-shadow: 0 0 0 0 rgba(245,158,11,.45); } 50% { box-shadow: 0 0 0 4px rgba(245,158,11,0); } }\n.desafios-que { border: 0; background: var(--c-oro); color: #fff; font: 800 .7rem var(--ui); border-radius: 999px; padding: 2px 8px; cursor: pointer; white-space: nowrap; }\n@media (prefers-reduced-motion: reduce) { .hud-desafios.invita { animation: none; } }\n\n.medalla-chip {\n  width: 22px; height: 22px; border-radius: 50%; background: #f1f5f9; border: 1px solid #cbd5e1;\n  display: flex; align-items: center; justify-content: center; font-size: .72rem; font-weight: 800; color: #475569;\n  cursor: pointer; padding: 0; font-family: var(--ui); filter: grayscale(1); opacity: .55; transition: all .25s;\n}\nbutton.medalla-chip:hover { opacity: .85; filter: none; }\n.medalla-chip.desbloqueada {\n  filter: none; opacity: 1; background: var(--c-oro-fondo); border-color: var(--c-oro); color: var(--c-oro-texto);\n  box-shadow: 0 0 6px rgba(245,158,11,.5); animation: medalla-pop .4s cubic-bezier(.175,.885,.32,1.275);\n}\n@keyframes medalla-pop { 0% { transform: scale(.6); } 60% { transform: scale(1.35); } 100% { transform: scale(1); } }\n\n.topbar-acciones { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }\n.btn-accion {\n  display: inline-flex; align-items: center; justify-content: center; gap: 3px; min-height: 32px; padding: 4px 10px;\n  border-radius: 16px; font: 700 .78rem var(--ui); border: 1px solid var(--c-primario-borde);\n  background: var(--c-tarjeta-fondo); color: var(--c-primario); cursor: pointer; box-shadow: 0 1px 2px rgba(0,0,0,.05);\n  transition: all .12s; white-space: nowrap;\n}\n.btn-accion:hover { background: var(--c-primario-tinte); }\n.btn-accion.primario { background: var(--c-primario); color: #fff; border-color: var(--c-primario); }\n.btn-accion.primario:hover { background: var(--c-primario-luz); }\n.btn-accion[disabled] { opacity: .5; cursor: not-allowed; }\n.btn-accion[aria-pressed=\"false\"] { color: var(--c-texto-suave); }\n\n.ova-tarjeta-marco .ova-progreso { height: 4px; background: var(--c-primario-tinte); border-radius: 2px; overflow: hidden; margin-bottom: 8px; }\n.ova-tarjeta-marco .ova-progreso > span { display: block; height: 100%; width: 0; background: var(--c-primario-luz); transition: width .3s; }\n\n/* ── Piezas que comparten los tipos ────────────────────────────────── */\n.ova-panel { background: var(--c-primario-tinte); border: 1px solid var(--c-primario-borde); border-radius: 10px; padding: 10px 12px; }\n.ova-panel h3, .ova-seccion-titulo {\n  font: 800 .82rem var(--ui); text-transform: uppercase; letter-spacing: .4px; color: var(--c-primario);\n  margin: 0 0 8px; padding-bottom: 4px; border-bottom: 2px solid var(--c-primario-borde);\n}\n.ova-item {\n  background: #fff; border: 1px solid var(--c-linea); border-radius: 8px; padding: 8px 10px; margin-bottom: 6px;\n  transition: border-color .15s, box-shadow .15s;\n}\n.ova-item.activa { border-color: var(--c-primario-luz); box-shadow: 0 0 0 2px var(--c-primario-borde); background: var(--c-primario-tinte); }\n.ova-item.resuelta { background: var(--c-acierto-fondo); border-color: var(--c-acierto-borde); }\n.ova-etiqueta-chip { display: inline-block; font-size: .72rem; color: var(--c-texto-suave); background: #f1f5f9; border-radius: 6px; padding: 1px 6px; }\n.btn-ayuda {\n  display: inline-block; margin-top: 4px; padding: 1px 8px; border-radius: 999px; font: 700 .72rem var(--ui); cursor: pointer;\n  background: var(--c-oro-fondo); border: 1px solid var(--c-oro-borde); color: var(--c-oro-texto);\n}\n.btn-ayuda:hover { background: #fef3c7; }\n\n/* Opciones de respuesta (presentación, video, juego accesible, simulador) */\n.ova-opciones { display: grid; gap: 8px; margin: 10px 0; }\n.ova-opcion {\n  display: flex; align-items: center; gap: 10px; width: 100%; min-height: 44px; padding: 10px 12px; text-align: left;\n  background: #fff; border: 2px solid var(--c-linea); border-radius: 10px; font: 600 .95rem var(--ui); color: var(--c-texto-base); cursor: pointer;\n}\n.ova-opcion:hover { border-color: var(--c-primario-borde); background: var(--c-primario-tinte); }\n.ova-opcion .letra {\n  flex: 0 0 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center;\n  background: var(--c-primario-tinte); color: var(--c-primario); font-weight: 800;\n}\n.ova-opcion.correcta { border-color: var(--c-acierto-borde); background: var(--c-acierto-fondo); color: var(--c-acierto-texto); }\n.ova-opcion.incorrecta { border-color: var(--c-error-borde); background: var(--c-error-fondo); color: var(--c-error-texto); }\n.ova-opcion[disabled] { cursor: default; }\n\n/* ── Aviso flotante ────────────────────────────────────────────────── */\n.ova-toast {\n  position: absolute; top: 58px; left: 50%;   /* debajo de la barra superior: no tapa puntos ni tiempo */ transform: translateX(-50%); max-width: calc(100% - 24px);\n  background: #1f2937; color: #fff; padding: 8px 16px; border-radius: 24px; font-size: .82rem; font-weight: 700;\n  box-shadow: 0 8px 24px rgba(0,0,0,.25); border: 1px solid #374151; z-index: 100; pointer-events: none;\n  transition: all .3s cubic-bezier(.175,.885,.32,1.275); text-align: center;\n}\n.ova-toast.dorado { background: linear-gradient(135deg, #78350f, #b45309); border-color: var(--c-oro); }\n.ova-toast.oculto { opacity: 0; transform: translateX(-50%) translateY(-15px); }\n\n.ova-confeti { position: fixed; inset: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 9998; }\n\n/* ── Ventanas (resultado, ayuda, respuestas del docente) ───────────── */\n.ova-modal {\n  position: fixed; inset: 0; background: rgba(0,0,0,.65); backdrop-filter: blur(4px); z-index: 10000;\n  display: flex; align-items: center; justify-content: center; padding: 16px;\n}\n.ova-modal[hidden] { display: none; }\n.ova-modal-caja {\n  background: var(--c-tarjeta-fondo); border-radius: 16px; box-shadow: 0 14px 40px rgba(0,0,0,.3); padding: 24px 22px;\n  max-width: 440px; width: 100%; max-height: calc(100vh - 32px); overflow-y: auto; text-align: center;\n  animation: modal-entra .35s cubic-bezier(.175,.885,.32,1.275);\n}\n.ova-modal-caja.ancha { max-width: 760px; text-align: left; }\n@keyframes modal-entra { from { transform: scale(.85); opacity: 0; } to { transform: scale(1); opacity: 1; } }\n.modal-titulo { font: 700 1.3rem var(--serif); color: var(--c-primario); margin: 0 0 6px; }\n.modal-puntaje { margin: 4px 0 12px; color: var(--c-primario); }\n.modal-puntaje .numero { font-size: 2.6rem; font-weight: 800; }\n.modal-puntaje .maximo { font-size: 1.1rem; color: var(--c-texto-suave); font-weight: 700; }\n.modal-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 14px; }\n.modal-stat { background: var(--c-fondo-general); border: 1px solid var(--c-linea); border-radius: 8px; padding: 8px 6px; }\n.modal-stat small { display: block; font-size: .68rem; color: var(--c-texto-suave); text-transform: uppercase; font-weight: 700; }\n.modal-stat span { font-size: 1.15rem; font-weight: 800; color: var(--c-primario); }\n.modal-record { font-size: .8rem; color: #b45309; font-weight: 700; margin-bottom: 10px; }\n.modal-mensaje { margin: 0 0 10px; }\n.modal-sello {\n  display: inline-block; background: #e8f5e9; color: #2e7d32; font-size: .76rem; font-weight: 700;\n  padding: 3px 10px; border-radius: 999px; margin-bottom: 14px; border: 1px solid #a5d6a7;\n}\n.modal-sello.neutro { background: #f1f5f9; color: #475569; border-color: #cbd5e1; }\n.modal-acciones { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }\n.modal-ayuda-caja { background: var(--c-oro-fondo); border-left: 4px solid var(--c-oro); border-radius: 6px; padding: 10px 12px; margin-bottom: 14px; text-align: left; }\n.modal-ayuda-caja p { margin: 0; font-size: .9rem; color: #78350f; line-height: 1.45; }\n.tabla-respuestas { width: 100%; border-collapse: collapse; font-size: .85rem; margin-bottom: 14px; }\n.tabla-respuestas th { background: var(--c-primario); color: #fff; text-align: left; padding: 6px 8px; }\n.tabla-respuestas td { border-bottom: 1px solid var(--c-linea); padding: 6px 8px; vertical-align: top; }\n.tabla-respuestas code { font-size: .75rem; color: var(--c-texto-suave); }\n\n/* Retroalimentación al frente (M.retro): nunca dentro de la actividad */\n.ova-modal-caja.retro { border-top: 6px solid var(--c-linea); }\n.ova-modal-caja.retro.ok { border-top-color: var(--c-acierto-borde); }\n.ova-modal-caja.retro.mal { border-top-color: var(--c-error-borde); }\n.retro-icono { width: 48px; height: 48px; margin: 0 auto 6px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font: 800 1.5rem var(--ui); background: #f1f5f9; color: #475569; }\n.retro.ok .retro-icono { background: var(--c-acierto-fondo); color: var(--c-acierto-texto); }\n.retro.mal .retro-icono { background: var(--c-error-fondo); color: var(--c-error-texto); }\n.retro.ok .modal-titulo { color: var(--c-acierto-texto); }\n.retro.mal .modal-titulo { color: var(--c-error-texto); }\n.modal-retro-texto { text-align: left; font-size: .95rem; line-height: 1.5; margin: 0 0 14px; }\n.modal-retro-texto p { margin: 0 0 .6em; }\n.modal-retro-texto em { color: var(--c-oro-texto); }\n\n/* Panel de desafíos (se abre tocando las medallas) */\n.lista-desafios { list-style: none; margin: 0 0 14px; padding: 0; display: grid; gap: 8px; }\n.desafio-fila { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border: 1px solid var(--c-linea); border-radius: 10px; }\n.desafio-fila.logrado { background: var(--c-oro-fondo); border-color: var(--c-oro-borde); }\n.desafio-fila .medalla-chip { flex: 0 0 30px; width: 30px; height: 30px; cursor: default; }\n.desafio-texto { flex: 1; display: grid; gap: 2px; font-size: .88rem; }\n.desafio-premio { font-weight: 800; color: var(--c-oro-texto); white-space: nowrap; font-size: .85rem; }\n.modal-desafios-logrados { font-size: .85rem; font-weight: 700; color: var(--c-oro-texto); margin-bottom: 6px; }\n\n/* ── Escritorio: tarjeta panorámica 16:9 sin desplazamiento ────────── */\n@media (min-width: 820px) {\n  .ova-cabecera { padding: 6px 18px; margin-bottom: 6px; }\n  .ova-cabecera img { height: 30px; }\n  .ova-cabecera .titulo h1 { font-size: 1.05rem; margin: 0; }\n  .ova-cabecera .titulo small { font-size: .72rem; }\n  .ova-cabecera .ova-nivel { padding: 3px 10px; font-size: .76rem; }\n  .ova-contenedor { padding: 4px 14px 10px; max-width: 1080px; }\n  .ova-tarjeta-marco.panoramica { aspect-ratio: 16 / 9; height: 590px; max-height: 590px; display: flex; flex-direction: column; overflow: hidden; }\n  .ova-tarjeta-marco.panoramica #ova-area { flex: 1; min-height: 0; overflow: hidden; }\n  .ova-topbar { flex-wrap: nowrap; }\n}\n\n/* ── Celular: todo en una columna, cero desbordamiento a 360 px ────── */\n@media (max-width: 819px) {\n  .ova-contenedor { padding: 6px 4px 24px; max-width: 100%; }\n  .ova-tarjeta-marco { padding: 8px 6px; }\n  /* Rejilla de una columna + botones en flex: con grid auto-fit dentro de un flex en columna, Chromium\n     calculaba la fila de botones como si fueran apilados (172 px de hueco; lo midieron 4 motores). */\n  .ova-topbar { display: grid; grid-template-columns: minmax(0, 1fr); gap: 6px; padding: 6px 8px; }\n  .topbar-stats { justify-content: space-between; gap: 4px; font-size: .74rem; }\n  .topbar-acciones { display: flex; flex-wrap: wrap; gap: 4px; width: 100%; }\n  .btn-accion { flex: 1 1 72px; min-height: 40px; padding: 6px 2px; font-size: .74rem; border-radius: 6px; white-space: normal; }\n  .modal-stats { gap: 6px; }\n  .hud-desafios .medalla-chip { width: 28px; height: 28px; }\n  .ova-toast { position: fixed; top: 12px; }   /* visible aunque la página esté desplazada */\n}\n\n</style><style>\n/* =========================================================================\n   Crucigrama · kit Guilford v3 (SCORM). Solo lo propio del tipo: tablero, casillas,\n   pistas, banner de pista en celular y teclado táctil. La cabecera, la barra de puntos,\n   los avisos y las ventanas los pone el marco (marco.css).\n   Diseño tomado del crucigrama de Laura Alarcón (MAT10-P2-T03).\n   No editar dentro de un OVA: se corrige en _kit/motores/crucigrama/ y se vuelve a copiar.\n   ========================================================================= */\n\n:root {\n  --cru-tablero: #004424;\n  --cru-texto: #1c492e;\n  --cru-resaltada: #d6eedb;\n  --cru-activa: #ffd166;\n  --cru-activa-borde: #e09f00;\n}\nbody[data-nivel=\"novato\"] {\n  --cru-tablero: #152230;\n  --cru-texto: #1f3247;\n  --cru-resaltada: #dce5ef;\n}\n\n/* ── Disposición: tablero a la izquierda, pistas a la derecha ───────── */\n.crucigrama-layout { display: grid; grid-template-columns: 410px minmax(0, 1fr); gap: 14px; align-items: center; min-width: 0; }\n.tablero-columna { min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }\n\n.crucigrama-grid {\n  display: grid; gap: 1.5px; padding: 3px; border-radius: 6px; background: var(--cru-tablero);\n  box-shadow: inset 0 2px 5px rgba(0,0,0,.2), 0 3px 8px rgba(0,0,0,.06); user-select: none; -webkit-user-select: none;\n  max-width: 100%; touch-action: manipulation;\n}\n.crucigrama-grid:focus { outline: none; }\n.crucigrama-grid:focus-visible { outline: 3px solid var(--c-oro); outline-offset: 3px; }\n\n.celda {\n  position: relative; box-sizing: border-box; width: var(--tam-celda, 28px); height: var(--tam-celda, 28px);\n  display: flex; align-items: center; justify-content: center; background: #fff; border: 1.5px solid var(--c-primario);\n  border-radius: 2px; font: 800 calc(var(--tam-celda, 28px) * .55) var(--ui); color: var(--cru-texto); cursor: pointer;\n  transition: background .1s, border-color .1s, transform .1s;\n}\n.celda.vacia { background: var(--c-primario); border: none; cursor: default; }\n.celda.palabra-activa { background: var(--cru-resaltada); border-color: var(--c-primario); }\n.celda.correcta { background: var(--c-acierto-fondo); color: var(--c-acierto-texto); border-color: var(--c-acierto-borde); }\n.celda.incorrecta { background: var(--c-error-fondo); color: var(--c-error-texto); border-color: var(--c-error-borde); }\n.celda.activa { background: var(--cru-activa); color: var(--cru-texto); border-color: var(--cru-activa-borde); box-shadow: 0 0 0 2px var(--cru-activa-borde); z-index: 2; }\n.celda.revelada .letra { color: var(--c-oro-texto); text-decoration: underline dotted; }\n\n/* Casilla dorada (bonificación secreta) */\n.celda.dorada { background-color: #fef3c7; box-shadow: inset 0 0 0 2px #d97706; }\n.celda.dorada::after {\n  content: \"\"; position: absolute; top: 0; right: 0; border-style: solid; border-width: 0 7px 7px 0;\n  border-color: transparent #d97706 transparent transparent; pointer-events: none;\n}\n.celda.dorada.activa { background: var(--cru-activa); box-shadow: 0 0 0 2px #d97706, inset 0 0 4px #fbbf24; }\n.celda.dorada.hallada { background: var(--c-oro-fondo); box-shadow: inset 0 0 0 2px var(--c-oro); }\n\n@keyframes cru-onda { 0% { transform: scale(1); } 50% { transform: scale(1.18); background: #bbf7d0; z-index: 3; } 100% { transform: scale(1); } }\n.celda.onda-exito { animation: cru-onda .4s ease-out; }\n\n.numero-pista {\n  position: absolute; top: 1px; left: 2px; font-size: max(6px, calc(var(--tam-celda, 28px) * .29)); font-weight: 800;\n  color: var(--c-primario); line-height: 1; pointer-events: none;\n}\n\n/* ── Pistas ─────────────────────────────────────────────────────────── */\n.pistas-panel { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px 12px; align-content: start; min-width: 0; }\n.cru-instrucciones { grid-column: 1 / -1; margin: 0; font-size: .78rem; line-height: 1.35; color: var(--c-texto-suave); }\n.cru-instrucciones:empty { display: none; }\n.seccion-pistas { min-width: 0; }\n.seccion-pistas h3 { margin-bottom: 4px; }\n.lista-pistas { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 4px; }\n.item-pista { padding: 4px 8px; margin: 0 !important; cursor: pointer; display: flex; flex-direction: column; gap: 1px; }\n.item-pista:hover { border-color: var(--c-primario); }\n.item-pista.activa { background: var(--cru-resaltada); border-color: var(--c-primario); }\n.item-pista.resuelta { border-left: 3px solid var(--c-primario-luz); }\n.item-pista-encabezado { display: flex; align-items: center; gap: 6px; }\n.item-pista-encabezado .pista-letras { margin-left: auto; }\n.item-pista-encabezado .btn-ayuda { margin-top: 0; flex: none; }\n.pista-num { font-weight: 800; font-size: .78rem; color: var(--c-primario); }\n.pista-letras { font-size: .68rem; color: var(--c-texto-suave); background: var(--c-fondo-general); padding: 1px 4px; border-radius: 3px; white-space: nowrap; }\n.pista-texto { font-size: .78rem; line-height: 1.3; margin: 0; color: var(--c-texto-base); overflow-wrap: anywhere; }\n\n/* Banner de la pista activa (solo celular) y teclado táctil (celular o pantalla táctil) */\n.pista-movil-activa { display: none; }\n.teclado-tactil { display: none; width: 100%; max-width: 440px; margin-top: 8px; flex-direction: column; gap: 3px; }\n.teclado-tactil[hidden] { display: none !important; }\n.fila-teclado { display: flex; justify-content: center; gap: 3px; width: 100%; }\n.tecla {\n  flex: 1 1 0; min-width: 0; height: 40px; padding: 0; border: 1px solid var(--c-linea); border-radius: 5px;\n  background: #fff; color: var(--c-texto-base); font: 700 .9rem var(--ui); cursor: pointer; box-shadow: 0 1px 2px rgba(0,0,0,.06);\n  display: flex; align-items: center; justify-content: center; touch-action: manipulation;\n}\n.tecla:active { transform: translateY(1px); background: var(--c-primario-tinte); }\n.tecla.accion { flex: 1.4 1 0; background: var(--c-primario-tinte); color: var(--c-primario); border-color: var(--c-primario-borde); font-size: 1rem; }\n\n/* Contenido de la ventana de retroalimentación (M.retro del marco): resultado de «Comprobar» y cierre */\n.cru-retro-lista { list-style: none; margin: 6px 0 0; padding: 0; display: flex; flex-direction: column; gap: 5px; }\n.cru-retro-lista li { padding: 5px 10px 5px 12px; border-radius: 6px; border-left: 4px solid var(--c-linea); background: var(--c-fondo-general); font-size: .88rem; line-height: 1.4; }\n.cru-retro-lista .cru-retro-bien { border-left-color: var(--c-acierto-borde); background: var(--c-acierto-fondo); }\n.cru-retro-lista .cru-retro-mal { border-left-color: var(--c-error-borde); background: var(--c-error-fondo); }\n.cru-retro-lista .cru-retro-ayuda { border-left-color: var(--c-oro); background: var(--c-oro-fondo); }\n.cru-retro-pie { margin: 10px 0 0; font-size: .88rem; color: var(--c-texto-suave); }\n\n.cru-error { background: var(--c-error-fondo); border: 1px solid var(--c-error-borde); color: var(--c-error-texto); border-radius: 8px; padding: 10px 14px; font-size: .9rem; }\n.cru-error ul { margin: 6px 0 0; padding-left: 20px; }\n\n/* ── Escritorio (tarjeta 16:9 del marco) ───────────────────────────── */\n@media (min-width: 820px) {\n  .crucigrama-layout { height: 100%; }\n  .tablero-columna { height: 100%; }\n  .pistas-panel { max-height: 100%; overflow-y: auto; scrollbar-width: thin; }\n}\n/* Pantalla táctil grande (tableta): también lleva teclado en pantalla */\n@media (min-width: 820px) and (pointer: coarse) {\n  .teclado-tactil { display: flex; }\n  .tecla { height: 36px; }\n}\n\n/* ── Celular: una columna; la casilla se calcula con el ancho disponible ── */\n@media (max-width: 819px) {\n  .crucigrama-layout { grid-template-columns: minmax(0, 1fr); gap: 10px; }\n  .tablero-columna { width: 100%; }\n  .teclado-tactil { display: flex; max-width: 100%; margin: 6px 0 4px; }\n  .fila-teclado { gap: 2px; }\n  .tecla { font-size: .86rem; border-radius: 4px; }\n  .pistas-panel { grid-template-columns: minmax(0, 1fr); }\n  .item-pista { padding: 6px 8px; }\n  .pista-texto { font-size: .82rem; }\n  /* Arreglo local de la barra del marco: en una columna flex, Chrome mide la rejilla «auto-fit»\n     del marco como si tuviera una sola columna (cada fila salía de ~100 px). Ver parche propuesto. */\n  .ova-topbar .topbar-acciones { display: flex; flex-wrap: wrap; }\n  .ova-topbar .topbar-acciones .btn-accion { flex: 1 1 90px; width: auto; }\n  .item-pista .btn-ayuda, .pista-movil-activa .btn-ayuda { min-height: 32px; padding: 4px 12px; font-size: .78rem; }\n\n  .pista-movil-activa {\n    display: flex; flex-direction: column; gap: 4px; background: #fff; border: 1.5px solid var(--c-primario);\n    border-radius: 6px; padding: 6px 10px; margin-bottom: 6px; box-shadow: 0 2px 5px rgba(0,0,0,.05);\n    position: sticky; top: 0; z-index: 5;\n  }\n  .pista-movil-header { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }\n  .pista-movil-num { font-weight: 800; color: var(--c-primario); font-size: .85rem; }\n  .pista-movil-letras { font-size: .74rem; font-weight: 700; color: var(--c-texto-suave); margin-left: auto; }\n  .pista-movil-header .btn-ayuda { margin-top: 0; }\n  .pista-movil-texto { margin: 0; font-size: .85rem; line-height: 1.35; color: var(--c-texto-base); }\n}\n\n</style>\n</head><body data-nivel=\"novato\">\n<main id=\"ova-area\">\n  <\u0021-- Pista activa (solo en celular) -->\n  <div id=\"pista-movil-activa\" class=\"pista-movil-activa\" aria-live=\"polite\">\n    <div class=\"pista-movil-header\">\n      <span id=\"pista-movil-num\" class=\"pista-movil-num\">Selecciona una casilla</span>\n      <span id=\"pista-movil-letras\" class=\"pista-movil-letras\"></span>\n      <button type=\"button\" id=\"btn-movil-ayuda\" class=\"btn-ayuda\" hidden title=\"Ver una ayuda (esta palabra contará la mitad)\">Ver ayuda</button>\n    </div>\n    <p id=\"pista-movil-texto\" class=\"pista-movil-texto\">Toca cualquier casilla para ver su pista y resolverla.</p>\n  </div>\n  <div class=\"crucigrama-layout\">\n    <div class=\"tablero-columna\">\n      <div id=\"crucigrama-grid\" class=\"crucigrama-grid\" role=\"group\" tabindex=\"0\"\n           aria-label=\"Tablero del crucigrama: escribe con el teclado; flechas para moverte, espacio cambia de dirección, Enter pasa a la siguiente palabra\"></div>\n      <div id=\"teclado-tactil\" class=\"teclado-tactil\" aria-label=\"Teclado en pantalla\"></div>\n    </div>\n    <div class=\"ova-panel pistas-panel\">\n      <p id=\"cru-instrucciones\" class=\"cru-instrucciones\"></p>\n      <div class=\"seccion-pistas\"><h3>Horizontales</h3><ul id=\"lista-pistas-horizontales\" class=\"lista-pistas\"></ul></div>\n      <div class=\"seccion-pistas\"><h3>Verticales</h3><ul id=\"lista-pistas-verticales\" class=\"lista-pistas\"></ul></div>\n    </div>\n  </div>\n</main>\n<script>window.OVA_DEMO = true;<\/script>\n<script>\n/*\n * ova-scorm.js — Envoltorio SCORM 1.2 de los OVA del kit Guilford (v3: todos los tipos son SCORM).\n * Herramienta preexistente del contratista (Anexo E, literal a). No editar dentro de un OVA:\n * se corrige en _kit/motores/pantalla/ y se vuelve a copiar.\n *\n * Lo que el autor usa (nada más):\n *\n *   const sesion = OVA.iniciar('id-del-ova', { sigla: 'CRU' });   // { modo, estado }\n *      modo: 'normal'  → estudiante, escribe en Moodle\n *            'repaso'  → estudiante que reabre un intento cerrado: ve lo suyo, no escribe\n *            'docente' → vista previa del docente: TODO abierto, no escribe\n *            'local'   → sin Moodle (vista local o página pública): no escribe\n *      estado: lo último que se guardó con OVA.guardar(), o null\n *   OVA.guardar(estado)          // objeto pequeño (cabe en 4000 caracteres con margen)\n *   OVA.registrar({ clave, tipo, respuesta, esperada, correcta, descripcion })\n *   OVA.finalizar(puntaje, resumen)   // 0 a 100; ÚNICO momento en que se envía la nota (una vez por intento)\n *   OVA.soloLectura              // true en repaso, docente y local\n *   OVA.finalizado               // true cuando la nota de este intento ya quedó enviada\n *\n * MAPEO PARA EL DOCENTE (lo que se ve en Moodle → Informes del SCORM):\n *  - Interacciones: el id es  SIGLA_clave  (por ejemplo CRU_periodo, SOP_amplitud, ARR_03_clasificar).\n *    La «clave» la da el motor del tipo y es ESTABLE: no cambia de un estudiante a otro aunque el\n *    orden o la posición sean aleatorios. Así la columna del informe siempre es la misma pregunta.\n *    El enunciado va una sola vez en cmi.comments como «[SIGLA_clave] enunciado».\n *  - Resumen como interacciones (Informes → Interacciones y su CSV), solo al finalizar:\n *      RES_nota_0a100 · RES_aciertos_sin_ayuda · RES_aciertos_con_ayuda · RES_preguntas_total · RES_ayudas_usadas · RES_desafios_logrados · RES_minutos\n *  - Lo mismo como objetivos (Informes → Objetivos; en Moodle 4.5.14 ese informe no pinta las celdas,\n *    pero se ven en el seguimiento del intento), con nombre propio:\n *      Nota_0a100 · Aciertos_sin_ayuda · Aciertos_con_ayuda · Preguntas_total · Ayudas_usadas · Minutos\n *    (los que el motor no informe no se escriben).\n *  - cmi.comments termina con una línea  [RESUMEN] Nota 75/100 · 6 de 8 sin ayuda · 2 ayudas · 4 min 12 s\n *  - Tiempo: cmi.core.session_time en cada guardado y al salir (Moodle lo suma en «Tiempo total»).\n *\n * Reglas de Moodle que este archivo cumple (verificadas en Moodle 4.5 real, 8-sep-2026 y 13-oct-2026):\n *  1. cmi.core.score.raw solo se escribe en finalizar(). Con la nota escrita y el intento\n *     incompleto, Moodle da el intento por terminado y el estudiante ya no puede reanudar.\n *  2. El docente se detecta SOLO con lesson_mode == \"browse\". «credit» no sirve: Moodle manda\n *     no-credit también al estudiante que reabre su intento.\n *  3. En «review» Moodle acepta escrituras; la guarda de solo lectura está aquí, no en Moodle.\n *  4. La numeración de interacciones parte del mayor entre _count y lo guardado, para que un\n *     intento reanudado no escriba encima de las respuestas anteriores.\n *  5. cmi.comments se AÑADE (Moodle concatena): se escribe solo la línea nueva, nunca el texto completo.\n *  6. Las puntuaciones de objetivos van de 0 a 100 (Moodle rechaza otro rango).\n */\n(function () {\n  'use strict';\n\n  var api = null, modo = 'local', iniciado = false, terminado = false;\n  var inicio = Date.now(), nInteraccion = 0, estadoActual = null, ultimaRespuesta = Date.now();\n  var LIMITE_SUSPEND = 4000;\n  var comentados = {};\n\n  function buscarAPI(w) {\n    var saltos = 0;\n    while (w && saltos < 12) {\n      try { if (w.API) return w.API; } catch (e) { return null; }\n      if (w.parent === w) break;\n      w = w.parent; saltos++;\n    }\n    return null;\n  }\n  function encontrarAPI() {\n    var a = buscarAPI(window);\n    if (!a && window.opener) a = buscarAPI(window.opener);\n    return a;\n  }\n  function leer(k) { try { return api ? String(api.LMSGetValue(k)) : ''; } catch (e) { return ''; } }\n  function escribir(k, v) {\n    if (!api || OVA.soloLectura) return false;\n    try { return String(api.LMSSetValue(k, String(v))) === 'true'; } catch (e) { return false; }\n  }\n  function confirmar() { if (api && !OVA.soloLectura) try { api.LMSCommit(''); } catch (e) {} }\n\n  function tiempoScorm(ms) {\n    var s = Math.max(0, Math.round(ms / 1000));\n    var h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), x = s % 60;\n    function d(n) { return (n < 10 ? '0' : '') + n; }\n    return (h < 1000 ? d(h) : '9999') + ':' + d(m) + ':' + d(x);\n  }\n  function limpiar(v, max) { return String(v == null ? '' : v).replace(/[\\r\\n]+/g, ' ').slice(0, max || 255); }\n  /* Clave legible y estable: sin tildes, minúsculas, solo letras, números y guion bajo. */\n  function slug(t, max) {\n    return String(t == null ? '' : t).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase()\n      .replace(/ñ/g, 'n').replace(/[^a-z0-9]+/g, '_').replace(/^_+|_+$/g, '').slice(0, max || 40) || 'x';\n  }\n  function idLegible(clave) {\n    var s = OVA.sigla ? OVA.sigla + '_' : '';\n    return (s + slug(clave, 60)).slice(0, 255);\n  }\n  function comentar(etiqueta, texto) {\n    if (comentados[etiqueta]) return;\n    var previo = leer('cmi.comments');\n    if (previo.indexOf('[' + etiqueta + ']') >= 0) { comentados[etiqueta] = true; return; }\n    var linea = '[' + etiqueta + '] ' + limpiar(texto, 200);\n    if ((previo + linea).length >= 4000) return;\n    if (escribir('cmi.comments', previo ? ' | ' + linea : linea)) comentados[etiqueta] = true;\n  }\n  function minSeg(s) { s = Math.round(s); return Math.floor(s / 60) + ' min ' + (s % 60) + ' s'; }\n\n  function franja(texto, clase) {\n    var pintar = function () {\n      if (document.getElementById('ova-franja')) return;\n      var d = document.createElement('div');\n      d.id = 'ova-franja'; d.className = 'ova-franja ' + clase; d.setAttribute('role', 'status');\n      d.textContent = texto;\n      document.body.insertBefore(d, document.body.firstChild);\n    };\n    if (document.body) pintar(); else document.addEventListener('DOMContentLoaded', pintar);\n  }\n\n  var OVA = {\n    modo: 'local',\n    soloLectura: true,\n    finalizado: false,\n    sigla: '',\n    alumno: '',\n    slug: slug,\n    idLegible: idLegible,\n\n    iniciar: function (id, opciones) {\n      if (iniciado) return { modo: modo, estado: estadoActual };\n      iniciado = true;\n      opciones = opciones || {};\n      OVA.id = id || 'ova';\n      OVA.sigla = String(opciones.sigla || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 6);\n      api = encontrarAPI();\n      if (api) {\n        try { api.LMSInitialize(''); } catch (e) {}\n        var lm = leer('cmi.core.lesson_mode');\n        modo = lm === 'browse' ? 'docente' : lm === 'review' ? 'repaso' : 'normal';\n        OVA.alumno = leer('cmi.core.student_id');\n      } else {\n        modo = 'local';\n      }\n      OVA.modo = modo;\n      OVA.soloLectura = modo !== 'normal';\n      OVA.estadoInicial = null;\n\n      // Estado guardado: se lee en normal y en repaso (el estudiante ve lo suyo). El docente parte limpio.\n      if (api && modo !== 'docente') {\n        var bruto = leer('cmi.suspend_data');\n        if (bruto) {\n          try {\n            var paquete = JSON.parse(bruto);\n            estadoActual = paquete.e || null;\n            nInteraccion = paquete.n || 0;\n            OVA.finalizado = !!paquete.f;\n          } catch (e) { estadoActual = null; }\n        }\n      }\n      var cuenta = parseInt(leer('cmi.interactions._count'), 10);\n      if (!isNaN(cuenta)) nInteraccion = Math.max(nInteraccion, cuenta);\n      if (modo === 'normal' && leer('cmi.core.lesson_status') === 'completed') OVA.finalizado = true;\n\n      OVA.estadoInicial = estadoActual;\n      if (modo === 'normal') {\n        var st = leer('cmi.core.lesson_status');\n        if (!st || st === 'not attempted') escribir('cmi.core.lesson_status', 'incomplete');\n        confirmar();\n      }\n      if (modo === 'docente') franja('Vista docente: todo el contenido está abierto y nada se registra.', 'ova-franja-docente');\n      if (modo === 'repaso') franja('Estás repasando un intento terminado: puedes mirarlo, pero no se guardan cambios.', 'ova-franja-repaso');\n\n      window.addEventListener('pagehide', OVA.salir);\n      window.addEventListener('beforeunload', OVA.salir);\n      return { modo: modo, estado: estadoActual };\n    },\n\n    guardar: function (estado, ubicacion) {\n      estadoActual = estado;\n      if (OVA.soloLectura) return;\n      var texto = JSON.stringify({ v: 3, n: nInteraccion, f: OVA.finalizado ? 1 : 0, e: estado });\n      if (texto.length > LIMITE_SUSPEND) {\n        console.error('[OVA] El estado ocupa ' + texto.length + ' caracteres; SCORM 1.2 admite 4096. Guarde menos datos.');\n        return;\n      }\n      escribir('cmi.suspend_data', texto);\n      if (ubicacion != null) escribir('cmi.core.lesson_location', limpiar(ubicacion, 255));\n      escribir('cmi.core.session_time', tiempoScorm(Date.now() - inicio));\n      confirmar();\n    },\n\n    /* r.clave: identificador estable de la pregunta o palabra (no su posición en pantalla).\n       r.id se acepta por compatibilidad con OVA de la v2 y se usa tal cual. */\n    registrar: function (r) {\n      var ahora = Date.now(), lat = ahora - ultimaRespuesta;\n      ultimaRespuesta = ahora;\n      if (OVA.soloLectura) return;\n      var etiqueta = r.clave != null ? idLegible(r.clave) : limpiar(r.id || ('i' + nInteraccion), 255).replace(/[^A-Za-z0-9_.-]/g, '_');\n      var i = nInteraccion++, p = 'cmi.interactions.' + i + '.';\n      var tipos = ['true-false', 'choice', 'fill-in', 'matching', 'performance', 'sequencing', 'likert', 'numeric'];\n      escribir(p + 'id', etiqueta);\n      escribir(p + 'type', tipos.indexOf(r.tipo) >= 0 ? r.tipo : 'performance');\n      escribir(p + 'student_response', limpiar(r.respuesta, 255));\n      if (r.esperada != null) escribir(p + 'correct_responses.0.pattern', limpiar(r.esperada, 255));\n      escribir(p + 'result', r.correcta === true ? 'correct' : r.correcta === false ? 'wrong' : 'neutral');\n      escribir(p + 'latency', tiempoScorm(lat));\n      var d = new Date();\n      escribir(p + 'time', [d.getHours(), d.getMinutes(), d.getSeconds()].map(function (n) { return (n < 10 ? '0' : '') + n; }).join(':'));\n      // El enunciado no viaja en SCORM 1.2: se deja una sola vez en cmi.comments para el informe.\n      if (r.descripcion) comentar(etiqueta, r.descripcion);\n      if (estadoActual !== null) OVA.guardar(estadoActual);\n      else confirmar();\n    },\n\n    /* resumen (opcional): { aciertos, conAyuda, total, ayudas, segundos }. Se escribe como objetivos\n       con nombre propio y como la línea [RESUMEN] de cmi.comments. Solo la primera vez por intento. */\n    finalizar: function (puntaje, resumen) {\n      if (OVA.soloLectura || terminado || OVA.finalizado) return false;\n      var n = Math.max(0, Math.min(100, Math.round(Number(puntaje) || 0)));\n      resumen = resumen || {};\n      var seg = resumen.segundos != null ? resumen.segundos : (Date.now() - inicio) / 1000;\n      var obj = [['Nota_0a100', n]];\n      if (resumen.aciertos != null) obj.push(['Aciertos_sin_ayuda', resumen.aciertos]);\n      if (resumen.conAyuda != null) obj.push(['Aciertos_con_ayuda', resumen.conAyuda]);\n      if (resumen.total != null) obj.push(['Preguntas_total', resumen.total]);\n      if (resumen.ayudas != null) obj.push(['Ayudas_usadas', resumen.ayudas]);\n      if (resumen.desafios != null) obj.push(['Desafios_logrados', resumen.desafios]);\n      obj.push(['Minutos', Math.round(seg / 60)]);\n      var base = parseInt(leer('cmi.objectives._count'), 10);\n      if (isNaN(base)) base = 0;\n      obj.forEach(function (o, k) {\n        var q = 'cmi.objectives.' + (base + k) + '.';\n        escribir(q + 'id', o[0]);\n        escribir(q + 'score.min', '0');\n        escribir(q + 'score.max', '100');\n        escribir(q + 'score.raw', String(Math.max(0, Math.min(100, Math.round(Number(o[1]) || 0)))));\n        escribir(q + 'status', 'completed');\n      });\n      // El informe de Objetivos de Moodle 4.5.14 no pinta las celdas (error de su consulta: lee\n      // «scoid» y selecciona «ss.id»; comprobado en el Moodle local el 28-oct-2026). Por eso el mismo\n      // resumen va también como interacciones RES_*, que sí salen en Informes → Interacciones y en el CSV.\n      obj.forEach(function (o) {\n        var q = 'cmi.interactions.' + (nInteraccion++) + '.';\n        escribir(q + 'id', 'RES_' + slug(o[0], 40));\n        escribir(q + 'type', 'numeric');\n        escribir(q + 'student_response', String(Math.round(Number(o[1]) || 0)));\n        escribir(q + 'result', 'neutral');\n      });\n      var partes = ['Nota ' + n + '/100'];\n      if (resumen.aciertos != null && resumen.total != null) partes.push(resumen.aciertos + ' de ' + resumen.total + ' sin ayuda');\n      if (resumen.conAyuda) partes.push(resumen.conAyuda + ' con ayuda');\n      if (resumen.ayudas != null) partes.push(resumen.ayudas + (resumen.ayudas === 1 ? ' ayuda' : ' ayudas'));\n      partes.push(minSeg(seg));\n      comentar('RESUMEN', partes.join(' · '));\n\n      escribir('cmi.core.score.min', '0');\n      escribir('cmi.core.score.max', '100');\n      escribir('cmi.core.score.raw', String(n));\n      escribir('cmi.core.lesson_status', 'completed');\n      escribir('cmi.core.session_time', tiempoScorm(Date.now() - inicio));\n      OVA.finalizado = true;\n      if (estadoActual !== null) OVA.guardar(estadoActual); else confirmar();\n      return true;\n    },\n\n    salir: function () {\n      if (terminado || !api) return;\n      terminado = true;\n      if (!OVA.soloLectura) {\n        escribir('cmi.core.session_time', tiempoScorm(Date.now() - inicio));\n        escribir('cmi.core.exit', OVA.finalizado ? '' : 'suspend');\n        confirmar();\n      }\n      try { api.LMSFinish(''); } catch (e) {}\n    }\n  };\n\n  window.OVA = OVA;\n})();\n\n<\/script><script>\n/*\n * marco.js — Marco común de los OVA del kit Guilford v3 (diseño estándar de todos los tipos).\n * Herramienta preexistente del contratista (Anexo E). No editar dentro de un OVA:\n * se corrige en _kit/motores/pantalla/ y se vuelve a copiar.\n *\n * Dibuja alrededor de <main id=\"ova-area\"> la cabecera institucional, la barra superior\n * (contador, puntos, racha, tiempo, desafíos y botones), la barra de progreso, los avisos,\n * el confeti y las ventanas de resultado, ayuda y respuestas del docente. Requiere ova-scorm.js.\n *\n *   const M = Marco.iniciar({\n *     meta: DATOS.meta,                  // { codigo, titulo, asignatura, grado, periodo, nivel }\n *     sigla: 'CRU',                      // prefijo de las interacciones en Moodle\n *     etiquetaTotal: 'Palabras', total: 8,\n *     desafios: [{ id: 'primer', num: 'I', nombre: 'Primer acierto', texto: 'Resuelve…', puntos: 100 }],\n *                                        // solo PREMIAN: dan puntos extra y medalla, nunca tocan la nota\n *     acciones: [{ id: 'btn-comprobar', texto: 'Comprobar', primario: true, alPulsar: fn }],\n *     panoramica: true,                  // tarjeta 16:9 fija en escritorio (si la actividad cabe)\n *     mapa: () => [{ clave, enunciado, esperada }]  \"Valores angulares de entrada donde la curva corta al eje horizontal y su salida es nula.\", ayuda: \"Puntos donde la gráfica cruza el eje horizontal y la altura vale 0.\" },\n    { clave: \"coseno\", palabra: \"COSENO\", pista: \"Función cuya salida corresponde a la coordenada horizontal del punto en la circunferencia unitaria.\", ayuda: \"Inicia en su punto más alto (0,1) y luego desciende.\" },\n    { clave: \"periodo\", palabra: \"PERIODO\", pista: \"Menor avance horizontal positivo tras el cual la curva repite exactamente sus valores.\", ayuda: \"En seno y coseno básicos equivale a una vuelta completa de dos pi radianes (2π).\" },\n    { clave: \"dominio\", palabra: \"DOMINIO\", pista: \"Conjunto de todas las medidas angulares de entrada permitidas en una función.\", ayuda: \"Son todas las entradas reales posibles en el eje horizontal.\" },\n    { clave: \"rango\", palabra: \"RANGO\", pista: \"Conjunto de todos los valores de salida alcanzados en el eje vertical.\", ayuda: \"En seno y coseno va desde menos uno hasta uno: [-1, 1].\" },\n    { clave: \"seno\", palabra: \"SENO\", pista: \"Función cuya salida corresponde a la altura vertical en el círculo unitario.\", ayuda: \"Su gráfica arranca desde el origen (0,0).\" },\n    { clave: \"funcion\", palabra: \"FUNCION\", pista: \"Regla que asigna una única salida a cada ángulo de entrada permitido.\", ayuda: \"Relación matemática entre ángulos y coordenadas.\" },\n    { clave: \"amplitud\", palabra: \"AMPLITUD\", pista: \"Altura máxima medida desde el centro del eje hasta la cresta de la curva.\", ayuda: \"En seno y coseno estándar su valor es 1.\" },\n    { clave: \"radian\", palabra: \"RADIAN\", pista: \"Unidad angular con la que se marcan las divisiones del eje horizontal.\", ayuda: \"Una vuelta entera mide 2π de estas unidades.\" },\n    { clave: \"ciclo\", palabra: \"CICLO\", pista: \"Recorrido u onda completa antes de volver a repetirse.\", ayuda: \"Onda completa de longitud 2π.\" },\n    { clave: \"origen\ a revelar) está en datos.js, no aquí.\n *  - Los desafíos solo premian (puntos extra y medalla). Ningún error corta la actividad.\n */\n(function () {\n  'use strict';\n\n  var D = window.DATOS || {};\n  /* Todo lo que distingue a un nivel viene de datos.js; aquí solo hay valores por omisión iguales para todos. */\n  var NUM = Math.round(Number(D.numPalabras) || 8);\n  var N = Math.round(Number(D.tablero) || 13);   // filas = columnas\n  var CELDA_MAX = Math.round(Number(D.celda) || (N <= 11 ? 32 : 28));   // tamaño máximo de la casilla en px\n  var MAX_REVELAR = D.revelar == null ? 3 : Math.round(Number(D.revelar));\n\n  /* ───────────── utilidades ───────────── */\n  function sinTildes(t) { return String(t == null ? '' : t).normalize('NFD').replace(/[̀-ͯ]/g, ''); }\n  function plano(t) { return sinTildes(t).toLowerCase().replace(/[^a-z0-9ñ]/g, ''); }\n  function claveDe(t) { return sinTildes(t).toLowerCase().replace(/[^a-z0-9ñ]+/g, '_').replace(/ñ/g, 'n').replace(/^_+|_+$/g, '').slice(0, 40); }\n  function mezclar(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t; } return a; }\n  function $(id) { return document.getElementById(id); }\n  function el(tag, clase, texto) { var e = document.createElement(tag); if (clase) e.className = clase; if (texto != null) e.textContent = texto; return e; }\n\n  /* ───────────── validación de datos.js ───────────── */\n  var errores = [];\n  var banco = [];\n  (function validar() {\n    if (!window.DATOS) { errores.push('No se encontró js/datos.js o no define window.DATOS.'); return; }\n    if (!D.meta || !D.meta.titulo) errores.push('Falta meta.titulo en js/datos.js.');\n    if (!(NUM >= 3 && NUM <= 12)) errores.push('numPalabras debe estar entre 3 y 12 (ahora: ' + D.numPalabras + ').');\n    if (!(N >= 7 && N <= 15)) errores.push('tablero debe estar entre 7 y 15 casillas por lado (ahora: ' + D.tablero + ').');\n    if (!(CELDA_MAX >= 20 && CELDA_MAX <= 40)) errores.push('celda debe estar entre 20 y 40 píxeles (ahora: ' + D.celda + ').');\n    if (!(MAX_REVELAR >= 0 && MAX_REVELAR <= 5)) errores.push('revelar debe estar entre 0 y 5 letras (ahora: ' + D.revelar + ').');\n    if (!Array.isArray(D.bancoPalabras)) { errores.push('Falta bancoPalabras: la lista de palabras con su pista y su ayuda.'); return; }\n    var vistas = {};\n    D.bancoPalabras.forEach(function (b, i) {\n      var n = 'La palabra ' + (i + 1);\n      if (!b || typeof b.palabra !== 'string' || !b.palabra.trim()) { errores.push(n + ' no tiene «palabra».'); return; }\n      var p = b.palabra.trim(), P = p.toUpperCase();\n      n += ' («' + p + '»)';\n      if (/\\s/.test(p)) errores.push(n + ' tiene espacios: debe ser una sola palabra.');\n      else if (sinTildes(P.replace(/Ñ/g, '#')) !== P.replace(/Ñ/g, '#')) errores.push(n + ' tiene tilde o diéresis: escríbala sin tilde (' + sinTildes(P.replace(/Ñ/g, '#')).replace(/#/g, 'Ñ') + ').');\n      else if (!/^[A-ZÑ]+$/.test(P)) errores.push(n + ' tiene números o signos: solo se permiten letras.');\n      if (P.length < 3) errores.push(n + ' es muy corta: mínimo 3 letras.');\n      if (P.length > N) errores.push(n + ' tiene ' + P.length + ' letras y no cabe en un tablero de ' + N + ' casillas.');\n      if (typeof b.pista !== 'string' || b.pista.trim().length < 8) errores.push(n + ' no tiene pista (o es de menos de 8 caracteres).');\n      if (typeof b.ayuda !== 'string' || !b.ayuda.trim()) errores.push(n + ' no tiene ayuda (el texto que se abre con «Ver ayuda»).');\n      var e = plano(P);\n      if (e.length >= 4 && plano(b.pista).indexOf(e) >= 0) errores.push('La pista de la' + n.slice(2) + ' contiene la respuesta.');\n      if (e.length >= 4 && plano(b.ayuda).indexOf(e) >= 0) errores.push('La ayuda de la' + n.slice(2) + ' contiene la respuesta.');\n      var clave = claveDe(b.clave || p);\n      if (vistas[clave]) errores.push(n + ' está repetida (o su clave «' + clave + '» ya la usa otra palabra).');\n      vistas[clave] = true;\n      banco.push({ clave: clave, palabra: P, pista: String(b.pista || ''), ayuda: String(b.ayuda || ''), explicacion: String(b.explicacion || b.pista || '') });\n    });\n    if (banco.length < NUM) errores.push('bancoPalabras tiene ' + banco.length + ' palabras y el tablero pide ' + NUM + ': agregue más o baje numPalabras.');\n    if (D.respaldo != null) {\n      var r = Array.isArray(D.respaldo) ? colocacionFija(D.respaldo) : { error: 'respaldo debe ser una lista.' };\n      if (r.error) errores.push('Respaldo: ' + r.error);\n    }\n    if (!errores.length) {\n      var ok = false;\n      for (var k = 0; k < 6 && !ok; k++) ok = !!generar();\n      if (!ok && !D.respaldo) errores.push('No se logró armar un tablero de ' + N + '×' + N + ' con ' + NUM + ' palabras cruzadas. Cambie palabras que no compartan letras con las demás, agregue palabras al banco o defina «respaldo».');\n    }\n  })();\n  window.OVA_ERRORES = errores;\n\n  window.OVA_MAPA = function () {\n    /* Hoja de respuestas y «Ver respuestas»: palabra correcta, su explicación (o la definición) y la ayuda. */\n    return banco.map(function (b) { return { clave: b.clave, enunciado: b.pista, esperada: b.palabra, opciones: [], explicacion: b.explicacion, pistas: [b.ayuda] }; });\n  };\n\n  /* ───────────── generación del tablero ───────────── */\n  function celdasDe(w) { var a = []; for (var i = 0; i < w.palabra.length; i++) a.push(w.dir === 'V' ? [w.fila + i, w.col] : [w.fila, w.col + i]); return a; }\n\n  function cabe(pal, r0, c0, dir, g) {\n    var dr = dir === 'V' ? 1 : 0, dc = 1 - dr;\n    if (g[(r0 - dr) + ',' + (c0 - dc)]) return false;\n    if (g[(r0 + dr * pal.length) + ',' + (c0 + dc * pal.length)]) return false;\n    var cruces = 0;\n    for (var i = 0; i < pal.length; i++) {\n      var r = r0 + dr * i, c = c0 + dc * i, x = g[r + ',' + c];\n      if (x) { if (x.l !== pal[i] || x[dir]) return false; cruces++; }\n      else if (g[(r + dc) + ',' + (c + dr)] || g[(r - dc) + ',' + (c - dr)]) return false;\n    }\n    return cruces >= 1;\n  }\n  function poner(g, w) { celdasDe(w).forEach(function (rc, i) { var k = rc[0] + ',' + rc[1]; g[k] = g[k] || { l: w.palabra[i] }; g[k][w.dir] = true; }); }\n\n  /* Algoritmo de Laura: primera palabra al centro y las demás cruzadas al azar; se encuadra en N×N. */\n  function generar() {\n    for (var intento = 0; intento < 80; intento++) {\n      var g = {}, puestas = [], pool = mezclar(banco);\n      var p0 = pool[0], w0 = { clave: p0.clave, palabra: p0.palabra, dir: Math.random() < 0.5 ? 'H' : 'V', fila: 40, col: 40 - Math.floor(p0.palabra.length / 2) };\n      if (w0.dir === 'V') { w0.fila = 40 - Math.floor(p0.palabra.length / 2); w0.col = 40; }\n      poner(g, w0); puestas.push(w0);\n      for (var i = 1; i < pool.length && puestas.length < NUM; i++) {\n        var cand = pool[i], opciones = [];\n        puestas.forEach(function (w) {\n          var dir = w.dir === 'H' ? 'V' : 'H';\n          celdasDe(w).forEach(function (rc, iw) {\n            for (var ic = 0; ic < cand.palabra.length; ic++) {\n              if (cand.palabra[ic] !== w.palabra[iw]) continue;\n              var r = dir === 'V' ? rc[0] - ic : rc[0], c = dir === 'H' ? rc[1] - ic : rc[1];\n              if (cabe(cand.palabra, r, c, dir, g)) opciones.push({ clave: cand.clave, palabra: cand.palabra, dir: dir, fila: r, col: c });\n            }\n          });\n        });\n        if (!opciones.length) continue;\n        // Preferir las que dejan el tablero más compacto (así casi siempre cabe en N×N)\n        opciones.forEach(function (o) { o.peso = extension(puestas.concat([o])) + Math.random() * 2; });\n        opciones.sort(function (a, b) { return a.peso - b.peso; });\n        var elegida = opciones[Math.floor(Math.random() * Math.min(3, opciones.length))];\n        delete elegida.peso;\n        poner(g, elegida); puestas.push(elegida);\n      }\n      if (puestas.length < NUM) continue;\n      var lim = limites(pues
