ult >= 2 ? ' (racha ×2)' : ''));\n  }\n\n  /* ───────────── acciones ───────────── */\n  function verAyuda(w) {\n    if (!soloVer && !terminado && !resueltas[w.clave] && !vistasAyuda[w.clave]) { vistasAyuda[w.clave] = true; conAyudaDe[w.clave] = true; guardar(); }\n    seleccionar(w);\n    M.ayuda('Ayuda · ' + w.num + '. ' + (w.dir === 'H' ? 'Horizontal' : 'Vertical') + ' (' + w.palabra.length + ' letras)', w.ayuda);\n  }\n  function revelar() {\n    if (bloqueado()) return;\n    if (nRevelar >= MAX_REVELAR) { M.aviso('Ya usaste las ' + MAX_REVELAR + ' letras de ayuda de este intento.'); return; }\n    if (resueltas[activa.clave]) { M.aviso('Esa palabra ya está resuelta: elige otra.'); return; }\n    var k = letras[cursor] === letraEsperada(cursor)\n      ? celdasDe(activa).map(function (rc) { return rc[0] + ',' + rc[1]; }).filter(function (x) { return letras[x] !== letraEsperada(x); })[0]\n      : cursor;\n    if (!k) return;\n    nRevelar++;\n    conAyudaDe[activa.clave] = true;\n    M.sumar(-30); M.fallo();\n    M.aviso('Letra revelada (' + nRevelar + '/' + MAX_REVELAR + '): esta palabra contará la mitad.');\n    cursor = k;\n    escribir(letraEsperada(k), true);\n  }\n  function limpiar() {\n    if (bloqueado()) return;\n    celdasDe(activa).forEach(function (rc) {\n      var k = rc[0] + ',' + rc[1];\n      if (!palabrasEn(k).some(function (w) { return resueltas[w.clave]; })) { delete letras[k]; if (celdas[k]) celdas[k].classList.remove('incorrecta'); }\n    });\n    confirmarEntrega = false;\n    seleccionar(activa); guardar();\n  }\n\n  /* «Comprobar»: el resultado (qué palabras están bien, cuáles tienen letras que no van y cuáles faltan)\n     sale en la ventana del marco, agrupado (bien, con letras que no van, incompletas). No dice las respuestas. */\n  function comprobar() {\n    if (soloVer || terminado) { if (terminado) M.aviso('El crucigrama ya se entregó. Pulsa «Reiniciar» para practicar con otro tablero.'); return; }\n    var faltan = palabras.filter(function (w) { return !resueltas[w.clave]; }).length;\n    if (!faltan) { completo(); return; }\n    if (confirmarEntrega) { entregar(); return; }\n    var bien = [], malas = [], incompletas = [];\n    palabras.forEach(function (w) {\n      if (resueltas[w.clave]) { bien.push(w); return; }\n      var hueco = completa(w).split('').filter(function (x) { return x === ' '; }).length;\n      if (hueco) { incompletas.push({ w: w, n: hueco }); return; }\n      malas.push(w);\n      conAyudaDe[w.clave] = true;     // se resolverá en un intento posterior: cuenta la mitad\n      celdasDe(w).forEach(function (rc, i) { var k = rc[0] + ',' + rc[1]; if (letras[k] !== w.palabra[i] && celdas[k]) celdas[k].classList.add('incorrecta'); });\n    });\n    if (malas.length) M.fallo();\n    confirmarEntrega = true;\n    guardar();\n    var fila = function (clase, texto) { return '<li class=\"cru-retro-' + clase + '\">' + texto + '</li>'; };\n    var html = '<ul class=\"cru-retro-lista\">'\n      + bien.map(function (w) { return fila('bien', '<strong>' + esc(nombreDe(w)) + '</strong>: bien resuelta.'); }).join('')\n      + malas.map(function (w) { return fila('mal', '<strong>' + esc(nombreDe(w)) + '</strong>: tiene letras que no van (las verás en rojo). Contará la mitad.'); }).join('')\n      + incompletas.map(function (x) { return fila('falta', '<strong>' + esc(nombreDe(x.w)) + '</strong>: incompleta (' + (x.n === 1 ? 'falta 1 letra' : 'faltan ' + x.n + ' letras') + ').'); }).join('')\n      + '</ul><p class=\"cru-retro-pie\">Corrige y sigue. Si prefieres entregar así, pulsa «Comprobar» otra vez.</p>';\n    M.retro({\n      ok: !malas.length,\n      titulo: malas.length ? (malas.length === 1 ? 'Una palabra tiene letras que no van' : malas.length + ' palabras tienen letras que no van') : 'Lo que llevas está bien',\n      html: html, boton: 'Seguir resolviendo'\n    });\n  }\n\n  /* Todas las palabras resueltas: repaso de cada término con su explicación y, al continuar, el cierre. */\n  function completo() {\n    if (terminado || M.retroAbierta()) return;\n    var conAy = palabras.filter(function (w) { return conAyudaDe[w.clave]; }).length;\n    var html = '<p>' + (conAy ? 'Resolviste las ' + palabras.length + ' palabras; ' + (conAy === 1 ? '1 con ayuda cuenta' : conAy + ' con ayuda cuentan') + ' la mitad.' : 'Resolviste las ' + palabras.length + ' palabras sin ninguna ayuda.') + ' Repasa lo que significa cada una:</p>'\n      + '<ul class=\"cru-retro-lista\">' + palabras.map(function (w) {\n        return '<li class=\"cru-retro-' + (conAyudaDe[w.clave] ? 'ayuda' : 'bien') + '\"><strong>' + esc(w.palabra) + '</strong>: ' + esc(w.explicacion) + '</li>';\n      }).join('') + '</ul>';\n    M.retro({ ok: true, titulo: '¡Crucigrama completo!', html: html, boton: 'Ver mi resultado', alContinuar: entregar });\n  }\n\n  function entregar() {\n    if (terminado) return;\n    /* Una interacción por palabra del BANCO, todas juntas y en el orden del banco (el de OVA_MAPA):\n       Moodle numera las columnas del informe por orden de llegada, y cada estudiante ve otras palabras.\n       Las que no salieron en su tablero quedan como «neutral». En la práctica no se registra nada. */\n    if (!(window.OVA && OVA.finalizado)) banco.forEach(function (b) {\n      var w = palabras.filter(function (x) { return x.clave === b.clave; })[0];\n      if (!w) { OVA.registrar({ clave: b.clave, tipo: 'fill-in', respuesta: '(no salió en su tablero)', esperada: b.palabra, descripcion: b.pista }); return; }\n      var resp = resueltas[w.clave] ? w.palabra : completa(w).replace(/ /g, '_').replace(/_+$/, '');\n      OVA.registrar({ clave: w.clave, tipo: 'fill-in', respuesta: resp || '(sin responder)', esperada: w.palabra, correcta: !!resueltas[w.clave], descripcion: w.pista });\n    });\n    var total = palabras.length, aciertos = 0, conAyuda = 0;\n    palabras.forEach(function (w) { if (resueltas[w.clave]) { if (conAyudaDe[w.clave]) conAyuda++; else aciertos++; } });\n    var ayudas = Object.keys(vistasAyuda).length + nRevelar;\n    var nota = Math.round(100 * (aciertos + 0.5 * conAyuda) / total);\n    if (aciertos === total) M.medalla('sinayudas');\n    terminado = true;\n    cursor = null; refrescar(); guardar();\n    var mensaje = aciertos === total ? '¡Resolviste todo el crucigrama sin ayudas! Dominas el vocabulario del tema.'\n      : (aciertos + conAyuda === total ? 'Completaste todas las palabras; ' + conAyuda + ' con ayuda o en un segundo intento cuentan la mitad.'\n      : 'Resolviste ' + (aciertos + conAyuda) + ' de ' + total + ' palabras. Repasa las pistas de las que faltaron.');\n    window.__cruNota = nota;\n    M.terminar({ nota: nota, aciertos: aciertos, conAyuda: conAyuda, total: total, ayudas: ayudas, mensaje: mensaje,\n      textoReintentar: 'Practicar otro tablero', alReintentar: function () { nuevoIntento(true); } });\n  }\n\n  function nuevoIntento(esPractica) {\n    palabras = tableroNuevo(); letras = {}; resueltas = {}; reveladas = {}; doradasHalladas = {};\n    if (esPractica) { conAyudaDe = {}; vistasAyuda = {}; premiadas = {}; nRevelar = 0; practica = true; M.restaurar({ p: 0, t: 0, r: 0, m: [] }); M.reanudar(); }\n    terminado = false; confirmarEntrega = false;\n    elegirDoradas(); pintarTablero(); pintarPistas();\n    if (palabras.length) seleccionar(palabras[0]);\n    guardar();\n  }\n  function reiniciar() {\n    if (soloVer) return;\n    if (terminado) { nuevoIntento(true); M.aviso('Tablero nuevo para practicar: tu nota ya quedó registrada.'); return; }\n    nuevoIntento(false);\n    M.aviso('¡Tablero nuevo! Las ayudas que ya usaste siguen contando.');\n  }\n\n  /* ───────────── teclado físico y táctil ───────────── */\n  function hayVentana() { return !!document.querySelector('.ova-modal:not([hidden])'); }\n  document.addEventListener('keydown', function (e) {\n    if (hayVentana() || e.ctrlKey || e.metaKey || e.altKey) return;\n    var t = e.target, tag = t && t.tagName;\n    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;\n    var enTablero = t === gridEl || t === document.body || !t;\n    if (/^[a-zñáéíóúü]$/i.test(e.key)) { e.preventDefault(); escribir(sinTildes(e.key.replace(/ñ/i, '#')).replace('#', 'Ñ')); }\n    else if (e.key === 'Backspace') { e.preventDefault(); borrar(true); }\n    else if (e.key === 'Delete') { e.preventDefault(); borrar(false); }\n    else if (enTablero && /^Arrow/.test(e.key)) {\n      e.preventDefault();\n      if (!cursor) return;\n      var a = cursor.split(',').map(Number), r = a[0], c = a[1];\n      for (var paso = 1; paso <= N; paso++) {\n        var rr = r + (e.key === 'ArrowDown' ? paso : e.key === 'ArrowUp' ? -paso : 0), cc = c + (e.key === 'ArrowRight' ? paso : e.key === 'ArrowLeft' ? -paso : 0);\n        if (rr < 0 || cc < 0 || rr >= N || cc >= N) break;\n        if (celdas[rr + ',' + cc]) {\n          var ws = palabrasEn(rr + ',' + cc), dir = /Left|Right/.test(e.key) ? 'H' : 'V';\n          seleccionar(ws.filter(function (w) { return w.dir === dir; })[0] || ws[0], rr + ',' + cc); break;\n        }\n      }\n    }\n    else if (enTablero && e.key === ' ') { e.preventDefault(); if (cursor) { var b = cursor.split(',').map(Number); tocarCelda(b[0], b[1]); } }\n    else if (t === gridEl && e.key === 'Enter') { e.preventDefault(); siguientePalabra(e.shiftKey ? -1 : 1); }\n  });\n  function siguientePalabra(paso) { if (!palabras.length) return; var i = palabras.indexOf(activa); seleccionar(palabras[(i + paso + palabras.length) % palabras.length]); }\n\n  if (teclado) {\n    [['Q', 'W', 'E', 'R', 'T', 'Y', 'U', 'I', 'O', 'P'], ['A', 'S', 'D', 'F', 'G', 'H', 'J', 'K', 'L', 'Ñ'], ['↹', 'Z', 'X', 'C', 'V', 'B', 'N', 'M', '⌫']].forEach(function (fila) {\n      var f = el('div', 'fila-teclado');\n      fila.forEach(function (k) {\n        var b = el('button', 'tecla' + (k === '↹' || k === '⌫' ? ' accion' : ''), k); b.type = 'button';\n        b.setAttribute('aria-label', k === '↹' ? 'Siguiente palabra' : k === '⌫' ? 'Borrar' : 'Letra ' + k);\n        b.addEventListener('click', function (e) { e.preventDefault(); if (k === '⌫') borrar(true); else if (k === '↹') siguientePalabra(1); else escribir(k); });\n        f.appendChild(b);\n      });\n      teclado.appendChild(f);\n    });\n  }\n  var bMovAyuda = $('btn-movil-ayuda');\n  if (bMovAyuda) bMovAyuda.addEventListener('click', function () { if (activa) verAyuda(activa); });\n\n  /* ───────────── arranque ───────────── */\n  if (!restaurar(M.sesion.estado)) palabras = tableroNuevo();\n  elegirDoradas(); pintarTablero(); pintarPistas();\n  if (soloVer || modo === 'repaso') {\n    ['btn-comprobar', 'btn-revelar', 'btn-limpiar', 'btn-reiniciar'].forEach(function (id) { if ($(id)) $(id).disabled = true; });\n    if (teclado) teclado.hidden = true;\n  }\n  if (palabras.length) seleccionar(palabras.filter(function (w) { return !resueltas[w.clave]; })[0] || palabras[0]);\n  if (terminado) { cursor = null; refrescar(); }\n  else if (modo === 'normal' && palabras.length && palabras.every(function (w) { return resueltas[w.clave]; }) && !OVA.finalizado)\n    M.aviso('Ya resolviste todas las palabras: pulsa «Comprobar» para entregar.');\n  if (!M.sesion.estado && modo === 'normal') guardar();\n  setTimeout(ajustarTamano, 50);\n\n  /* Autoprueba del verificador: escribe cada palabra letra por letra con la misma función que el\n     teclado (sin ayudas), pulsa «Ver mi resultado» en la ventana de cierre como lo haría el\n     estudiante y espera el cierre normal (M.terminar). Devuelve la nota. */\n  window.OVA_AUTOPRUEBA = function () {\n    if (terminado) nuevoIntento(true);\n    palabras.slice().forEach(function (w) {\n      seleccionar(w, w.fila + ',' + w.col);\n      for (var i = 0; i < w.palabra.length; i++) { cursor = celdasDe(w)[i].join(','); escribir(w.palabra[i]); }\n    });\n    return new Promise(function (ok) {\n      var t0 = Date.now();\n      (function esperar() {\n        if (terminado || Date.now() - t0 > 5000) { ok(window.__cruNota); return; }\n        var b = M.retroAbierta() && $('btn-retro-continuar'); if (b) b.click();\n        setTimeout(esperar, 50);\n      })();\n    });\n  };\n})();\n\n<\/script>\n</body></html>\n"}</script>
<script>
(function () {
  var docs = JSON.parse(document.getElementById('ova-niveles').textContent);
  var marco = document.getElementById('ova'), botones = document.querySelectorAll('.selector button');
  function abrir(n) {
    botones.forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.nivel === n)); });
    marco.srcdoc = docs[n];
    try { history.replaceState(null, '', '#' + n); } catch (e) {}
  }
  botones.forEach(function (b) { b.addEventListener('click', function () { abrir(b.dataset.nivel); }); });
  abrir(docs[location.hash.slice(1)] ? location.hash.slice(1) : Object.keys(docs)[0]);
})();
</script>
