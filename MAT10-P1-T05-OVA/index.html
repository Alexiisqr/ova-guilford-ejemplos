<script id="ova-niveles" type="application/json">{"aprendiz":"<!DOCTYPE html>\n<html lang=\"es\">\n<head>\n  <meta charset=\"UTF-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  <title>Clasificación y propiedades de los triángulos; teorema de Pitágoras</title>\n  <style>\n/* =========================================================================\n   Identidad visual — Gimnasio Campestre de Guilford (fuente única del kit)\n   Colores tomados por muestreo del sitio web y del logotipo institucional.\n   Los motores y plantillas usan SOLO estas variables. No copie los valores\n   a otros archivos: si cambia un color, se cambia aquí.\n   ========================================================================= */\n@import url('https://fonts.googleapis.com/css2?family=Bitter:wght@600;700&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap');\n\n:root {\n  --g-verde: #35993a;        /* árbol del logotipo */\n  --g-verde-osc: #005d31;    /* titulares del sitio */\n  --g-verde-tinte: #eaf5eb;\n  --g-verde-borde: #cfe6d1;\n  --g-azul: #394e65;         /* navegación principal */\n  --g-azul-osc: #1f3247;\n  --g-azul-tinte: #eef1f5;\n  --g-dorado: #d3a85f;       /* sello 26 años */\n  --g-dorado-osc: #ba934f;\n  --g-dorado-tinte: #fbf4e7;\n\n  --g-tinta: #23282d;\n  --g-texto: #3d4650;\n  --g-suave: #5f6b76;        /* contraste 5,3:1 sobre blanco */\n  --g-linea: #e2e6ea;\n  --g-fondo: #f4f6f7;\n  --g-papel: #ffffff;\n  --g-ok: #2e7d32;\n  --g-alerta: #8a5300;\n  --g-error: #b3261e;\n\n  /* Acento por nivel: <body data-nivel=\"aprendiz|novato\"> */\n  --nivel: var(--g-verde);\n  --nivel-osc: var(--g-verde-osc);\n  --nivel-tinte: var(--g-verde-tinte);\n\n  --serif: 'Bitter', Georgia, 'Times New Roman', serif;\n  --sans: 'Atkinson Hyperlegible', Verdana, 'Segoe UI', system-ui, sans-serif;\n  --r: 10px;\n  --r-l: 16px;\n  --sombra: 0 1px 2px rgba(35,40,45,.06), 0 4px 14px rgba(35,40,45,.06);\n}\nbody[data-nivel=\"novato\"] { --nivel: var(--g-azul); --nivel-osc: var(--g-azul-osc); --nivel-tinte: var(--g-azul-tinte); }\n\n</style>\n  <style>\n/* Componentes de los OVA de una pantalla (simulador, juego). Requiere guilford.css antes. */\n*, *::before, *::after { box-sizing: border-box; }\nhtml { -webkit-text-size-adjust: 100%; }\nbody {\n  margin: 0; background: var(--g-fondo); color: var(--g-texto);\n  font-family: var(--sans); font-size: 17px; line-height: 1.6;\n  overflow-x: hidden;\n}\nh1, h2, h3 { font-family: var(--serif); color: var(--g-tinta); line-height: 1.25; margin: 0 0 .5em; }\nh1 { font-size: clamp(1.4rem, 4vw, 2rem); }\nh2 { font-size: clamp(1.15rem, 3vw, 1.45rem); }\nh3 { font-size: 1.08rem; }\np { margin: 0 0 1em; }\nimg, svg, canvas { max-width: 100%; height: auto; }\n:focus-visible { outline: 3px solid var(--g-dorado); outline-offset: 2px; border-radius: 4px; }\n.oculto-visual { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }\n\n.ova-franja { padding: 10px 16px; font-size: .92rem; font-weight: 700; text-align: center; }\n.ova-franja-docente { background: var(--g-dorado-tinte); color: #6b4e17; border-bottom: 2px solid var(--g-dorado); }\n.ova-franja-repaso { background: var(--g-azul-tinte); color: var(--g-azul-osc); border-bottom: 2px solid var(--g-azul); }\n\n.ova-cabecera {\n  display: flex; align-items: center; gap: 14px; flex-wrap: wrap;\n  padding: 12px 20px; background: var(--g-papel); border-bottom: 4px solid var(--nivel);\n}\n.ova-cabecera img { height: 44px; width: auto; }\n.ova-cabecera .titulo { flex: 1 1 240px; min-width: 0; }\n.ova-cabecera .titulo h1 { margin: 0; font-size: clamp(1.1rem, 3.2vw, 1.5rem); }\n.ova-cabecera .titulo small { color: var(--g-suave); }\n.ova-nivel {\n  display: inline-block; padding: 3px 12px; border-radius: 999px; font-size: .82rem; font-weight: 700;\n  background: var(--nivel-tinte); color: var(--nivel-osc); border: 1px solid var(--nivel);\n}\n\n.ova-contenedor { max-width: 980px; margin: 0 auto; padding: 20px 16px 48px; }\n.ova-tarjeta { background: var(--g-papel); border-radius: var(--r-l); box-shadow: var(--sombra); padding: 20px; margin-bottom: 18px; }\n.ova-fase { font-size: .78rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--nivel-osc); margin-bottom: 4px; }\n\n.ova-btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px;\n  padding: 10px 20px; border: 0; border-radius: 999px; cursor: pointer;\n  font: 700 1rem var(--sans); background: var(--nivel); color: #fff;\n}\n.ova-btn:hover { background: var(--nivel-osc); }\n.ova-btn[disabled] { opacity: .5; cursor: not-allowed; }\n.ova-btn.secundario { background: var(--g-papel); color: var(--nivel-osc); border: 2px solid var(--nivel); }\n\n.ova-retro { margin-top: 12px; padding: 12px 14px; border-radius: var(--r); border-left: 5px solid; }\n.ova-retro.ok { background: #e8f5e9; border-color: var(--g-ok); color: #1b4d1f; }\n.ova-retro.mal { background: #fdecea; border-color: var(--g-error); color: #7a1a14; }\n.ova-retro.pista { background: var(--g-dorado-tinte); border-color: var(--g-dorado-osc); color: #5c4313; }\n\n.ova-control { display: grid; gap: 4px; margin: 10px 0; }\n.ova-control label { font-weight: 700; color: var(--g-tinta); }\n.ova-control input[type=range] { width: 100%; accent-color: var(--nivel); min-height: 32px; }\n.ova-control input[type=number], .ova-control input[type=text] {\n  font: 1rem var(--sans); padding: 10px 12px; border: 2px solid var(--g-linea); border-radius: var(--r); min-height: 44px; max-width: 220px;\n}\n.ova-dato { font-size: 1.25rem; font-weight: 700; color: var(--g-tinta); }\n.ova-formula { font-family: var(--serif); font-size: 1.15rem; background: var(--g-fondo); padding: 8px 14px; border-radius: var(--r); display: inline-block; }\n\n.ova-rejilla { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 18px; }\n.ova-progreso { height: 10px; background: var(--g-linea); border-radius: 999px; overflow: hidden; }\n.ova-progreso > span { display: block; height: 100%; background: var(--nivel); transition: width .3s; }\n\n.ova-transcripcion summary { cursor: pointer; font-weight: 700; color: var(--nivel-osc); }\n\n</style>\n  <style>\n/* =========================================================================\n   Marco común de los OVA del kit Guilford v3 (todos los tipos, SCORM).\n   Diseño estándar tomado del crucigrama de Laura Alarcón (MAT10-P2-T03, 28-oct-2026):\n   tarjeta 16:9 en escritorio, barra superior con puntos, racha, tiempo y desafíos,\n   ventana de resultado, avisos flotantes y confeti. Requiere guilford.css y ova.css antes.\n   Lo dibuja js/marco.js; el tipo solo pone su actividad dentro de #ova-area.\n   No editar dentro de un OVA: se corrige en _kit/motores/pantalla/ y se vuelve a copiar.\n   ========================================================================= */\n\n:root {\n  /* Aprendiz: verde Guilford */\n  --c-primario: var(--g-verde-osc);\n  --c-primario-luz: var(--g-verde);\n  --c-primario-tinte: var(--g-verde-tinte);\n  --c-primario-borde: #bfe3cc;\n  --c-fondo-general: #f4f7f5;\n  --c-tarjeta-fondo: #ffffff;\n  --c-texto-base: #2d3748;\n  --c-texto-suave: var(--g-suave);\n  --c-linea: #e2e8f0;\n  --c-radio: 12px;\n  --c-sombra: 0 4px 14px rgba(0, 93, 49, 0.08);\n  --c-acierto-fondo: #e8f5e9;\n  --c-acierto-texto: #1b5e20;\n  --c-acierto-borde: #81c784;\n  --c-error-fondo: #ffebee;\n  --c-error-texto: #b71c1c;\n  --c-error-borde: #e57373;\n  /* Acento de logros: el dorado institucional (sello de los 26 años) */\n  --c-oro: #f59e0b;\n  --c-oro-fondo: #fffbeb;\n  --c-oro-borde: #fcd34d;\n  --c-oro-texto: #92400e;\n  --c-fuego: #ef4444;\n  --c-fuego-fondo: #fef2f2;\n  --ui: system-ui, -apple-system, BlinkMacSystemFont, \"Segoe UI\", Roboto, sans-serif;\n}\n/* Novato: azul Guilford */\nbody[data-nivel=\"novato\"] {\n  --c-primario: var(--g-azul-osc);\n  --c-primario-luz: var(--g-azul);\n  --c-primario-tinte: var(--g-azul-tinte);\n  --c-primario-borde: #c7d6e5;\n  --c-fondo-general: #f0f3f6;\n  --c-acierto-fondo: #e3f2fd;\n  --c-acierto-texto: #0d47a1;\n  --c-acierto-borde: #90caf9;\n  --c-sombra: 0 4px 14px rgba(31, 50, 71, 0.08);\n}\n\nbody { background: var(--c-fondo-general); color: var(--c-texto-base); font-family: var(--ui); overflow-x: hidden; }\n\n/* ── Tarjeta principal ─────────────────────────────────────────────── */\n.ova-marco { width: 100%; max-width: 1140px; margin: 0 auto; }\n.ova-tarjeta-marco {\n  position: relative; background: var(--c-tarjeta-fondo); border-radius: var(--c-radio);\n  box-shadow: var(--c-sombra); border: 1px solid var(--c-linea); padding: 10px 14px; max-width: 100%; overflow-x: hidden;\n}\n#ova-area { min-width: 0; }\n\n/* ── Barra superior (HUD + acciones) ───────────────────────────────── */\n.ova-topbar {\n  display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap;\n  background: var(--c-primario-tinte); border: 1px solid var(--c-primario-borde); border-radius: 8px;\n  padding: 4px 10px; margin-bottom: 5px; min-height: 44px; max-width: 100%;\n}\n.topbar-stats { display: flex; align-items: center; flex-wrap: wrap; gap: 7px; font-size: .82rem; font-weight: 700; color: var(--c-primario); }\n.stat-valor { font-size: .95rem; font-weight: 800; }\n.hud-caja {\n  display: inline-flex; align-items: center; gap: 3px; background: #fff; border: 1px solid var(--c-linea);\n  padding: 2px 7px; border-radius: 12px; font-size: .78rem; color: var(--c-texto-suave);\n}\n.hud-etiqueta { font-weight: 700; }\n.hud-puntos { border-color: var(--c-oro-borde); color: var(--c-oro-texto); font-weight: 800; box-shadow: 0 1px 2px rgba(245,158,11,.15); }\n.hud-puntos .num { font-size: .88rem; color: #b45309; }\n.hud-racha { background: var(--c-fuego-fondo); border-color: #fecaca; color: var(--c-fuego); font-weight: 800; animation: racha-pulso 1s infinite alternate; }\n.hud-racha[hidden] { display: none; }\n@keyframes racha-pulso { from { transform: scale(1); } to { transform: scale(1.06); } }\n.hud-desafios { border-color: var(--c-primario-borde); gap: 5px; }\n.desafios-items { display: flex; gap: 4px; }\n\n.medalla-chip {\n  width: 22px; height: 22px; border-radius: 50%; background: #f1f5f9; border: 1px solid #cbd5e1;\n  display: flex; align-items: center; justify-content: center; font-size: .72rem; font-weight: 800; color: #475569;\n  cursor: pointer; padding: 0; font-family: var(--ui); filter: grayscale(1); opacity: .55; transition: all .25s;\n}\nbutton.medalla-chip:hover { opacity: .85; filter: none; }\n.medalla-chip.desbloqueada {\n  filter: none; opacity: 1; background: var(--c-oro-fondo); border-color: var(--c-oro); color: var(--c-oro-texto);\n  box-shadow: 0 0 6px rgba(245,158,11,.5); animation: medalla-pop .4s cubic-bezier(.175,.885,.32,1.275);\n}\n@keyframes medalla-pop { 0% { transform: scale(.6); } 60% { transform: scale(1.35); } 100% { transform: scale(1); } }\n\n.topbar-acciones { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }\n.btn-accion {\n  display: inline-flex; align-items: center; justify-content: center; gap: 3px; min-height: 32px; padding: 4px 10px;\n  border-radius: 16px; font: 700 .78rem var(--ui); border: 1px solid var(--c-primario-borde);\n  background: var(--c-tarjeta-fondo); color: var(--c-primario); cursor: pointer; box-shadow: 0 1px 2px rgba(0,0,0,.05);\n  transition: all .12s; white-space: nowrap;\n}\n.btn-accion:hover { background: var(--c-primario-tinte); }\n.btn-accion.primario { background: var(--c-primario); color: #fff; border-color: var(--c-primario); }\n.btn-accion.primario:hover { background: var(--c-primario-luz); }\n.btn-accion[disabled] { opacity: .5; cursor: not-allowed; }\n.btn-accion[aria-pressed=\"false\"] { color: var(--c-texto-suave); }\n\n.ova-tarjeta-marco .ova-progreso { height: 4px; background: var(--c-primario-tinte); border-radius: 2px; overflow: hidden; margin-bottom: 8px; }\n.ova-tarjeta-marco .ova-progreso > span { display: block; height: 100%; width: 0; background: var(--c-primario-luz); transition: width .3s; }\n\n/* ── Piezas que comparten los tipos ────────────────────────────────── */\n.ova-panel { background: var(--c-primario-tinte); border: 1px solid var(--c-primario-borde); border-radius: 10px; padding: 10px 12px; }\n.ova-panel h3, .ova-seccion-titulo {\n  font: 800 .82rem var(--ui); text-transform: uppercase; letter-spacing: .4px; color: var(--c-primario);\n  margin: 0 0 8px; padding-bottom: 4px; border-bottom: 2px solid var(--c-primario-borde);\n}\n.ova-item {\n  background: #fff; border: 1px solid var(--c-linea); border-radius: 8px; padding: 8px 10px; margin-bottom: 6px;\n  transition: border-color .15s, box-shadow .15s;\n}\n.ova-item.activa { border-color: var(--c-primario-luz); box-shadow: 0 0 0 2px var(--c-primario-borde); background: var(--c-primario-tinte); }\n.ova-item.resuelta { background: var(--c-acierto-fondo); border-color: var(--c-acierto-borde); }\n.ova-etiqueta-chip { display: inline-block; font-size: .72rem; color: var(--c-texto-suave); background: #f1f5f9; border-radius: 6px; padding: 1px 6px; }\n.btn-ayuda {\n  display: inline-block; margin-top: 4px; padding: 1px 8px; border-radius: 999px; font: 700 .72rem var(--ui); cursor: pointer;\n  background: var(--c-oro-fondo); border: 1px solid var(--c-oro-borde); color: var(--c-oro-texto);\n}\n.btn-ayuda:hover { background: #fef3c7; }\n\n/* Opciones de respuesta (presentación, video, juego accesible, simulador) */\n.ova-opciones { display: grid; gap: 8px; margin: 10px 0; }\n.ova-opcion {\n  display: flex; align-items: center; gap: 10px; width: 100%; min-height: 44px; padding: 10px 12px; text-align: left;\n  background: #fff; border: 2px solid var(--c-linea); border-radius: 10px; font: 600 .95rem var(--ui); color: var(--c-texto-base); cursor: pointer;\n}\n.ova-opcion:hover { border-color: var(--c-primario-borde); background: var(--c-primario-tinte); }\n.ova-opcion .letra {\n  flex: 0 0 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center;\n  background: var(--c-primario-tinte); color: var(--c-primario); font-weight: 800;\n}\n.ova-opcion.correcta { border-color: var(--c-acierto-borde); background: var(--c-acierto-fondo); color: var(--c-acierto-texto); }\n.ova-opcion.incorrecta { border-color: var(--c-error-borde); background: var(--c-error-fondo); color: var(--c-error-texto); }\n.ova-opcion[disabled] { cursor: default; }\n\n/* ── Aviso flotante ────────────────────────────────────────────────── */\n.ova-toast {\n  position: absolute; top: 58px; left: 50%;   /* debajo de la barra superior: no tapa puntos ni tiempo */ transform: translateX(-50%); max-width: calc(100% - 24px);\n  background: #1f2937; color: #fff; padding: 8px 16px; border-radius: 24px; font-size: .82rem; font-weight: 700;\n  box-shadow: 0 8px 24px rgba(0,0,0,.25); border: 1px solid #374151; z-index: 100; pointer-events: none;\n  transition: all .3s cubic-bezier(.175,.885,.32,1.275); text-align: center;\n}\n.ova-toast.dorado { background: linear-gradient(135deg, #78350f, #b45309); border-color: var(--c-oro); }\n.ova-toast.oculto { opacity: 0; transform: translateX(-50%) translateY(-15px); }\n\n.ova-confeti { position: fixed; inset: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 9998; }\n\n/* ── Ventanas (resultado, ayuda, respuestas del docente) ───────────── */\n.ova-modal {\n  position: fixed; inset: 0; background: rgba(0,0,0,.65); backdrop-filter: blur(4px); z-index: 10000;\n  display: flex; align-items: center; justify-content: center; padding: 16px;\n}\n.ova-modal[hidden] { display: none; }\n.ova-modal-caja {\n  background: var(--c-tarjeta-fondo); border-radius: 16px; box-shadow: 0 14px 40px rgba(0,0,0,.3); padding: 24px 22px;\n  max-width: 440px; width: 100%; max-height: calc(100vh - 32px); overflow-y: auto; text-align: center;\n  animation: modal-entra .35s cubic-bezier(.175,.885,.32,1.275);\n}\n.ova-modal-caja.ancha { max-width: 760px; text-align: left; }\n@keyframes modal-entra { from { transform: scale(.85); opacity: 0; } to { transform: scale(1); opacity: 1; } }\n.modal-titulo { font: 700 1.3rem var(--serif); color: var(--c-primario); margin: 0 0 6px; }\n.modal-puntaje { margin: 4px 0 12px; color: var(--c-primario); }\n.modal-puntaje .numero { font-size: 2.6rem; font-weight: 800; }\n.modal-puntaje .maximo { font-size: 1.1rem; color: var(--c-texto-suave); font-weight: 700; }\n.modal-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 14px; }\n.modal-stat { background: var(--c-fondo-general); border: 1px solid var(--c-linea); border-radius: 8px; padding: 8px 6px; }\n.modal-stat small { display: block; font-size: .68rem; color: var(--c-texto-suave); text-transform: uppercase; font-weight: 700; }\n.modal-stat span { font-size: 1.15rem; font-weight: 800; color: var(--c-primario); }\n.modal-record { font-size: .8rem; color: #b45309; font-weight: 700; margin-bottom: 10px; }\n.modal-mensaje { margin: 0 0 10px; }\n.modal-sello {\n  display: inline-block; background: #e8f5e9; color: #2e7d32; font-size: .76rem; font-weight: 700;\n  padding: 3px 10px; border-radius: 999px; margin-bottom: 14px; border: 1px solid #a5d6a7;\n}\n.modal-sello.neutro { background: #f1f5f9; color: #475569; border-color: #cbd5e1; }\n.modal-acciones { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }\n.modal-ayuda-caja { background: var(--c-oro-fondo); border-left: 4px solid var(--c-oro); border-radius: 6px; padding: 10px 12px; margin-bottom: 14px; text-align: left; }\n.modal-ayuda-caja p { margin: 0; font-size: .9rem; color: #78350f; line-height: 1.45; }\n.tabla-respuestas { width: 100%; border-collapse: collapse; font-size: .85rem; margin-bottom: 14px; }\n.tabla-respuestas th { background: var(--c-primario); color: #fff; text-align: left; padding: 6px 8px; }\n.tabla-respuestas td { border-bottom: 1px solid var(--c-linea); padding: 6px 8px; vertical-align: top; }\n.tabla-respuestas code { font-size: .75rem; color: var(--c-texto-suave); }\n\n/* Retroalimentación al frente (M.retro): nunca dentro de la actividad */\n.ova-modal-caja.retro { border-top: 6px solid var(--c-linea); }\n.ova-modal-caja.retro.ok { border-top-color: var(--c-acierto-borde); }\n.ova-modal-caja.retro.mal { border-top-color: var(--c-error-borde); }\n.retro-icono { width: 48px; height: 48px; margin: 0 auto 6px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font: 800 1.5rem var(--ui); background: #f1f5f9; color: #475569; }\n.retro.ok .retro-icono { background: var(--c-acierto-fondo); color: var(--c-acierto-texto); }\n.retro.mal .retro-icono { background: var(--c-error-fondo); color: var(--c-error-texto); }\n.retro.ok .modal-titulo { color: var(--c-acierto-texto); }\n.retro.mal .modal-titulo { color: var(--c-error-texto); }\n.modal-retro-texto { text-align: left; font-size: .95rem; line-height: 1.5; margin: 0 0 14px; }\n.modal-retro-texto p { margin: 0 0 .6em; }\n.modal-retro-texto em { color: var(--c-oro-texto); }\n\n/* Panel de desafíos (se abre tocando las medallas) */\n.lista-desafios { list-style: none; margin: 0 0 14px; padding: 0; display: grid; gap: 8px; }\n.desafio-fila { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border: 1px solid var(--c-linea); border-radius: 10px; }\n.desafio-fila.logrado { background: var(--c-oro-fondo); border-color: var(--c-oro-borde); }\n.desafio-fila .medalla-chip { flex: 0 0 30px; width: 30px; height: 30px; cursor: default; }\n.desafio-texto { flex: 1; display: grid; gap: 2px; font-size: .88rem; }\n.desafio-premio { font-weight: 800; color: var(--c-oro-texto); white-space: nowrap; font-size: .85rem; }\n.modal-desafios-logrados { font-size: .85rem; font-weight: 700; color: var(--c-oro-texto); margin-bottom: 6px; }\n\n/* ── Escritorio: tarjeta panorámica 16:9 sin desplazamiento ────────── */\n@media (min-width: 820px) {\n  .ova-cabecera { padding: 6px 18px; margin-bottom: 6px; }\n  .ova-cabecera img { height: 30px; }\n  .ova-cabecera .titulo h1 { font-size: 1.05rem; margin: 0; }\n  .ova-cabecera .titulo small { font-size: .72rem; }\n  .ova-cabecera .ova-nivel { padding: 3px 10px; font-size: .76rem; }\n  .ova-contenedor { padding: 4px 14px 10px; max-width: 1080px; }\n  .ova-tarjeta-marco.panoramica { aspect-ratio: 16 / 9; height: 590px; max-height: 590px; display: flex; flex-direction: column; overflow: hidden; }\n  .ova-tarjeta-marco.panoramica #ova-area { flex: 1; min-height: 0; overflow: hidden; }\n  .ova-topbar { flex-wrap: nowrap; }\n}\n\n/* ── Celular: todo en una columna, cero desbordamiento a 360 px ────── */\n@media (max-width: 819px) {\n  .ova-contenedor { padding: 6px 4px 24px; max-width: 100%; }\n  .ova-tarjeta-marco { padding: 8px 6px; }\n  /* Rejilla de una columna + botones en flex: con grid auto-fit dentro de un flex en columna, Chromium\n     calculaba la fila de botones como si fueran apilados (172 px de hueco; lo midieron 4 motores). */\n  .ova-topbar { display: grid; grid-template-columns: minmax(0, 1fr); gap: 6px; padding: 6px 8px; }\n  .topbar-stats { justify-content: space-between; gap: 4px; font-size: .74rem; }\n  .topbar-acciones { display: flex; flex-wrap: wrap; gap: 4px; width: 100%; }\n  .btn-accion { flex: 1 1 72px; min-height: 40px; padding: 6px 2px; font-size: .74rem; border-radius: 6px; white-space: normal; }\n  .modal-stats { gap: 6px; }\n  .hud-desafios .medalla-chip { width: 28px; height: 28px; }\n  .ova-toast { position: fixed; top: 12px; }   /* visible aunque la página esté desplazada */\n}\n\n</style>\n  <style>\n/* =========================================================================\n   Arrastrar, clasificar y relacionar (ARR) · kit Guilford v3.\n   Solo la actividad: cabecera, barra de puntos, resultado y avisos los pone el marco (marco.css).\n   Usa los tokens del marco: --c-primario*, --c-acierto-*, --c-error-*, --c-oro* (solo ayudas).\n   No editar dentro de un OVA: se corrige en _kit/motores/arrastrar/.\n   ========================================================================= */\n\n.arr-raiz { display: flex; flex-direction: column; gap: 6px; min-height: 0; height: 100%; font-family: var(--ui); }\n\n/* Pasos (actividades) */\n.arr-pasos { display: flex; gap: 6px; flex-wrap: wrap; }\n.arr-paso {\n  display: inline-flex; align-items: center; gap: 6px; min-height: 34px; padding: 3px 12px 3px 4px;\n  border-radius: 999px; border: 1px solid var(--c-linea); background: #fff; color: var(--c-texto-suave);\n  font: 700 .78rem var(--ui); cursor: pointer;\n}\n.arr-paso-num {\n  width: 24px; height: 24px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center;\n  background: #f1f5f9; color: #475569; font-weight: 800; font-size: .75rem;\n}\n.arr-paso.actual { border-color: var(--c-primario); color: var(--c-primario); box-shadow: 0 0 0 2px var(--c-primario-borde); }\n.arr-paso.actual .arr-paso-num { background: var(--c-primario); color: #fff; }\n.arr-paso.hecha .arr-paso-num { background: var(--c-acierto-fondo); color: var(--c-acierto-texto); border: 1px solid var(--c-acierto-borde); }\n.arr-paso[disabled] { opacity: .5; cursor: not-allowed; }\n\n/* Cabeza de la actividad */\n.arr-cabeza { display: flex; gap: 12px; align-items: flex-start; }\n.arr-cabeza-texto { flex: 1; min-width: 0; }\n.arr-reto {\n  margin: 0 0 4px; font-size: .84rem; color: var(--c-primario); background: var(--c-primario-tinte);\n  border-left: 4px solid var(--c-primario-luz); border-radius: 6px; padding: 4px 10px; line-height: 1.4;\n}\n.arr-titulo { font: 700 1.02rem var(--serif); color: var(--c-primario); margin: 0 0 2px; outline: none; }\n.arr-consigna { margin: 0; font-size: .9rem; line-height: 1.4; color: var(--c-texto-base); }\n.arr-ayuda-uso { margin: 2px 0 0; font-size: .74rem; color: var(--c-texto-suave); }\n.arr-apoyo { margin: 0; flex: 0 0 auto; max-width: 210px; text-align: center; }\n.arr-apoyo img { display: block; width: 190px; max-width: 100%; height: auto; max-height: 140px; object-fit: contain; margin: 0 auto; border-radius: 8px; border: 1px solid var(--c-linea); background: #fff; }\n.arr-apoyo figcaption { font-size: .72rem; color: var(--c-texto-suave); line-height: 1.3; margin-top: 2px; }\n\n/* Cuerpo según el modo */\n.arr-cuerpo { flex: 1; min-height: 0; display: grid; gap: 10px; align-content: start; overflow-y: auto; padding: 9px 4px 2px; }\n.arr-modo-emparejar, .arr-modo-ordenar { grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); }\n.arr-modo-clasificar, .arr-modo-completar { grid-template-columns: minmax(0, 1fr); }\n\n/* Banco */\n.arr-banco {\n  background: var(--c-primario-tinte); border: 1px solid var(--c-primario-borde); border-radius: 10px; padding: 6px 10px 8px;\n  align-self: start;\n}\n.arr-banco .ova-seccion-titulo, .arr-grupo .ova-seccion-titulo { margin-bottom: 6px; font-size: .76rem; }\n.arr-banco-fichas { display: flex; flex-wrap: wrap; gap: 6px; min-height: 44px; }\n.arr-modo-emparejar .arr-banco-fichas, .arr-modo-ordenar .arr-banco-fichas { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 170px), 1fr)); }\n.arr-modo-emparejar .arr-banco-fichas .arr-ficha, .arr-modo-ordenar .arr-banco-fichas .arr-ficha { width: 100%; }\n.arr-vacio-banco { margin: 0; font-size: .8rem; color: var(--c-texto-suave); align-self: center; }\n\n/* Fichas (lo que se arrastra o se toca) */\n.arr-ficha {\n  position: relative; display: inline-flex; align-items: center; gap: 6px; min-height: 44px; max-width: 100%;\n  padding: 7px 12px; border-radius: 8px; border: 2px solid var(--c-primario-borde); background: #fff;\n  font: 600 .88rem/1.3 var(--ui); color: var(--c-texto-base); text-align: left; cursor: grab;\n  box-shadow: 0 1px 2px rgba(0,0,0,.06); touch-action: none; user-select: none; -webkit-user-select: none;\n  overflow-wrap: anywhere; transition: border-color .12s, box-shadow .12s, transform .12s;\n}\n.arr-ficha:hover:not([disabled]) { border-color: var(--c-primario-luz); }\n.arr-ficha.sel { border-color: var(--c-primario); background: var(--c-primario-tinte); box-shadow: 0 0 0 3px var(--c-primario-borde); transform: translateY(-1px); }\n.arr-ficha.mal { border-color: var(--c-error-borde); background: var(--c-error-fondo); color: var(--c-error-texto); animation: arr-sacudir .35s; }\n.arr-ficha.bien { border-color: var(--c-acierto-borde); background: var(--c-acierto-fondo); color: var(--c-acierto-texto); cursor: default; }\n.arr-ficha.revelada { border-style: dashed; border-color: var(--c-error-borde); background: #fff; color: var(--c-texto-base); cursor: default; }\n.arr-ficha.sobrante { opacity: .55; text-decoration: line-through; cursor: default; }\n.arr-ficha.solucion { border-style: dashed; border-color: var(--c-primario-luz); background: var(--c-primario-tinte); color: var(--c-primario); cursor: default; }\n.arr-ficha[disabled] { opacity: 1; }\n.arr-ficha.arrastrando { opacity: .35; }\n.arr-ficha img { width: 56px; height: 56px; object-fit: contain; flex: 0 0 auto; pointer-events: none; }\n.arr-ficha.con-img { padding: 4px 10px 4px 4px; }\n/* Marca de bien / solución: en la esquina, fuera del flujo, para que la tarjeta no cambie de alto ni de ancho. */\n.arr-marca {\n  position: absolute; top: -9px; right: 6px; padding: 0 6px; border-radius: 999px; line-height: 16px;\n  font-size: .62rem; font-weight: 800; text-transform: uppercase; letter-spacing: .3px; pointer-events: none;\n  background: var(--c-acierto-borde); color: #fff;\n}\n.arr-ficha.revelada .arr-marca { background: var(--c-error-borde); color: #fff; }\n.arr-fantasma {\n  position: fixed; left: 0; top: 0; z-index: 9000; pointer-events: none; margin: 0; cursor: grabbing;\n  box-shadow: 0 10px 24px rgba(0,0,0,.22); border-color: var(--c-primario); background: #fff; opacity: .95;\n}\n@keyframes arr-sacudir { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }\n\n/* Destinos */\n[data-d][role=button] { cursor: pointer; }\n[data-d][role=button]:focus-visible { outline: 3px solid var(--c-primario-luz); outline-offset: 2px; }\n.encima { outline: 3px dashed var(--c-primario-luz) !important; outline-offset: 2px; background: var(--c-primario-tinte) !important; }\n\n/* Clasificar: grupos */\n.arr-grupos { display: grid; gap: 8px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 180px), 1fr)); }\n.arr-grupo {\n  background: #fff; border: 2px dashed var(--c-primario-borde); border-radius: 10px; padding: 6px 8px 8px; min-height: 120px;\n  display: flex; flex-direction: column;\n}\n.arr-grupo-desc { margin: -2px 0 6px; font-size: .74rem; color: var(--c-texto-suave); line-height: 1.3; }\n.arr-grupo-fichas { display: flex; flex-direction: column; gap: 9px; flex: 1; padding-top: 4px; }\n.arr-grupo-fichas .arr-ficha { width: 100%; }\n\n/* Emparejar y ordenar: filas con su lugar */\n.arr-filas, .arr-secuencia { display: flex; flex-direction: column; gap: 6px; margin: 0; padding: 0; list-style: none; }\n.arr-fila { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.3fr); gap: 8px; align-items: stretch; }\n.arr-secuencia .arr-fila { grid-template-columns: 34px minmax(0, 1fr); }\n.arr-concepto {\n  display: flex; align-items: center; padding: 6px 10px; border-radius: 8px; background: var(--c-primario); color: #fff;\n  font: 700 .88rem/1.3 var(--ui); overflow-wrap: anywhere; min-height: 44px;\n}\n.arr-num {\n  display: flex; align-items: center; justify-content: center; border-radius: 50%; width: 34px; height: 34px; align-self: center;\n  background: var(--c-primario); color: #fff; font-weight: 800;\n}\n.arr-hueco {\n  display: flex; align-items: center; min-height: 48px; padding: 2px; border-radius: 9px;\n  border: 2px dashed var(--c-primario-borde); background: #fff;\n}\n.arr-hueco.lleno { border-style: solid; border-color: transparent; background: transparent; }\n.arr-hueco .arr-ficha { width: 100%; }\n.arr-vacio { font-size: .76rem; color: var(--c-texto-suave); padding: 0 10px; white-space: pre; }\n\n/* Completar: huecos dentro del texto */\n.arr-texto { background: #fff; border: 1px solid var(--c-linea); border-radius: 10px; padding: 8px 12px; }\n.arr-renglon { margin: 0 0 6px; font-size: .95rem; line-height: 2.6; }\n.arr-renglon:last-child { margin-bottom: 0; }\n.arr-hueco.en-linea { display: inline-flex; vertical-align: middle; min-width: 100px; min-height: 44px; margin: 2px 2px; line-height: 1.3; }\n.arr-hueco.en-linea .arr-ficha { width: auto; }\n.arr-hueco.en-linea.lleno { min-width: 0; padding: 0; }\n\n/* Pie: solo navegación (la retroalimentación sale en la ventana del marco, M.retro) */\n.arr-pie { display: flex; align-items: center; justify-content: flex-end; gap: 6px; flex-wrap: wrap; }\n.arr-pie .ova-btn { min-height: 40px; padding: 6px 16px; font-size: .9rem; }\n.arr-pie .ova-btn[disabled] { opacity: .45; cursor: not-allowed; box-shadow: none; }\n/* Dentro de la ventana de retroalimentación */\n.modal-retro-texto ul { margin: 0 0 .6em; padding-left: 20px; }\n.modal-retro-texto li { margin-bottom: 4px; }\n.modal-retro-texto small { color: var(--c-texto-suave); }\n.modal-retro-texto details { margin: 0 0 .6em; }\n.modal-retro-texto summary { cursor: pointer; font-weight: 700; color: var(--c-primario); min-height: 32px; display: list-item; }\n.arr-errores ul { margin: 6px 0 0; padding-left: 20px; }\n.lectura .arr-ficha, .viendo-solucion .arr-ficha { cursor: default; }\n\n/* Celular: todo en una columna, los grupos se apilan */\n@media (max-width: 819px) {\n  .arr-cabeza { flex-direction: column; }\n  .arr-apoyo { max-width: 100%; align-self: center; }\n  .arr-modo-emparejar, .arr-modo-ordenar { grid-template-columns: minmax(0, 1fr); }\n  .arr-modo-emparejar .arr-banco, .arr-modo-ordenar .arr-banco { order: -1; }\n  .arr-fila { grid-template-columns: minmax(0, 1fr); gap: 3px; }\n  .arr-secuencia .arr-fila { grid-template-columns: 34px minmax(0, 1fr); }\n  .arr-grupos { grid-template-columns: minmax(0, 1fr); }\n  .arr-grupo { min-height: 80px; }\n  .arr-ficha { font-size: .86rem; }\n  .arr-renglon { font-size: .92rem; }\n  .arr-paso-nombre { font-size: .72rem; }\n  .arr-paso { padding-right: 8px; min-height: 40px; }\n}\n@media (prefers-reduced-motion: reduce) { .arr-ficha { transition: none; animation: none !important; } }\n\n</style>\n</head>\n<body data-nivel=\"aprendiz\">\n  <\u0021-- El marco (js/marco.js) pone la cabecera, la barra de puntos y las ventanas.\n       El motor (js/app.js) dibuja aquí las actividades que están en js/datos.js. -->\n  <main id=\"ova-area\">\n    <noscript>Este OVA necesita JavaScript activado.</noscript>\n  </main>\n  <script>window.OVA_DEMO = true;<\/script>\n<script>\n/*\n * ova-scorm.js — Envoltorio SCORM 1.2 de los OVA del kit Guilford (v3: todos los tipos son SCORM).\n * Herramienta preexistente del contratista (Anexo E, literal a). No editar dentro de un OVA:\n * se corrige en _kit/motores/pantalla/ y se vuelve a copiar.\n *\n * Lo que el autor usa (nada más):\n *\n *   const sesion = OVA.iniciar('id-del-ova', { sigla: 'CRU' });   // { modo, estado }\n *      modo: 'normal'  → estudiante, escribe en Moodle\n *            'repaso'  → estudiante que reabre un intento cerrado: ve lo suyo, no escribe\n *            'docente' → vista previa del docente: TODO abierto, no escribe\n *            'local'   → sin Moodle (vista local o página pública): no escribe\n *      estado: lo último que se guardó con OVA.guardar(), o null\n *   OVA.guardar(estado)          // objeto pequeño (cabe en 4000 caracteres con margen)\n *   OVA.registrar({ clave, tipo, respuesta, esperada, correcta, descripcion })\n *   OVA.finalizar(puntaje, resumen)   // 0 a 100; ÚNICO momento en que se envía la nota (una vez por intento)\n *   OVA.soloLectura              // true en repaso, docente y local\n *   OVA.finalizado               // true cuando la nota de este intento ya quedó enviada\n *\n * MAPEO PARA EL DOCENTE (lo que se ve en Moodle → Informes del SCORM):\n *  - Interacciones: el id es  SIGLA_clave  (por ejemplo CRU_periodo, SOP_amplitud, ARR_03_clasificar).\n *    La «clave» la da el motor del tipo y es ESTABLE: no cambia de un estudiante a otro aunque el\n *    orden o la posición sean aleatorios. Así la columna del informe siempre es la misma pregunta.\n *    El enunciado va una sola vez en cmi.comments como «[SIGLA_clave] enunciado».\n *  - Resumen como interacciones (Informes → Interacciones y su CSV), solo al finalizar:\n *      RES_nota_0a100 · RES_aciertos_sin_ayuda · RES_aciertos_con_ayuda · RES_preguntas_total · RES_ayudas_usadas · RES_desafios_logrados · RES_minutos\n *  - Lo mismo como objetivos (Informes → Objetivos; en Moodle 4.5.14 ese informe no pinta las celdas,\n *    pero se ven en el seguimiento del intento), con nombre propio:\n *      Nota_0a100 · Aciertos_sin_ayuda · Aciertos_con_ayuda · Preguntas_total · Ayudas_usadas · Minutos\n *    (los que el motor no informe no se escriben).\n *  - cmi.comments termina con una línea  [RESUMEN] Nota 75/100 · 6 de 8 sin ayuda · 2 ayudas · 4 min 12 s\n *  - Tiempo: cmi.core.session_time en cada guardado y al salir (Moodle lo suma en «Tiempo total»).\n *\n * Reglas de Moodle que este archivo cumple (verificadas en Moodle 4.5 real, 8-sep-2026 y 13-oct-2026):\n *  1. cmi.core.score.raw solo se escribe en finalizar(). Con la nota escrita y el intento\n *     incompleto, Moodle da el intento por terminado y el estudiante ya no puede reanudar.\n *  2. El docente se detecta SOLO con lesson_mode == \"browse\". «credit» no sirve: Moodle manda\n *     no-credit también al estudiante que reabre su intento.\n *  3. En «review» Moodle acepta escrituras; la guarda de solo lectura está aquí, no en Moodle.\n *  4. La numeración de interacciones parte del mayor entre _count y lo guardado, para que un\n *     intento reanudado no escriba encima de las respuestas anteriores.\n *  5. cmi.comments se AÑADE (Moodle concatena): se escribe solo la línea nueva, nunca el texto completo.\n *  6. Las puntuaciones de objetivos van de 0 a 100 (Moodle rechaza otro rango).\n */\n(function () {\n  'use strict';\n\n  var api = null, modo = 'local', iniciado = false, terminado = false;\n  var inicio = Date.now(), nInteraccion = 0, estadoActual = null, ultimaRespuesta = Date.now();\n  var LIMITE_SUSPEND = 4000;\n  var comentados = {};\n\n  function buscarAPI(w) {\n    var saltos = 0;\n    while (w && saltos < 12) {\n      try { if (w.API) return w.API; } catch (e) { return null; }\n      if (w.parent === w) break;\n      w = w.parent; saltos++;\n    }\n    return null;\n  }\n  function encontrarAPI() {\n    var a = buscarAPI(window);\n    if (!a && window.opener) a = buscarAPI(window.opener);\n    return a;\n  }\n  function leer(k) { try { return api ? String(api.LMSGetValue(k)) : ''; } catch (e) { return ''; } }\n  function escribir(k, v) {\n    if (!api || OVA.soloLectura) return false;\n    try { return String(api.LMSSetValue(k, String(v))) === 'true'; } catch (e) { return false; }\n  }\n  function confirmar() { if (api && !OVA.soloLectura) try { api.LMSCommit(''); } catch (e) {} }\n\n  function tiempoScorm(ms) {\n    var s = Math.max(0, Math.round(ms / 1000));\n    var h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), x = s % 60;\n    function d(n) { return (n < 10 ? '0' : '') + n; }\n    return (h < 1000 ? d(h) : '9999') + ':' + d(m) + ':' + d(x);\n  }\n  function limpiar(v, max) { return String(v == null ? '' : v).replace(/[\\r\\n]+/g, ' ').slice(0, max || 255); }\n  /* Clave legible y estable: sin tildes, minúsculas, solo letras, números y guion bajo. */\n  function slug(t, max) {\n    return String(t == null ? '' : t).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase()\n      .replace(/ñ/g, 'n').replace(/[^a-z0-9]+/g, '_').replace(/^_+|_+$/g, '').slice(0, max || 40) || 'x';\n  }\n  function idLegible(clave) {\n    var s = OVA.sigla ? OVA.sigla + '_' : '';\n    return (s + slug(clave, 60)).slice(0, 255);\n  }\n  function comentar(etiqueta, texto) {\n    if (comentados[etiqueta]) return;\n    var previo = leer('cmi.comments');\n    if (previo.indexOf('[' + etiqueta + ']') >= 0) { comentados[etiqueta] = true; return; }\n    var linea = '[' + etiqueta + '] ' + limpiar(texto, 200);\n    if ((previo + linea).length >= 4000) return;\n    if (escribir('cmi.comments', previo ? ' | ' + linea : linea)) comentados[etiqueta] = true;\n  }\n  function minSeg(s) { s = Math.round(s); return Math.floor(s / 60) + ' min ' + (s % 60) + ' s'; }\n\n  function franja(texto, clase) {\n    var pintar = function () {\n      if (document.getElementById('ova-franja')) return;\n      var d = document.createElement('div');\n      d.id = 'ova-franja'; d.className = 'ova-franja ' + clase; d.setAttribute('role', 'status');\n      d.textContent = texto;\n      document.body.insertBefore(d, document.body.firstChild);\n    };\n    if (document.body) pintar(); else document.addEventListener('DOMContentLoaded', pintar);\n  }\n\n  var OVA = {\n    modo: 'local',\n    soloLectura: true,\n    finalizado: false,\n    sigla: '',\n    alumno: '',\n    slug: slug,\n    idLegible: idLegible,\n\n    iniciar: function (id, opciones) {\n      if (iniciado) return { modo: modo, estado: estadoActual };\n      iniciado = true;\n      opciones = opciones || {};\n      OVA.id = id || 'ova';\n      OVA.sigla = String(opciones.sigla || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 6);\n      api = encontrarAPI();\n      if (api) {\n        try { api.LMSInitialize(''); } catch (e) {}\n        var lm = leer('cmi.core.lesson_mode');\n        modo = lm === 'browse' ? 'docente' : lm === 'review' ? 'repaso' : 'normal';\n        OVA.alumno = leer('cmi.core.student_id');\n      } else {\n        modo = 'local';\n      }\n      OVA.modo = modo;\n      OVA.soloLectura = modo !== 'normal';\n      OVA.estadoInicial = null;\n\n      // Estado guardado: se lee en normal y en repaso (el estudiante ve lo suyo). El docente parte limpio.\n      if (api && modo !== 'docente') {\n        var bruto = leer('cmi.suspend_data');\n        if (bruto) {\n          try {\n            var paquete = JSON.parse(bruto);\n            estadoActual = paquete.e || null;\n            nInteraccion = paquete.n || 0;\n            OVA.finalizado = !!paquete.f;\n          } catch (e) { estadoActual = null; }\n        }\n      }\n      var cuenta = parseInt(leer('cmi.interactions._count'), 10);\n      if (!isNaN(cuenta)) nInteraccion = Math.max(nInteraccion, cuenta);\n      if (modo === 'normal' && leer('cmi.core.lesson_status') === 'completed') OVA.finalizado = true;\n\n      OVA.estadoInicial = estadoActual;\n      if (modo === 'normal') {\n        var st = leer('cmi.core.lesson_status');\n        if (!st || st === 'not attempted') escribir('cmi.core.lesson_status', 'incomplete');\n        confirmar();\n      }\n      if (modo === 'docente') franja('Vista docente: todo el contenido está abierto y nada se registra.', 'ova-franja-docente');\n      if (modo === 'repaso') franja('Estás repasando un intento terminado: puedes mirarlo, pero no se guardan cambios.', 'ova-franja-repaso');\n\n      window.addEventListener('pagehide', OVA.salir);\n      window.addEventListener('beforeunload', OVA.salir);\n      return { modo: modo, estado: estadoActual };\n    },\n\n    guardar: function (estado, ubicacion) {\n      estadoActual = estado;\n      if (OVA.soloLectura) return;\n      var texto = JSON.stringify({ v: 3, n: nInteraccion, f: OVA.finalizado ? 1 : 0, e: estado });\n      if (texto.length > LIMITE_SUSPEND) {\n        console.error('[OVA] El estado ocupa ' + texto.length + ' caracteres; SCORM 1.2 admite 4096. Guarde menos datos.');\n        return;\n      }\n      escribir('cmi.suspend_data', texto);\n      if (ubicacion != null) escribir('cmi.core.lesson_location', limpiar(ubicacion, 255));\n      escribir('cmi.core.session_time', tiempoScorm(Date.now() - inicio));\n      confirmar();\n    },\n\n    /* r.clave: identificador estable de la pregunta o palabra (no su posición en pantalla).\n       r.id se acepta por compatibilidad con OVA de la v2 y se usa tal cual. */\n    registrar: function (r) {\n      var ahora = Date.now(), lat = ahora - ultimaRespuesta;\n      ultimaRespuesta = ahora;\n      if (OVA.soloLectura) return;\n      var etiqueta = r.clave != null ? idLegible(r.clave) : limpiar(r.id || ('i' + nInteraccion), 255).replace(/[^A-Za-z0-9_.-]/g, '_');\n      var i = nInteraccion++, p = 'cmi.interactions.' + i + '.';\n      var tipos = ['true-false', 'choice', 'fill-in', 'matching', 'performance', 'sequencing', 'likert', 'numeric'];\n      escribir(p + 'id', etiqueta);\n      escribir(p + 'type', tipos.indexOf(r.tipo) >= 0 ? r.tipo : 'performance');\n      escribir(p + 'student_response', limpiar(r.respuesta, 255));\n      if (r.esperada != null) escribir(p + 'correct_responses.0.pattern', limpiar(r.esperada, 255));\n      escribir(p + 'result', r.correcta === true ? 'correct' : r.correcta === false ? 'wrong' : 'neutral');\n      escribir(p + 'latency', tiempoScorm(lat));\n      var d = new Date();\n      escribir(p + 'time', [d.getHours(), d.getMinutes(), d.getSeconds()].map(function (n) { return (n < 10 ? '0' : '') + n; }).join(':'));\n      // El enunciado no viaja en SCORM 1.2: se deja una sola vez en cmi.comments para el informe.\n      if (r.descripcion) comentar(etiqueta, r.descripcion);\n      if (estadoActual !== null) OVA.guardar(estadoActual);\n      else confirmar();\n    },\n\n    /* resumen (opcional): { aciertos, conAyuda, total, ayudas, segundos }. Se escribe como objetivos\n       con nombre propio y como la línea [RESUMEN] de cmi.comments. Solo la primera vez por intento. */\n    finalizar: function (puntaje, resumen) {\n      if (OVA.soloLectura || terminado || OVA.finalizado) return false;\n      var n = Math.max(0, Math.min(100, Math.round(Number(puntaje) || 0)));\n      resumen = resumen || {};\n      var seg = resumen.segundos != null ? resumen.segundos : (Date.now() - inicio) / 1000;\n      var obj = [['Nota_0a100', n]];\n      if (resumen.aciertos != null) obj.push(['Aciertos_sin_ayuda', resumen.aciertos]);\n      if (resumen.conAyuda != null) obj.push(['Aciertos_con_ayuda', resumen.conAyuda]);\n      if (resumen.total != null) obj.push(['Preguntas_total', resumen.total]);\n      if (resumen.ayudas != null) obj.push(['Ayudas_usadas', resumen.ayudas]);\n      if (resumen.desafios != null) obj.push(['Desafios_logrados', resumen.desafios]);\n      obj.push(['Minutos', Math.round(seg / 60)]);\n      var base = parseInt(leer('cmi.objectives._count'), 10);\n      if (isNaN(base)) base = 0;\n      obj.forEach(function (o, k) {\n        var q = 'cmi.objectives.' + (base + k) + '.';\n        escribir(q + 'id', o[0]);\n        escribir(q + 'score.min', '0');\n        escribir(q + 'score.max', '100');\n        escribir(q + 'score.raw', String(Math.max(0, Math.min(100, Math.round(Number(o[1]) || 0)))));\n        escribir(q + 'status', 'completed');\n      });\n      // El informe de Objetivos de Moodle 4.5.14 no pinta las celdas (error de su consulta: lee\n      // «scoid» y selecciona «ss.id»; comprobado en el Moodle local el 28-oct-2026). Por eso el mismo\n      // resumen va también como interacciones RES_*, que sí salen en Informes → Interacciones y en el CSV.\n      obj.forEach(function (o) {\n        var q = 'cmi.interactions.' + (nInteraccion++) + '.';\n        escribir(q + 'id', 'RES_' + slug(o[0], 40));\n        escribir(q + 'type', 'numeric');\n        escribir(q + 'student_response', String(Math.round(Number(o[1]) || 0)));\n        escribir(q + 'result', 'neutral');\n      });\n      var partes = ['Nota ' + n + '/100'];\n      if (resumen.aciertos != null && resumen.total != null) partes.push(resumen.aciertos + ' de ' + resumen.total + ' sin ayuda');\n      if (resumen.conAyuda) partes.push(resumen.conAyuda + ' con ayuda');\n      if (resumen.ayudas != null) partes.push(resumen.ayudas + (resumen.ayudas === 1 ? ' ayuda' : ' ayudas'));\n      partes.push(minSeg(seg));\n      comentar('RESUMEN', partes.join(' · '));\n\n      escribir('cmi.core.score.min', '0');\n      escribir('cmi.core.score.max', '100');\n      escribir('cmi.core.score.raw', String(n));\n      escribir('cmi.core.lesson_status', 'completed');\n      escribir('cmi.core.session_time', tiempoScorm(Date.now() - inicio));\n      OVA.finalizado = true;\n      if (estadoActual !== null) OVA.guardar(estadoActual); else confirmar();\n      return true;\n    },\n\n    salir: function () {\n      if (terminado || !api) return;\n      terminado = true;\n      if (!OVA.soloLectura) {\n        escribir('cmi.core.session_time', tiempoScorm(Date.now() - inicio));\n        escribir('cmi.core.exit', OVA.finalizado ? '' : 'suspend');\n        confirmar();\n      }\n      try { api.LMSFinish(''); } catch (e) {}\n    }\n  };\n\n  window.OVA = OVA;\n})();\n\n<\/script>\n  <script>\n/*\n * marco.js — Marco común de los OVA del kit Guilford v3 (diseño estándar de todos los tipos).\n * Herramienta preexistente del contratista (Anexo E). No editar dentro de un OVA:\n * se corrige en _kit/motores/pantalla/ y se vuelve a copiar.\n *\n * Dibuja alrededor de <main id=\"ova-area\"> la cabecera institucional, la barra superior\n * (contador, puntos, racha, tiempo, desafíos y botones), la barra de progreso, los avisos,\n * el confeti y las ventanas de resultado, ayuda y respuestas del docente. Requiere ova-scorm.js.\n *\n *   const M = Marco.iniciar({\n *     meta: DATOS.meta,                  // { codigo, titulo, asignatura, grado, periodo, nivel }\n *     sigla: 'CRU',                      // prefijo de las interacciones en Moodle\n *     etiquetaTotal: 'Palabras', total: 8,\n *     desafios: [{ id: 'primer', num: 'I', nombre: 'Primer acierto', texto: 'Resuelve…', puntos: 100 }],\n *                                        // solo PREMIAN: dan puntos extra y medalla, nunca tocan la nota\n *     acciones: [{ id: 'btn-comprobar', texto: 'Comprobar', primario: true, alPulsar: fn }],\n *     panoramica: true,                  // tarjeta 16:9 fija en escritorio (si la actividad cabe)\n *     mapa: () => [{ clave, enunciado, esperada }]   // todas las preguntas posibles (para el docente)\n *   });\n *   M.sesion                       // lo que devolvió OVA.iniciar: { modo, estado }\n *   M.avance(n)                    // «n / total» y barra de progreso\n *   M.acierto(puntosBase)          // suma puntos (×2 con racha de 3 o más) y sube la racha\n *   M.fallo()                      // corta la racha\n *   M.sumar(puntos) · M.medalla(id) · M.aviso(texto, dorado) · M.sonido('ok'|'mal'|'logro'|'clic')\n *   M.audio('audio/archivo.mp3')   // reproduce un audio del OVA (lo pide el estudiante con un botón)\n *   M.ayuda(titulo, texto)         // ventana de pista\n *   M.retro({ ok, titulo, texto, html, boton, alContinuar, secundario: { texto, alPulsar } })\n *        → ventana de retroalimentación al frente (correcto / esta vez no), con «Continuar» DENTRO.\n *          Estándar de todos los tipos: la retroalimentación nunca se pinta dentro de la actividad\n *          (no mueve botones ni abre barras de desplazamiento). M.retroAbierta() dice si está a la vista.\n *   M.segundos() · M.detener() · M.reanudar()\n *   M.estado() / M.restaurar(e)    // puntos, tiempo, racha y medallas para guardar con OVA.guardar\n *   M.terminar({ nota, aciertos, conAyuda, total, ayudas, mensaje, alReintentar })\n *        → envía la nota UNA vez (OVA.finalizar) con el resumen para el docente y muestra el resultado.\n */\n(function () {\n  'use strict';\n\n  function el(tag, attrs, hijos) {\n    var e = document.createElement(tag);\n    Object.keys(attrs || {}).forEach(function (k) {\n      if (k === 'texto') e.textContent = attrs[k];\n      else if (k === 'clase') e.className = attrs[k];\n      else e.setAttribute(k, attrs[k]);\n    });\n    (hijos || []).forEach(function (h) { if (h) e.appendChild(typeof h === 'string' ? document.createTextNode pista: \"Los tres ángulos interiores suman 180°: halla el que falta.\" },\n        { texto: \"Lados de 7, 24 y 25 cm\", grupo: \"rectangulo\", clave: \"a1_lados_7_24_25\", explicacion: \"7<sup>2</sup> + 24<sup>2</sup> = 49 + 576 = 625 = 25<sup>2</sup>: se cumple Pitágoras, así que es rectángulo.\", pista: \"Compara 25<sup>2</sup> con 7<sup>2</sup> + 24<sup>2</sup>.\" },\n        { texto: \"Lados de 6, 7 y 10 cm\", grupo: \"obtusangulo\", clave: \"a1_lados_6_7_10\", explicacion: \"6<sup>2</sup> + 7<sup>2</sup> = 85 es menor que 10<sup>2</sup> = 100: el ángulo opuesto al lado mayor es obtuso.\", pista: \"Compara 10<sup>2</sup> con 6<sup>2</sup> + 7<sup>2</sup>.\" },\n        { texto: \"Lados de 5, 6 y 7 cm\", grupo: \"acutangulo\", clave: \"a1_lados_5_6_7\", explicacion: \"5<sup>2</sup> + 6<sup>2</sup> = 61 es mayor que 7<sup>2</sup> = 49: hasta el ángulo mayor es agudo, así que es acutángulo.\", pista: \"Compara 7<sup>2</sup> con 5<sup>2</sup> + 6<sup>2</sup>.\" },\n        { texto: \"Triángulo equilátero\", grupo: \"acutangulo\", clave: \"a1_equilatero\", explicacion: \"Sus tres ángulos son iguales y suman 180°: cada uno mide 60°, y los tres son agudos.\", pista: \"¿Cuánto mide cada ángulo si los tres lados son iguales?\" },\n        { texto: \"Isósceles cuyo ángulo desigual mide 100°\", grupo: \"obtusangulo\", clave: \"a1_isosceles_100\", explicacion: \"El ángulo de 100° es obtuso; los otros dos miden (180° − 100°) ÷ 2 = 40°. Ser isósceles habla de los lados, no de los ángulos.\", pista: \"Ser isósceles habla de los lados; mira el ángulo que te dan.\" }\n      ]\n    },\n    {\n      modo: \"emparejar\", clave: \"a2\",\n      titulo: \"El vocabulario del ingeniero\",\n      consigna: \"Lleva a cada término su definición. <b>Sobran dos tarjetas</b>: son errores que se cometen a menudo.\",\n      pista: \"Piensa primero en el triángulo rectángulo: ¿dónde está el ángulo recto y qué lados lo forman?\",\n      parejas: [\n        { concepto: \"Hipotenusa\", pareja: \"Lado opuesto al ángulo recto; es el más largo.\", clave: \"a2_hipotenusa\", explicacion: \"La hipotenusa está frente al ángulo recto y es el lado más largo. El lado que está junto al ángulo recto es un cateto, no la hipotenusa.\", pista: \"Busca el lado que «mira» de frente al ángulo de 90°.\" },\n        { concepto: \"Catetos\", pareja: \"Los dos lados que forman el ángulo recto.\", clave: \"a2_catetos\", explicacion: \"Los catetos son los dos lados que se encuentran en el ángulo recto.\", pista: \"Son dos, y el ángulo de 90° queda entre ellos.\" },\n        { concepto: \"Triángulo isósceles\", pareja: \"Tiene dos lados iguales.\", clave: \"a2_isosceles\", explicacion: \"Isósceles significa «piernas iguales»: tiene dos lados con la misma medida.\", pista: \"Viene del griego: «piernas iguales».\" },\n        { concepto: \"Triángulo escaleno\", pareja: \"Sus tres lados tienen medidas diferentes.\", clave: \"a2_escaleno\", explicacion: \"En el escaleno ninguna medida se repite: sus tres lados son distintos.\", pista: \"Ninguna medida se repite.\" },\n        { concepto: \"Ángulo exterior\", pareja: \"Es igual a la suma de los dos ángulos interiores que no están a su lado.\", clave: \"a2_angulo_exterior\", explicacion: \"El ángulo exterior es igual a la suma de los dos interiores que no están a su lado: con 50° y 70° mide 120°. «180° menos los otros dos» da el tercer ángulo interior, no el exterior.\", pista: \"Se forma al prolongar un lado; recuerda el ejemplo de 50° y 70°.\" },\n        { concepto: \"Triángulos congruentes\", pareja: \"Tienen igual forma y tamaño.\", clave: \"a2_congruencia\", explicacion: \"Dos triángulos congruentes tienen la misma forma y el mismo tamaño: al ponerlos uno sobre otro, coinciden por completo.\", pista: \"Si pones uno sobre el otro, coinciden por completo.\" }\n      ],\n      distractores: [\"El lado que está junto al ángulo recto.\", \"Es igual a 180° menos la suma de los otros dos ángulos.\"]\n    },\n    {\n      modo: \"completar\", clave: \"a3\",\n      titulo: \"La cercha diagonal\",\n      consigna: \"Completa el informe de cálculo con las tarjetas del banco. <b>Hay tarjetas que sobran.</b>\",\n      texto: [\n        \"La relación de Pitágoras es [[a<sup>2</sup> + b<sup>2</sup> = c<sup>2</sup>|formula]], donde c es la [[hipotenusa]].\",\n        \"Los catetos de la cercha miden 9 m y 12 m: c<sup>2</sup> = 81 + [[144|cuadrado_12]] = [[225|c_cuadrado]], así que c = [[15|lado_15]] m.\",\n        \"Para hallar un cateto, los cuadrados se [[restan]]: si la hipotenusa mide 10 m y un cateto 6 m, el otro cateto mide [[8|cateto_8]] m.\"\n      ],\n      pistas: {\n        formula: \"Los tres lados van elevados al cuadrado.\",\n        hipotenusa: \"Es el lado frente al ángulo de 90°.\",\n        cuadrado_12: \"Multiplica 12 por sí mismo.\",\n        c_cuadrado: \"Suma los dos cuadrados que ya tienes.\",\n        lado_15: \"No te quedes en c<sup>2</sup>: falta sacar la raíz cuadrada.\",\n        restan: \"Un cateto nunca puede ser más largo que la hipotenusa.\",\n        cateto_8: \"Calcula 10<sup>2</sup> − 6<sup>2</sup> y luego saca la raíz cuadrada.\"\n      },\n      explicaciones: {\n        formula: \"En el teorema de Pitágoras van los cuadrados: a<sup>2</sup> + b<sup>2</sup> = c<sup>2</sup>. Escribir a + b = c es un error frecuente.\",\n        hipotenusa: \"c es el lado frente al ángulo recto: la hipotenusa.\",\n        cuadrado_12: \"12<sup>2</sup> = 12 × 12 = 144.\",\n        c_cuadrado: \"81 + 144 = 225: ese número es c<sup>2</sup>, todavía no c.\",\n        lado_15: \"c = √225 = 15. Si te quedas en 225, olvidaste la raíz.\",\n        restan: \"Para un cateto se despeja b<sup>2</sup> = c<sup>2</sup> − a<sup>2</sup>: los cuadrados se restan, porque un cateto es más corto que la hipotenusa.\",\n        cateto_8: \"10<sup>2</sup> − 6<sup>2</sup> = 100 − 36 = 64 y √64 = 8. El 64 es el cuadrado del cateto, no el cateto.\"\n      },\n      distractores: [\"a + b = c\", \"cateto\", \"21\", \"suman\", \"64\"]\n    },\n    {\n      modo: \"ordenar\", clave: \"a4\",\n      titulo: \"La escalera de mantenimiento\",\n      consigna: \"Una escalera de 5 m se apoya en una pared con su base a 1,5 m. Ordena los pasos para saber a qué altura toca la pared, del primero (arriba) al último.\",\n      pista: \"Primero se dibuja y se nombran los lados; después se plantea, se calcula y al final se saca la raíz.\",\n      pasos: [\n        { texto: \"Dibuja la pared, el piso y la escalera, y marca el ángulo recto entre la pared y el piso.\", clave: \"a4_dibujar\", explicacion: \"Primero se dibuja: sin el dibujo no se sabe dónde está el ángulo recto.\" },\n        { texto: \"Identifica la hipotenusa (la escalera, 5 m) y el cateto conocido (1,5 m sobre el piso).\", clave: \"a4_identificar\", explicacion: \"En el dibujo, la escalera queda frente al ángulo recto: es la hipotenusa (5 m). El piso da un cateto (1,5 m).\" },\n        { texto: \"Plantea la resta de cuadrados: h<sup>2</sup> = 5<sup>2</sup> − 1,5<sup>2</sup>.\", clave: \"a4_plantear\", explicacion: \"Se busca un cateto, así que los cuadrados se restan: h<sup>2</sup> = 5<sup>2</sup> − 1,5<sup>2</sup>.\" },\n        { texto: \"Calcula: h<sup>2</sup> = 25 − 2,25 = 22,75.\", clave: \"a4_calcular\", explicacion: \"5<sup>2</sup> = 25 y 1,5<sup>2</sup> = 2,25; la resta da 22,75. Eso todavía es h<sup>2</sup>, no h.\" },\n        { texto: \"Saca la raíz y redondea: h = √22,75 ≈ 4,77 m.\", clave: \"a4_raiz\", explicacion: \"Al final se saca la raíz: h = √22,75 ≈ 4,77 m, menos que los 5 m de la escalera, como debe ser.\" }\n      ]\n    }\n  ]\n};\n\n<\/script>\n  <script>\n/*\n * app.js — Motor del tipo «Arrastrar, clasificar y relacionar» (sigla ARR) · kit Guilford v3.\n * Herramienta del kit: no se edita dentro de un OVA (se corrige en _kit/motores/arrastrar/).\n * Todo el contenido vive en js/datos.js (window.DATOS). Contrato: _kit/motores/CONTRATO-MOTOR.md.\n *\n * Un OVA es una secuencia de 2 a 4 actividades; cada una tie alize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase()\n      .replace(/[^a-z0-9]+/g, '_').replace(/^_+|_+$/g, '').slice(0, max || 40) || 'x';\n  }\n  var PERMITIDAS = { B: 1, STRONG: 1, I: 1, EM: 1, SUP: 1, SUB: 1, BR: 1, U: 1 };\n  /* HTML simple (negrita, cursiva, sup, sub, br): lo demás se queda como texto. */\n  function fragmento(html) {\n    var plantilla = document.createElement('template');\n    plantilla.innerHTML = String(html == null ? '' : html);\n    var out = document.createDocumentFragment();\n    (function copiar(origen, destino) {\n      origen.childNodes.forEach(function (n) {\n        if (n.nodeType === 3) destino.appendChild(document.createTextNode(n.textContent));\n        else if (n.nodeType === 1) {\n          if (PERMITIDAS[n.tagName]) { var e = document.createElement(n.tagName.toLowerCase()); destino.appendChild(e); copiar(n, e); }\n          else copiar(n, destino);\n        }\n      });\n    })(plantilla.content, out);\n    return out;\n  }\n  function plano(html) {\n    var t = document.createElement('template');\n    t.innerHTML = String(html == null ? '' : html).replace(/<sup>\\s*2\\s*<\\/sup>/gi, '²').replace(/<sup>\\s*3\\s*<\\/sup>/gi, '³');\n    return (t.content.textContent || '').replace(/\\s+/g, ' ').trim();\n  }\n  function norm(t) { return plano(t).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/\\s+/g, ''); }\n  function h(tag, attrs, hijos) {\n    var e = document.createElement(tag);\n    Object.keys(attrs || {}).forEach(function (k) {\n      var v = attrs[k];\n      if (v == null || v === false) return;\n      if (k === 'clase') e.className = v;\n      else if (k === 'texto') e.textContent = v;\n      else if (k === 'html') e.appendChild(fragmento(v));\n      else e.setAttribute(k, v === true ? '' : v);\n    });\n    (hijos || []).forEach(function (x) { if (x) e.appendChild(typeof x === 'string' ? document.createTextNode(x) : x); });\n    return e;\n  }\n  function barajar(a) {\n    a = a.slice();\n    for (var i = a al — Gimnasio Campestre de Guilford (fuente única del kit)\n   Colores tomados por muestreo del sitio web y del logotipo institucional.\n   Los motores y plantillas usan SOLO estas variables. No copie los valores\n   a otros archivos: si cambia un color, se cambia aquí.\n   ========================================================================= */\n@import url('https://fonts.googleapis.com/css2?family=Bitter:wght@600;700&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap');\n\n:root {\n  --g-verde: #35993a;        /* árbol del logotipo */\n  --g-verde-osc: #005d31;    /* titulares del sitio */\n  --g-verde-tinte: #eaf5eb;\n  --g-verde-borde: #cfe6d1;\n  --g-azul: #394e65;         /* navegación principal */\n  --g-azul-osc: #1f3247;\n  --g-azul-tinte: #eef1f5;\n  --g-dorado: #d3a85f;       /* sello 26 años */\n  --g-dorado-osc: #ba934f;\n  --g-dorado-tinte: #fbf4e7;\n\n  --g-tinta: #23282d;\n  --g-texto: #3d4650;\n  --g-suave: #5f6b76;        /* contraste 5,3:1 sobre blanco */\n  --g-linea: #e2e6ea;\n  --g-fondo: #f4f6f7;\n  --g-papel: #ffffff;\n  --g-ok: #2e7d32;\n  --g-alerta: #8a5300;\n  --g-error: #b3261e;\n\n  /* Acento por nivel: <body data-nivel=\"aprendiz|novato\"> */\n  --nivel: var(--g-verde);\n  --nivel-osc: var(--g-verde-osc);\n  --nivel-tinte: var(--g-verde-tinte);\n\n  --serif: 'Bitter', Georgia, 'Times New Roman', serif;\n  --sans: 'Atkinson Hyperlegible', Verdana, 'Segoe UI', system-ui, sans-serif;\n  --r: 10px;\n  --r-l: 16px;\n  --sombra: 0 1px 2px rgba(35,40,45,.06), 0 4px 14px rgba(35,40,45,.06);\n}\nbody[data-nivel=\"novato\"] { --nivel: var(--g-azul); --nivel-osc: var(--g-azul-osc); --nivel-tinte: var(--g-azul-tinte); }\n\n</style>\n  <style>\n/* Componentes de los OVA de una pantalla (simulador, juego). Requiere guilford.css antes. */\n*, *::before, *::after { box-sizing: border-box; }\nhtml { -webkit-text-size-adjust: 100%; }\nbody {\n  margin: 0; background: var(--g-fondo); color: var(--g-texto);\n  font-family: var(--san
